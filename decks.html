<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLCTC1 – Cosmic 1200 Decks</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 16px #0ea5e9;
      text-align: center;
    }

    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #a5b4fc;
      margin-bottom: 8px;
    }

    .glow-card {
      width: 100%;
      max-width: 1300px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 14px;
      padding: 32px;
      box-shadow:
        0 0 25px rgba(56, 189, 248, 0.35),
        0 0 60px rgba(129, 140, 248, 0.35);
      border: 1px solid rgba(56, 189, 248, 0.5);
      margin-top: 10px;
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 60px;
      margin-top: 20px;
    }

    .deck {
      background: rgba(2, 6, 23, 0.9);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .deck h3 {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #38bdf8;
      margin-bottom: 20px;
      text-align: center;
    }

    .deck-wheel-wrap {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 40px;
    }

    .deck-wheel {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 40%, #000 100%);
      border: 8px solid #38bdf8;
      box-shadow:
        0 0 40px rgba(56, 189, 248, 0.9),
        0 0 80px rgba(129, 140, 248, 0.7);
      position: relative;
      overflow: hidden;
      transform-origin: center center;
    }

    .deck-wheel.spin {
      animation: spinWheel 2.5s linear infinite;
    }

    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .deck-wheel-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90px;
      height: 90px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8, #0ea5e9);
      box-shadow: 0 0 30px rgba(56, 189, 248, 1);
    }

    .deck-wheel-ring {
      position: absolute;
      top: 24px;
      left: 24px;
      width: calc(100% - 48px);
      height: calc(100% - 48px);
      border-radius: 50%;
      border: 3px dashed rgba(129, 140, 248, 0.9);
    }

    .led-ring {
      position: absolute;
      top: 12px;
      left: 12px;
      width: calc(100% - 24px);
      height: calc(100% - 24px);
      border-radius: 50%;
      border: 3px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
      opacity: 0.85;
    }

    .chakra-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 14px currentColor;
    }

    .chakra-root   { color:#ef4444; bottom:0; left:50%; transform:translateX(-50%); }
    .chakra-sacral { color:#f97316; bottom:22%; left:82%; }
    .chakra-solar  { color:#eab308; bottom:50%; right:0; transform:translateY(50%); }
    .chakra-heart  { color:#22c55e; top:50%; right:0; transform:translateY(-50%); }
    .chakra-throat { color:#0ea5e9; top:22%; right:22%; }
    .chakra-third  { color:#6366f1; top:0; left:50%; transform:translateX(-50%); }
    .chakra-crown  { color:#a855f7; top:22%; left:22%; }

    .pitch-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-right: 20px;
    }

    .pitch-wrap label {
      font-size: 0.75rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .pitch-slider {
      -webkit-appearance: slider-vertical;
      writing-mode: bt-lr;
      width: 20px;
      height: 230px;
      background: #0b1120;
      border-radius: 10px;
      box-shadow: inset 0 0 14px rgba(56, 189, 248, 0.6);
    }

    .pitch-slider::-webkit-slider-thumb {
      width: 28px;
      height: 28px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 16px #38bdf8;
      cursor: pointer;
    }

    .wave-strip {
      width: 100%;
      height: 70px;
      margin-top: 26px;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.12), rgba(129, 140, 248, 0.32));
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.25);
      overflow: hidden;
      position: relative;
    }

    .wave-bar {
      position: absolute;
      width: 200%;
      height: 100%;
      background-image: linear-gradient(135deg,
        rgba(56, 189, 248, 0.6) 0%,
        rgba(129, 140, 248, 0.6) 25%,
        rgba(236, 72, 153, 0.6) 50%,
        rgba(34, 197, 94, 0.6) 75%,
        rgba(56, 189, 248, 0.6) 100%);
      opacity: 0.5;
      animation: waveMove 10s linear infinite;
    }

    @keyframes waveMove {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    button {
      padding: 9px 18px;
      border-radius: 999px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      background: linear-gradient(90deg, #22c55e, #06b6d4);
      color: #020617;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.8);
      transform: translateY(-1px);
    }

    button.secondary {
      background: linear-gradient(90deg, #6366f1, #ec4899);
      color: #fff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    .transport-row {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .slider-wrap {
      margin-top: 32px;
      text-align: center;
    }

    .slider-wrap label {
      font-size: 0.75rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .slider {
      width: 80%;
      margin-top: 10px;
    }

    .eq-row {
      margin-top: 34px;
      display: flex;
      justify-content: center;
      gap: 26px;
      flex-wrap: wrap;
    }

    .fx-row {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 26px;
      flex-wrap: wrap;
    }

    .eq-knob {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .eq-knob span {
      margin-bottom: 6px;
    }

    .eq-knob input {
      width: 160px;
    }

    .crossfader-wrap {
      margin-top: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .crossfader-labels {
      display: flex;
      justify-content: space-between;
      width: 90%;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .crossfader {
      -webkit-appearance: none;
      appearance: none;
      width: 90%;
      height: 20px;
      background: #050708;
      border-radius: 8px;
      box-shadow:
        inset 0 0 10px #000,
        0 0 10px rgba(56, 189, 248, 0.35);
      outline: none;
    }

    .crossfader::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 40px;
      height: 14px;
      background: #38bdf8;
      border-radius: 4px;
      box-shadow: 0 0 16px #38bdf8;
      cursor: pointer;
      margin-top: 3px;
    }

    .crossfader::-moz-range-thumb {
      width: 40px;
      height: 14px;
      background: #38bdf8;
      border-radius: 4px;
      box-shadow: 0 0 16px #38bdf8;
      cursor: pointer;
    }

    .visualizer {
      width: 100%;
      height: 160px;
      background: radial-gradient(circle at center, #020617 0%, #000 60%);
      border-radius: 12px;
      margin-top: 32px;
      box-shadow: inset 0 0 20px rgba(129, 140, 248, 0.25);
      position: relative;
      overflow: hidden;
    }

    .visual-orb {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8, transparent);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.9);
      animation: orbPulse 5s ease-in-out infinite;
    }

    @keyframes orbPulse {
      0%   { transform: translate(10%, 50%) scale(1);   opacity: 0.7; }
      50%  { transform: translate(70%, 20%) scale(1.5); opacity: 1;   }
      100% { transform: translate(40%, 70%) scale(1);   opacity: 0.7; }
    }

    .library-list {
      margin-top: 20px;
      background: rgba(2, 6, 23, 0.8);
      padding: 16px;
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .library-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(31, 41, 55, 0.8);
      font-size: 0.85rem;
      gap: 12px;
      flex-wrap: wrap;
    }

    .library-item:last-child {
      border-bottom: none;
    }

    #banks {
      margin-top: 24px;
    }

    .banks-grid {
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .bank-btn {
      background: radial-gradient(circle, #38bdf8 0%, #020617 80%);
      border: 2px solid #38bdf8;
      color: #020617;
      font-weight: 700;
      border-radius: 999px;
      padding: 6px 0;
      cursor: pointer;
      font-size: 0.8rem;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      transition: 0.2s;
    }

    .bank-btn:hover {
      background: #f9fafb;
      color: #020617;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.9);
    }

    #bankTracks {
      margin-top: 16px;
    }

    .bank-track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(31, 41, 55, 0.8);
      font-size: 0.85rem;
      gap: 12px;
      flex-wrap: wrap;
    }

    .bank-track-item:last-child {
      border-bottom: none;
    }

    nav {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    nav a {
      color: #38bdf8;
      text-decoration: none;
      margin: 0 6px;
    }

    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <h1>GLCTC1 – Cosmic 1200 Decks</h1>

  <div class="glow-card">
    <h2>Cosmic 1200 Twin Decks</h2>

    <div class="deck-grid">
      <!-- DECK A -->
      <div class="deck" id="deckA">
        <h3>Deck A</h3>

        <div class="deck-wheel-wrap">
          <div class="deck-wheel" id="deckAWheel">
            <div class="deck-wheel-inner"></div>
            <div class="deck-wheel-ring"></div>
            <div class="led-ring" id="deckALed"></div>

            <div class="chakra-dot chakra-root"></div>
            <div class="chakra-dot chakra-sacral"></div>
            <div class="chakra-dot chakra-solar"></div>
            <div class="chakra-dot chakra-heart"></div>
            <div class="chakra-dot chakra-throat"></div>
            <div class="chakra-dot chakra-third"></div>
            <div class="chakra-dot chakra-crown"></div>
          </div>

          <div class="pitch-wrap">
            <label>Pitch</label>
            <input type="range" min="0.5" max="1.5" step="0.01"
                   class="pitch-slider"
                   oninput="setPitch('A', this.value)">
          </div>
        </div>

        <audio id="deckAAudio" controls style="margin-top:26px; width:100%;"></audio>

        <div class="wave-strip">
          <div class="wave-bar"></div>
        </div>

        <div class="transport-row">
          <button onclick="playDeck('A')">Play</button>
          <button onclick="stopDeck('A')">Stop</button>
          <button class="secondary" onclick="syncDeck('A','B')">Sync → B</button>
          <button onclick="setCue('A')">Cue</button>
          <button onclick="loopDeck('A')">Loop</button>
        </div>

        <div class="slider-wrap">
          <label>Volume</label>
          <input type="range" min="0" max="1" step="0.01"
                 class="slider" oninput="setVolume('A', this.value)">
        </div>

        <div class="eq-row">
          <div class="eq-knob">
            <span>High</span>
            <input type="range" min="0" max="2" step="0.01"
                   oninput="setEQ('A','high',this.value)">
          </div>
          <div class="eq-knob">
            <span>Low</span>
            <input type="range" min="0" max="2" step="0.01"
                   oninput="setEQ('A','low',this.value)">
          </div>
        </div>

        <div class="fx-row">
          <div class="eq-knob">
            <span>Filter</span>
            <input type="range" min="0" max="1" step="0.01"
                   oninput="setFilter('A',this.value)">
          </div>
          <div class="eq-knob">
            <span>Delay (ms)</span>
            <input type="range" min="0" max="2000" step="10"
                   oninput="setDelay('A',this.value)">
          </div>
        </div>
      </div>

      <!-- DECK B -->
      <div class="deck" id="deckB">
        <h3>Deck B</h3>

        <div class="deck-wheel-wrap">
          <div class="deck-wheel" id="deckBWheel">
            <div class="deck-wheel-inner"></div>
            <div class="deck-wheel-ring"></div>
            <div class="led-ring" id="deckBLed"></div>

            <div class="chakra-dot chakra-root"></div>
            <div class="chakra-dot chakra-sacral"></div>
            <div class="chakra-dot chakra-solar"></div>
            <div class="chakra-dot chakra-heart"></div>
            <div class="chakra-dot chakra-throat"></div>
            <div class="chakra-dot chakra-third"></div>
            <div class="chakra-dot chakra-crown"></div>
          </div>

          <div class="pitch-wrap">
            <label>Pitch</label>
            <input type="range" min="0.5" max="1.5" step="0.01"
                   class="pitch-slider"
                   oninput="setPitch('B', this.value)">
          </div>
        </div>

        <audio id="deckBAudio" controls style="margin-top:26px; width:100%;"></audio>

        <div class="wave-strip">
          <div class="wave-bar"></div>
        </div>

        <div class="transport-row">
          <button onclick="playDeck('B')">Play</button>
          <button onclick="stopDeck('B')">Stop</button>
          <button class="secondary" onclick="syncDeck('B','A')">Sync → A</button>
          <button onclick="setCue('B')">Cue</button>
          <button onclick="loopDeck('B')">Loop</button>
        </div>

        <div class="slider-wrap">
          <label>Volume</label>
          <input type="range" min="0" max="1" step="0.01"
                 class="slider" oninput="setVolume('B', this.value)">
        </div>

        <div class="eq-row">
          <div class="eq-knob">
            <span>High</span>
            <input type="range" min="0" max="2" step="0.01"
                   oninput="setEQ('B','high',this.value)">
          </div>
          <div class="eq-knob">
            <span>Low</span>
            <input type="range" min="0" max="2" step="0.01"
                   oninput="setEQ('B','low',this.value)">
          </div>
        </div>

        <div class="fx-row">
          <div class="eq-knob">
            <span>Filter</span>
            <input type="range" min="0" max="1" step="0.01"
                   oninput="setFilter('B',this.value)">
          </div>
          <div class="eq-knob">
            <span>Delay (ms)</span>
            <input type="range" min="0" max="2000" step="10"
                   oninput="setDelay('B',this.value)">
          </div>
        </div>
      </div>
    </div>

    <div class="crossfader-wrap">
      <div class="crossfader-labels">
        <span>Deck A</span>
        <span>Crossfader</span>
        <span>Deck B</span>
      </div>
      <input type="range" min="0" max="1" step="0.01"
             class="crossfader" id="crossfader"
             oninput="setCrossfader(this.value)">
    </div>

    <div class="visualizer">
      <div class="visual-orb"></div>
    </div>

    <!-- BANKS -->
    <div id="banks">
      <h2>Banks A–Z</h2>
      <div class="banks-grid">
        <button class="bank-btn" onclick="selectBank('A')">A</button>
        <button class="bank-btn" onclick="selectBank('B')">B</button>
        <button class="bank-btn" onclick="selectBank('C')">C</button>
        <button class="bank-btn" onclick="selectBank('D')">D</button>
        <button class="bank-btn" onclick="selectBank('E')">E</button>
        <button class="bank-btn" onclick="selectBank('F')">F</button>
        <button class="bank-btn" onclick="selectBank('G')">G</button>
        <button class="bank-btn" onclick="selectBank('H')">H</button>
        <button class="bank-btn" onclick="selectBank('I')">I</button>
        <button class="bank-btn" onclick="selectBank('J')">J</button>
        <button class="bank-btn" onclick="selectBank('K')">K</button>
        <button class="bank-btn" onclick="selectBank('L')">L</button>
        <button class="bank-btn" onclick="selectBank('M')">M</button>
        <button class="bank-btn" onclick="selectBank('N')">N</button>
        <button class="bank-btn" onclick="selectBank('O')">O</button>
        <button class="bank-btn" onclick="selectBank('P')">P</button>
        <button class="bank-btn" onclick="selectBank('Q')">Q</button>
        <button class="bank-btn" onclick="selectBank('R')">R</button>
        <button class="bank-btn" onclick="selectBank('S')">S</button>
        <button class="bank-btn" onclick="selectBank('T')">T</button>
        <button class="bank-btn" onclick="selectBank('U')">U</button>
        <button class="bank-btn" onclick="selectBank('V')">V</button>
        <button class="bank-btn" onclick="selectBank('W')">W</button>
        <button class="bank-btn" onclick="selectBank('X')">X</button>
        <button class="bank-btn" onclick="selectBank('Y')">Y</button>
        <button class="bank-btn" onclick="selectBank('Z')">Z</button>
      </div>

      <div id="bankTracks" class="library-list"></div>
    </div>

    <!-- MASTER LIBRARY -->
    <div class="library-list" id="masterLibraryWrapper">
      <h2>Master Library</h2>
      <div id="masterLibrary"></div>
    </div>
  </div>

  <nav>
    <span>Navigation:</span>
    <a href="index.html">Login</a> |
    <a href="upload.html">Upload</a> |
    <a href="decks.html">Decks</a>
  </nav>

  <script>
    const MASTER_LIBRARY = [
      {
        id: 'GLCTC1-001',
        title: 'Cosmic Dawn',
        artist: 'Leyton',
        file: 'tracks/cosmic-dawn.mp3'
      },
      {
        id: 'GLCTC1-002',
        title: 'Neon Temple',
        artist: 'Leyton',
        file: 'tracks/neon-temple.mp3'
      }
    ];

    const BANKS = {};

    function renderMasterLibrary() {
      const masterList = document.getElementById('masterLibrary');
      if (!masterList) return;
      masterList.innerHTML = '';

      MASTER_LIBRARY.forEach(track => {
        const div = document.createElement('div');
        div.className = 'library-item';

        div.innerHTML = `
          <div>
            <strong>${track.title}</strong> – ${track.artist}
          </div>
          <div>
            <select onchange="addToBank('${track.id}', this.value)">
              <option value="">Add to Bank…</option>
              ${"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l => `<option value="${l}">${l}</option>`).join("")}
            </select>
            <button class="secondary" onclick="loadDeck('A','${track.file}')">Load A</button>
            <button class="secondary" onclick="loadDeck('B','${track.file}')">Load B</button>
          </div>
        `;

        masterList.appendChild(div);
      });
    }

    function addToBank(trackId, bankLetter) {
      if (!bankLetter) return;

      const track = MASTER_LIBRARY.find(t => t.id === trackId);
      if (!track) return;

      if (!BANKS[bankLetter]) BANKS[bankLetter] = [];

      BANKS[bankLetter].push({
        id: track.id,
        title: track.title,
        artist: track.artist,
        file: track.file
      });

      renderBank(bankLetter);
    }

    function renderBank(bankLetter) {
      const container = document.getElementById('bankTracks');
      if (!container) return;
      container.innerHTML = '';

      const tracks = BANKS[bankLetter] || [];

      tracks.forEach(track => {
        const div = document.createElement('div');
        div.className = 'bank-track-item';

        div.innerHTML = `
          <div>
            <strong>${track.title}</strong><br>
            <span style="font-size:0.75rem; color:#9ca3af;">${track.artist}</span>
          </div>
          <div>
            <button class="secondary" onclick="loadDeck('A','${track.file}')">Load A</button>
            <button class="secondary" onclick="loadDeck('B','${track.file}')">Load B</button>
          </div>
        `;

        container.appendChild(div);
      });
    }

    function selectBank(letter) {
      renderBank(letter);
    }

    function loadDeck(deck, fileUrl) {
      const audioEl = deck === 'A'
        ? document.getElementById('deckAAudio')
        : document.getElementById('deckBAudio');

      if (!audioEl) return;
      audioEl.src = fileUrl;
      audioEl.load();
    }

    function playDeck(deck) {
      const audioEl = deck === 'A'
        ? document.getElementById('deckAAudio')
        : document.getElementById('deckBAudio');

      const wheel = deck === 'A'
        ? document.getElementById('deckAWheel')
        : document.getElementById('deckBWheel');

      const led = deck === 'A'
        ? document.getElementById('deckALed')
        : document.getElementById('deckBLed');

      if (!audioEl) return;
      audioEl.play();

      wheel.classList.add('spin');
      led.style.boxShadow = '0 0 40px rgba(56,189,248,1)';
    }

    function stopDeck(deck) {
      const audioEl = deck === 'A'
        ? document.getElementById('deckAAudio')
        : document.getElementById('deckBAudio');

      const wheel = deck === 'A'
        ? document.getElementById('deckAWheel')
        : document.getElementById('deckBWheel');

      const led = deck === 'A'
        ? document.getElementById('deckALed')
        : document.getElementById('deckBLed');

      if (!audioEl) return;
      audioEl.pause();
      audioEl.currentTime = 0;

      wheel.classList.remove('spin');
      led.style.boxShadow = '0 0 24px rgba(56,189,248,0.8)';
    }

    function syncDeck(from, to) {
      const fromEl = from === 'A'
        ? document.getElementById('deckAAudio')
        : document.getElementById('deckBAudio');

      const toEl = to === 'A'
        ? document.getElementById('deckAAudio')
        : document.getElementById('deckBAudio');

      if (!fromEl || !toEl) return;
      toEl.currentTime = fromEl.currentTime;
    }

    function setCue(deck) {
      const audioEl = deck === 'A'
        ? document.getElementById('deckAAudio')
        : document.getElementById('deckBAudio');

      if (!audioEl) return;
      audioEl.dataset.cue = audioEl.currentTime;
    }

    function loopDeck(deck) {
      const audioEl = deck === 'A'
        ? document.getElementById('deckAAudio')
        : document.getElementById('deckBAudio');

      if (!audioEl) return;
      audioEl.loop = !audioEl.loop;
      alert(`Loop ${audioEl.loop ? 'enabled' : 'disabled'} on Deck ${deck}`);
    }

    function setVolume(deck, value) {
      const audioEl = deck === 'A'
        ? document.getElementById('deckAAudio')
        : document.getElementById('deckBAudio');

      if (!audioEl) return;
      audioEl.volume = parseFloat(value);
    }

    function setPitch(deck, value) {
      const audioEl = deck === 'A'
        ? document.getElementById('deckAAudio')
        : document.getElementById('deckBAudio');

      if (!audioEl) return;
      audioEl.playbackRate = parseFloat(value);
    }

    function setEQ(deck, band, value) {
      console.log(`Deck ${deck} EQ ${band}: ${value}`);
    }

    function setFilter(deck, value) {
      console.log(`Deck ${deck} Filter: ${value}`);
    }

    function setDelay(deck, value) {
      console.log(`Deck ${deck} Delay: ${value} ms`);
    }

    function setCrossfader(value) {
      console.log('Crossfader:', value);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMasterLibrary();
    });
  </script>
</body>
</html>
