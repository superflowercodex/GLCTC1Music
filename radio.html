async function signedPath(path){

  if(!path)
    return "";

  const clean =
    String(path).trim();

  if(!clean)
    return "";

  if(
    /^https?:\/\//i.test(clean)
  )
    return clean;

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from("tracks")
      .createSignedUrl(
        clean,
        86400
      );

  if(error){

    console.error(
      "GLCTC1 STORAGE ERROR:",
      error,
      clean
    );

    return "";

  }

  return data?.signedUrl || "";

}

/* =====================================================
   LOAD MASTER LIBRARY
===================================================== */

async function loadMasterLibraryFromSupabase(){

  const pageSize = 1000;

  let from = 0;

  let all = [];

  while(true){

    const {
      data,
      error
    } =
      await supabaseClient
        .from("master_library")
        .select("*")
        .range(
          from,
          from + pageSize - 1
        );

    if(error)
      throw error;

    if(
      !data ||
      !data.length
    )
      break;

    all =
      all.concat(data);

    if(
      data.length <
      pageSize
    )
      break;

    from +=
      pageSize;

  }

  return all;

}

/* =====================================================
   TRACK KEY
===================================================== */

function radioTrackKey(track){

  if(!track)
    return "";

  return String(
    track.id_cat_no ||
    track.master_audio ||
    (
      String(track.artist || "") +
      "::" +
      String(track.title || "")
    )
  ).trim();

}


/* =====================================================
   FIND TRACK BY KEY
===================================================== */

function findRadioTrack(key){

  if(!key)
    return null;

  const target =
    String(key).trim();

  return (
    playableLibrary().find(
      track =>
        radioTrackKey(track) ===
        target
    )
    ||
    null
  );

}

/* =====================================================
   STATION POSITION
===================================================== */

function stationPosition(state){

  if(!state)
    return 0;

  let position =
    Number(
      state.position || 0
    );

  if(
    state.playing &&
    state.startedAt
  ){

    const elapsed =
      (
        Date.now() -
        Number(
          state.startedAt
        )
      ) / 1000;

    if(
      Number.isFinite(
        elapsed
      )
    ){

      position +=
        Math.max(
          0,
          elapsed
        );

    }

  }

  return Math.max(
    0,
    position
  );

}


/* =====================================================
   CREATE STATION STATE
===================================================== */

function makeStationState(
  track,
  position = 0,
  playing = true
){

  return{

    trackKey:
      radioTrackKey(
        track
      ),

    position:
      Number(
        position || 0
      ),

    playing:
      !!playing,

    shuffle:
      !!shuffleEnabled,

    startedAt:
      playing
        ? Date.now() -
          (
            Number(
              position || 0
            ) * 1000
          )
        : null,

    changedAt:
      Date.now()

  };

}


/* =====================================================
   BROADCAST / PRESENCE CHANNEL
===================================================== */

async function initialiseRadioChannel(){

  if(
    radioChannel
  )
    return;

  radioChannel =
    supabaseClient.channel(
      RADIO_CHANNEL_NAME,
      {
        config:{
          presence:{
            key:
              isAdmin
                ? ADMIN_USER_ID
                : (
                    currentUser?.id ||
                    (
                      "listener-" +
                      Math.random()
                        .toString(36)
                        .slice(2)
                    )
                  )
          },

          broadcast:{
            ack:false
          }

        }
      }
    );


  /* ---------------------------------------------------
     PRESENCE SYNC
  --------------------------------------------------- */

  radioChannel.on(
    "presence",
    {
      event:"sync"
    },
    () => {

      const state =
        radioChannel
          .presenceState();

      const adminPresence =
        state[
          ADMIN_USER_ID
        ];

      const payload =
        Array.isArray(
          adminPresence
        )
          ? adminPresence[
              adminPresence.length - 1
            ]
          : null;

      if(
        payload?.station
      ){

        receiveStationState(
          payload.station
        );

      }

    }
  );


  /* ---------------------------------------------------
     ADMIN PRESENCE JOIN
  --------------------------------------------------- */

  radioChannel.on(
    "presence",
    {
      event:"join"
    },
    ({key,newPresences}) => {

      if(
        key !== ADMIN_USER_ID
      )
        return;

      const payload =
        Array.isArray(
          newPresences
        )
          ? newPresences[
              newPresences.length - 1
            ]
          : null;

      if(
        payload?.station
      ){

        receiveStationState(
          payload.station
        );

      }

    }
  );


  /* ---------------------------------------------------
     SUBSCRIBE
  --------------------------------------------------- */

  radioChannel.subscribe(
    async status => {

      if(
        status ===
        "SUBSCRIBED"
      ){

        radioChannelReady =
          true;

        console.log(
          "✅ GLCTC1 RADIO REALTIME: SUBSCRIBED"
        );


        if(isAdmin){

          await adminInitialiseStation();

        }else{

          await listenerInitialiseStation();

        }

      }


      if(
        status ===
        "CHANNEL_ERROR"
      ){

        radioChannelReady =
          false;

        console.error(
          "GLCTC1 RADIO REALTIME CHANNEL ERROR"
        );

      }


      if(
        status ===
        "TIMED_OUT"
      ){

        radioChannelReady =
          false;

        console.error(
          "GLCTC1 RADIO REALTIME TIMED OUT"
        );

      }

    }
  );

}


/* =====================================================
   PUBLISH STATION STATE
===================================================== */

async function publishStationState(){

  if(
    !isAdmin ||
    !radioChannel ||
    !radioChannelReady ||
    !stationState
  )
    return;

  if(
    stationSyncBusy
  )
    return;

  stationSyncBusy =
    true;

  try{

    stationState.shuffle =
      !!shuffleEnabled;

    stationState.changedAt =
      Date.now();

    saveLocalStationState();

    const result =
      await radioChannel.track({
        station:{
          ...stationState
        },

        role:
          "ADMIN",

        online_at:
          new Date().toISOString()

      });

    if(
      result !== "ok" &&
      result !== undefined
    ){

      console.warn(
        "GLCTC1 RADIO PRESENCE:",
        result
      );

    }

  }catch(error){

    console.error(
      "GLCTC1 RADIO STATE PUBLISH ERROR:",
      error
    );

  }finally{

    stationSyncBusy =
      false;

  }

}


/* =====================================================
   RECEIVE STATION STATE
===================================================== */

async function receiveStationState(
  incoming
){

  if(
    isAdmin ||
    !incoming ||
    !incoming.trackKey
  )
    return;

  const track =
    findRadioTrack(
      incoming.trackKey
    );

  if(!track){

    console.warn(
      "GLCTC1 RADIO TRACK NOT FOUND:",
      incoming.trackKey
    );

    return;

  }

  const oldKey =
    stationState?.trackKey ||
    "";

  stationState =
    {
      ...incoming
    };

  saveLocalStationState();

  shuffleEnabled =
    !!stationState.shuffle;

  $("shuffleBtn")
    .classList
    .toggle(
      "active",
      shuffleEnabled
    );

  $("shuffleBtn").textContent =
    shuffleEnabled
      ? "🔀 SHUFFLE ON"
      : "🔀 SHUFFLE OFF";

  const targetPosition =
    stationPosition(
      stationState
    );


  /* ---------------------------------------------------
     SAME TRACK
  --------------------------------------------------- */

  if(
    oldKey ===
    stationState.trackKey &&
    audio.src
  ){

    const drift =
      Math.abs(
        (
          Number(
            audio.currentTime
          ) || 0
        ) -
        targetPosition
      );

    if(
      drift > 3
    ){

      try{

        audio.currentTime =
          targetPosition;

      }catch(e){}

    }

    if(
      stationState.playing &&
      audio.paused
    ){

      await attemptRadioAutoplay();

    }

    if(
      !stationState.playing &&
      !audio.paused
    ){

      audio.pause();

    }

    return;

  }


  /* ---------------------------------------------------
     NEW TRACK
  --------------------------------------------------- */

  currentTrack =
    track;

  currentIndex =
    library.indexOf(
      track
    );

  updateTrackUI();

  await playTrackAtPosition(
    track,
    targetPosition,
    stationState.playing
  );

}


/* =====================================================
   ADMIN INITIALISE STATION
===================================================== */

async function adminInitialiseStation(){

  if(
    !isAdmin ||
    stationInitialised
  )
    return;

  stationInitialised =
    true;

  const localState =
    loadLocalStationState();

  let recoveredTrack =
    localState
      ? findRadioTrack(
          localState.trackKey
        )
      : null;


  /* ---------------------------------------------------
     RECOVER EXISTING ADMIN STATION
  --------------------------------------------------- */

  if(
    recoveredTrack
  ){

    stationState =
      {
        ...localState
      };

    currentTrack =
      recoveredTrack;

    currentIndex =
      library.indexOf(
        recoveredTrack
      );

    shuffleEnabled =
      !!stationState.shuffle;

    updateTrackUI();

    const position =
      stationPosition(
        stationState
      );

    await playTrackAtPosition(
      recoveredTrack,
      position,
      stationState.playing !== false
    );

    await publishStationState();

    $("radioStatus").textContent =
      "● ADMIN RADIO • STATION RECOVERED";

    return;

  }


  /* ---------------------------------------------------
     FIRST ADMIN START
  --------------------------------------------------- */

  const list =
    playableLibrary();

  if(
    !list.length
  ){

    $("radioStatus").textContent =
      "NO MASTER AUDIO";

    return;

  }

  const track =
    chooseInitialTrack();

  currentTrack =
    track;

  currentIndex =
    library.indexOf(
      track
    );

  stationState =
    makeStationState(
      track,
      0,
      true
    );

  updateTrackUI();

  await playTrackAtPosition(
    track,
    0,
    true
  );

  await publishStationState();

  $("radioStatus").textContent =
    "● ADMIN RADIO • ON AIR";

}


/* =====================================================
   LISTENER INITIALISE STATION
===================================================== */

async function listenerInitialiseStation(){

  if(
    stationInitialised
  )
    return;

  stationInitialised =
    true;


  /* ---------------------------------------------------
     FIRST TRY LOCAL MEMORY
  --------------------------------------------------- */

  const localState =
    loadLocalStationState();

  if(localState){

    const track =
      findRadioTrack(
        localState.trackKey
      );

    if(track){

      stationState =
        localState;

      shuffleEnabled =
        !!stationState.shuffle;

      currentTrack =
        track;

      currentIndex =
        library.indexOf(
          track
        );

      updateTrackUI();

      await playTrackAtPosition(
        track,
        stationPosition(
          stationState
        ),
        stationState.playing !== false
      );

      $("radioStatus").textContent =
        "● RADIO • CONNECTING TO STATION";

    }

  }


  /* ---------------------------------------------------
     IF NO LOCAL STATE
  --------------------------------------------------- */

  if(
    !currentTrack
  ){

    const list =
      playableLibrary();

    if(list.length){

      const track =
        chooseInitialTrack();

      currentTrack =
        track;

      currentIndex =
        library.indexOf(
          track
        );

      updateTrackUI();

      /*
       * This starts the radio immediately.
       * It does NOT publish listener state.
       */

      await playTrackAtPosition(
        track,
        0,
        true
      );

    }

  }


  /* ---------------------------------------------------
     PRESENCE SYNC MAY NOW ARRIVE
     AND OVERRIDE THE LOCAL FALLBACK
  --------------------------------------------------- */

}


/* =====================================================
   INITIAL TRACK
===================================================== */

function chooseInitialTrack(){

  const list =
    playableLibrary();

  if(
    !list.length
  )
    return null;

  /*
   * Deterministic first track.
   *
   * We deliberately do NOT use Math.random()
   * when a browser is simply joining the radio.
   */

  return list[0];

}


/* =====================================================
   ADMIN NEXT TRACK
===================================================== */

async function adminNextTrack(){

  if(
    !isAdmin
  )
    return;

  const list =
    playableLibrary();

  if(
    !list.length
  )
    return;


  let nextTrack =
    null;


  if(
    shuffleEnabled
  ){

    if(
      list.length === 1
    ){

      nextTrack =
        list[0];

    }else{

      do{

        nextTrack =
          list[
            Math.floor(
              Math.random() *
              list.length
            )
          ];

      }while(
        nextTrack ===
        currentTrack
      );

    }

  }else{

    let index =
      list.indexOf(
        currentTrack
      );

    if(index < 0)
      index = -1;

    nextTrack =
      list[
        (
          index + 1
        ) %
        list.length
      ];

  }


  currentTrack =
    nextTrack;

  currentIndex =
    library.indexOf(
      nextTrack
    );

  stationState =
    makeStationState(
      nextTrack,
      0,
      true
    );

  updateTrackUI();

  await playTrackAtPosition(
    nextTrack,
    0,
    true
  );

  await publishStationState();

}


/* =====================================================
   ADMIN PREVIOUS TRACK
===================================================== */

async function adminPreviousTrack(){

  if(
    !isAdmin
  )
    return;

  const list =
    playableLibrary();

  if(
    !list.length
  )
    return;

  let index =
    list.indexOf(
      currentTrack
    );

  if(index < 0)
    index = 0;

  index =
    (
      index - 1 +
      list.length
    ) %
    list.length;

  const track =
    list[index];

  currentTrack =
    track;

  currentIndex =
    library.indexOf(
      track
    );

  stationState =
    makeStationState(
      track,
      0,
      true
    );

  updateTrackUI();

  await playTrackAtPosition(
    track,
    0,
    true
  );

  await publishStationState();

}


/* =====================================================
   ADMIN PLAY / PAUSE
===================================================== */

async function adminPlayPause(){

  if(
    !isAdmin ||
    !currentTrack
  )
    return;

  if(
    audio.paused
  ){

    const position =
      Number(
        audio.currentTime || 0
      );

    stationState =
      makeStationState(
        currentTrack,
        position,
        true
      );

    await playTrackAtPosition(
      currentTrack,
      position,
      true
    );

    await publishStationState();

    $("radioStatus").textContent =
      "● ADMIN RADIO • PLAYING";

  }else{

    const position =
      Number(
        audio.currentTime || 0
      );

    audio.pause();

    stationState =
      makeStationState(
        currentTrack,
        position,
        false
      );

    await publishStationState();

    $("radioStatus").textContent =
      "ADMIN RADIO • PAUSED";

  }

}


/* =====================================================
   PLAY TRACK AT POSITION
===================================================== */

async function playTrackAtPosition(
  track,
  position = 0,
  shouldPlay = true
){

  if(
    !track?.master_audio
  ){

    $("radioStatus").textContent =
      "NO MASTER AUDIO";

    return false;

  }

  try{

    const url =
      await signedPath(
        track.master_audio
      );

    if(!url){

      $("radioStatus").textContent =
        "AUDIO URL ERROR";

      return false;

    }


    /*
     * Signed URLs can change even for the
     * same storage object. Compare the actual
     * storage path instead of signed URL.
     */

    const existingKey =
      audio.dataset.radioTrackKey ||
      "";

    const nextKey =
      radioTrackKey(
        track
      );


    if(
      existingKey !==
      nextKey
    ){

      audio.pause();

      audio.removeAttribute(
        "src"
      );

      audio.load();

      audio.src =
        url;

      audio.dataset.radioTrackKey =
        nextKey;

      audio.load();

    }


    audio.volume =
      Number(
        $("volumeSlider").value ||
        .8
      );


    /*
     * Wait until metadata exists before seeking.
     */

    const seekTo =
      Math.max(
        0,
        Number(
          position || 0
        )
      );


    if(
      audio.readyState >= 1
    ){

      try{

        audio.currentTime =
          seekTo;

      }catch(e){}

    }else{

      await new Promise(
        resolve => {

          let done =
            false;

          const finish =
            () => {

              if(done)
                return;

              done =
                true;

              audio.removeEventListener(
                "loadedmetadata",
                finish
              );

              resolve();

            };

          audio.addEventListener(
            "loadedmetadata",
            finish,
            {
              once:true
            }
          );

          setTimeout(
            finish,
            2500
          );

        }
      );

      try{

        audio.currentTime =
          seekTo;

      }catch(e){}

    }


    if(
      shouldPlay
    ){

      const started =
        await attemptRadioAutoplay();

      if(started){

        $("radioStatus").textContent =
          isAdmin
            ? "● ADMIN RADIO • ON AIR"
            : "● RADIO • ON AIR";

      }else{

        $("radioStatus").textContent =
          "RADIO READY • TAP ONCE TO START";

      }

    }else{

      audio.pause();

      $("playBtn").textContent =
        "▶ PLAY";

    }


    await ensureAudioEngine();

    activeAnalyser =
      liveMode &&
      liveAnalyser
        ? liveAnalyser
        : radioAnalyser;

    return true;

  }catch(error){

    console.error(
      "GLCTC1 RADIO ERROR:",
      error
    );

    $("radioStatus").textContent =
      "RADIO AUDIO ERROR";

    return false;

  }

}


/* =====================================================
   AUTOPLAY
===================================================== */

async function attemptRadioAutoplay(){

  if(
    radioWakeBusy
  )
    return false;

  radioWakeBusy =
    true;

  try{

    await audio.play();

    $("playBtn").textContent =
      "⏸ PLAYING";

    disarmRadioWake();

    await ensureAudioEngine();

    return true;

  }catch(error){

    armRadioWake();

    return false;

  }finally{

    radioWakeBusy =
      false;

  }

}

/* =====================================================
   AUDIO ENGINE
===================================================== */

async function ensureAudioEngine(){

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audioCtx.state ===
      "suspended"
    ){

      await audioCtx
        .resume()
        .catch(
          () => {}
        );

    }


    if(!masterGain){

      masterGain =
        audioCtx.createGain();

      masterGain.gain.value =
        Number(
          $("masterMix").value ||
          .9
        );

      masterGain.connect(
        audioCtx.destination
      );

    }


    if(!radioSource){

      radioSource =
        audioCtx.createMediaElementSource(
          audio
        );

      radioGain =
        audioCtx.createGain();

      radioAnalyser =
        audioCtx.createAnalyser();

      radioAnalyser.fftSize =
        256;

      radioAnalyser.smoothingTimeConstant =
        .75;


      radioSource
        .connect(
          radioGain
        )
        .connect(
          radioAnalyser
        )
        .connect(
          masterGain
        );

    }


    updateAudioRouting();

    activeAnalyser =
      liveMode &&
      liveAnalyser
        ? liveAnalyser
        : radioAnalyser;

    startVisuals();

    return true;

  }catch(error){

    console.warn(
      "GLCTC1 WEB AUDIO ERROR:",
      error
    );

    return false;

  }

}


/* =====================================================
   AUDIO ROUTING
===================================================== */

function updateAudioRouting(){

  if(
    !audioCtx ||
    !radioGain ||
    !masterGain
  )
    return;


  const radioLevel =
    Number(
      $("radioMix").value
    );

  const liveLevel =
    Number(
      $("liveMix").value
    );


  radioGain.gain.setTargetAtTime(
    radioLevel,
    audioCtx.currentTime,
    .03
  );


  masterGain.gain.setTargetAtTime(
    Number(
      $("masterMix").value
    ),
    audioCtx.currentTime,
    .03
  );


  if(liveGain){

    liveGain.gain.setTargetAtTime(
      liveLevel,
      audioCtx.currentTime,
      .03
    );

  }

}


/* =====================================================
   AUTOPLAY WAKE
===================================================== */

function disarmRadioWake(){

  if(
    !radioWakeHandler
  )
    return;


  window.removeEventListener(
    "pointerdown",
    radioWakeHandler,
    true
  );

  window.removeEventListener(
    "keydown",
    radioWakeHandler,
    true
  );

  radioWakeHandler =
    null;

}


function armRadioWake(){

  if(
    radioWakeHandler
  )
    return;


  radioWakeHandler =
    async () => {

      if(
        radioWakeBusy ||
        !currentTrack
      )
        return;


      radioWakeBusy =
        true;


      try{

        const ok =
          await attemptRadioAutoplay();

        if(ok){

          $("radioStatus").textContent =
            isAdmin
              ? "● ADMIN RADIO • ON AIR"
              : "● RADIO • ON AIR";

        }

      }catch(error){

        console.warn(
          "GLCTC1 AUDIO START ERROR:",
          error
        );

      }finally{

        radioWakeBusy =
          false;

      }

    };


  window.addEventListener(
    "pointerdown",
    radioWakeHandler,
    true
  );

  window.addEventListener(
    "keydown",
    radioWakeHandler,
    true
  );

}


/* =====================================================
   RADIO ENDED
===================================================== */

audio.addEventListener(
  "ended",
  async () => {

    if(
      radioAdvanceBusy
    )
      return;


    radioAdvanceBusy =
      true;


    try{

      if(isAdmin){

        /*
         * ONLY ADMIN advances the station.
         */

        await adminNextTrack();

      }else{

        /*
         * LISTENER:
         *
         * Do not randomly choose anything.
         * Try to recover the latest station state.
         */

        const saved =
          loadLocalStationState();

        if(
          saved?.trackKey
        ){

          stationState =
            saved;

          const track =
            findRadioTrack(
              saved.trackKey
            );

          if(track){

            currentTrack =
              track;

            currentIndex =
              library.indexOf(
                track
              );

            updateTrackUI();

            await playTrackAtPosition(
              track,
              stationPosition(
                saved
              ),
              saved.playing !== false
            );

          }

        }

      }

    }finally{

      setTimeout(
        () => {

          radioAdvanceBusy =
            false;

        },
        250
      );

    }

  }
);

function duckRadio(on){

  if(
    !audioCtx ||
    !radioGain
  )
    return;


  const amount =
    Number(
      $("duckAmount").value
    );


  const target =
    on &&
    $("duckToggle").checked
      ? 1 - amount
      : Number(
          $("radioMix").value
        );


  const release =
    Number(
      $("duckRelease").value
    ) / 1000;


  radioGain.gain
    .cancelScheduledValues(
      audioCtx.currentTime
    );


  radioGain.gain
    .setTargetAtTime(
      target,
      audioCtx.currentTime,
      on ? .08 : release
    );


  $("duckState").textContent =
    on &&
    $("duckToggle").checked
      ? "🦆 RADIO DUCKED"
      : "DUCKING READY";

}

/* =====================================================
   VISUALISER
===================================================== */

function resizeCanvas(){

  const d =
    Math.min(
      window.devicePixelRatio ||
      1,
      2
    );


  const rect =
    canvas.getBoundingClientRect();


  canvas.width =
    Math.max(
      320,
      rect.width * d
    );


  canvas.height =
    Math.max(
      260,
      rect.height * d
    );

}


window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


function drawVisualiser(){

  animationId =
    requestAnimationFrame(
      drawVisualiser
    );


  const w =
    canvas.width;

  const h =
    canvas.height;

  const cx =
    w / 2;

  const cy =
    h / 2;


  let energy = 0;

  let arr = null;


  if(activeAnalyser){

    arr =
      new Uint8Array(
        activeAnalyser.frequencyBinCount
      );


    activeAnalyser
      .getByteFrequencyData(
        arr
      );


    for(
      let i = 0;
      i < arr.length;
      i++
    ){

      energy +=
        arr[i];

    }


    if(arr.length){

      energy /=
        arr.length * 255;

    }

  }


  const colors =
    palette(
      currentTrack?.chakra
    );


  const freq =
    Math.max(
      1,
      Number(
        currentTrack?.frequency_hz
      ) ||
      432
    );


  ctx.fillStyle =
    "rgba(1,2,10,.18)";


  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  ctx.save();


  ctx.translate(
    cx,
    cy
  );


  const base =
    Math.min(
      w,
      h
    ) * .18;


  const pulse =
    base *
    (
      1 +
      energy * .55
    );


  for(
    let layer = 0;
    layer < 9;
    layer++
  ){

    const rotation =
      (
        performance.now() /
        7000
      ) *
      (
        layer % 2
          ? -.45
          : .45
      ) +
      layer * .34;


    ctx.save();


    ctx.rotate(
      rotation
    );


    ctx.beginPath();


    const sides =
      12;


    for(
      let s = 0;
      s <= sides;
      s++
    ){

      const angle =
        s *
        Math.PI *
        2 /
        sides;


      const wave =
        1 +
        .12 *
        Math.sin(
          performance.now() /
          500 +
          layer +
          s +
          freq / 100
        );


      const radius =
        pulse *
        (
          1 +
          layer * .095
        ) *
        wave;


      const x =
        Math.cos(angle) *
        radius;

      const y =
        Math.sin(angle) *
        radius;


      if(s)
        ctx.lineTo(
          x,
          y
        );
      else
        ctx.moveTo(
          x,
          y
        );

    }


    ctx.closePath();


    const colour =
      colors[
        layer %
        colors.length
      ];


    ctx.strokeStyle =
      colour;


    ctx.globalAlpha =
      .22 +
      .06 * energy;


    ctx.lineWidth =
      Math.max(
        1,
        w / 700
      );


    ctx.shadowBlur =
      18;

    ctx.shadowColor =
      colour;


    ctx.stroke();


    ctx.restore();

  }


  for(
    let i = 0;
    i < 24;
    i++
  ){

    const angle =
      i *
      Math.PI *
      2 /
      24 +
      performance.now() /
      12000;


    const amp =
      arr
        ? arr[
            i % arr.length
          ] / 255
        : energy;


    const r1 =
      base * .25;


    const r2 =
      base *
      (
        1.7 +
        amp * 1.7
      );


    ctx.beginPath();


    ctx.moveTo(
      Math.cos(angle) * r1,
      Math.sin(angle) * r1
    );


    ctx.lineTo(
      Math.cos(angle) * r2,
      Math.sin(angle) * r2
    );


    const colour =
      colors[
        i % colors.length
      ];


    ctx.strokeStyle =
      colour;


    ctx.globalAlpha =
      .12 +
      amp * .25;


    ctx.lineWidth =
      2;


    ctx.stroke();

  }


  ctx.beginPath();


  ctx.arc(
    0,
    0,
    base * .23 +
      energy *
      base *
      .25,
    0,
    Math.PI * 2
  );


  ctx.fillStyle =
    colors[1];


  ctx.globalAlpha =
    .5;


  ctx.shadowBlur =
    40;

  ctx.shadowColor =
    colors[1];


  ctx.fill();


  ctx.restore();

}


function startVisuals(){

  if(!animationId)
    drawVisualiser();

}


/* =====================================================
   VIDEO PLAYER
===================================================== */

function clearVideo(){

  videoUrl = "";

  videoType = "";


  liveVideo.srcObject =
    null;


  liveVideo.style.display =
    "none";


  videoFrame.src =
    "";


  videoFrame.style.display =
    "none";


  videoShell
    .classList
    .add("empty");


  $("videoMsg")
    .classList
    .remove("hide");


  $("videoNotice").textContent =
    "NO VIDEO LOADED";


  $("liveStatus").textContent =
    "● RADIO SPACE";

}


function youtubeEmbed(url){

  try{

    const u =
      new URL(
        url
      );


    let id = "";


    if(
      u.hostname.includes(
        "youtu.be"
      )
    ){

      id =
        u.pathname.slice(1);

    }


    if(
      u.hostname.includes(
        "youtube.com"
      )
    ){

      id =
        u.searchParams.get(
          "v"
        ) ||
        u.pathname
          .split("/")
          .pop();

    }


    if(!id)
      return "";


    return(
      "https://www.youtube.com/embed/" +
      id +
      "?autoplay=1&rel=0"
    );

  }catch(error){

    return "";

  }

}


function loadVideoURL(url){

  if(!isAdmin)
    return;


  url =
    String(
      url || ""
    ).trim();


  if(!url){

    clearVideo();

    return;

  }


  clearVideo();


  const youtube =
    youtubeEmbed(
      url
    );


  if(youtube){

    videoUrl =
      youtube;

    videoType =
      "youtube";


    videoFrame.src =
      youtube;


    videoFrame.style.display =
      "block";


    videoShell
      .classList
      .remove("empty");


    $("videoMsg")
      .classList
      .add("hide");


    $("videoNotice").textContent =
      "RADIO VIDEO LOADED";


    return;

  }


  if(
    /^https?:\/\//i.test(
      url
    )
  ){

    videoUrl =
      url;

    videoType =
      "direct";


    videoFrame.src =
      url;


    videoFrame.style.display =
      "block";


    videoShell
      .classList
      .remove("empty");


    $("videoMsg")
      .classList
      .add("hide");


    $("videoNotice").textContent =
      "VIDEO URL LOADED";


    return;

  }


  $("videoNotice").textContent =
    "INVALID VIDEO URL";

}


$("loadVideoBtn").onclick =
  () => {

    if(!isAdmin)
      return;

    loadVideoURL(
      $("videoUrlInput").value
    );

  };


$("videoUrlInput")
  .addEventListener(
    "keydown",
    e => {

      if(
        !isAdmin
      )
        return;


      if(
        e.key ===
        "Enter"
      ){

        loadVideoURL(
          e.target.value
        );

      }

    }
  );


$("clearVideoBtn").onclick =
  () => {

    if(!isAdmin)
      return;


    $("videoUrlInput").value =
      "";


    clearVideo();

  };


$("fullscreenBtn").onclick =
  () => {

    const target =
      liveVideo.style.display !==
      "none"
        ? liveVideo
        : videoShell;


    (
      target.requestFullscreen ||
      target.webkitRequestFullscreen
    )?.call(
      target
    );

  };


/* =====================================================
   LIVE ROOM
===================================================== */

function artistFromURL(){

  return new URLSearchParams(
    location.search
  ).get(
    "artist"
  );

}


async function getRoom(
  artistId
){

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "glctc1_live_rooms"
      )
      .select(
        "signaling_data"
      )
      .eq(
        "user_id",
        artistId
      )
      .maybeSingle();


  if(error){

    console.error(
      "GLCTC1 ROOM ERROR:",
      error
    );

    return null;

  }


  return data;

}


/* =====================================================
   LIVE UI
===================================================== */

function setLiveUI(on){

  liveMode =
    on;


  $("goLiveBtn")
    .classList
    .toggle(
      "hide",
      on
    );


  $("endLiveBtn")
    .classList
    .toggle(
      "hide",
      !on
    );


  $("liveStatus").textContent =
    on
      ? "● LIVE ARTIST"
      : "● RADIO SPACE";


  $("videoNotice").textContent =
    on
      ? "LIVE ARTIST VIDEO CONNECTED"
      : "GLCTC1 VIDEO PLAYER";


  activeAnalyser =
    on &&
    liveAnalyser
      ? liveAnalyser
      : radioAnalyser;


  if(audioCtx)
    duckRadio(on);


  applyAdminLock();

}


/* =====================================================
   LIVE AUDIO
===================================================== */

function setupLiveAudio(stream){

  if(
    !audioCtx ||
    !stream
  )
    return;


  if(
    liveAudioSource
  ){

    try{

      liveAudioSource.disconnect();

    }catch(e){}

  }


  liveAudioSource =
    audioCtx
      .createMediaStreamSource(
        stream
      );


  liveGain =
    audioCtx.createGain();


  liveAnalyser =
    audioCtx.createAnalyser();


  liveAnalyser.fftSize =
    256;


  liveAudioSource
    .connect(
      liveGain
    )
    .connect(
      liveAnalyser
    )
    .connect(
      masterGain
    );


  liveGain.gain.value =
    Number(
      $("liveMix").value
    );


  activeAnalyser =
    liveAnalyser;

}


/* =====================================================
   CONNECT LIVE ARTIST
===================================================== */

async function connectInvitedArtist(
  artistId
){

  if(!artistId)
    return;


  liveArtistId =
    artistId;


  const room =
    await getRoom(
      artistId
    );


  if(
    !room?.signaling_data?.offer
  ){

    $("videoNotice").textContent =
      "WAITING FOR LIVE ARTIST SESSION";

    return;

  }


  const signaling =
    room.signaling_data;


  try{

    await ensureAudioEngine();


    viewerConnection?.close();


    viewerConnection =
      new RTCPeerConnection(
        RTC_CONFIG
      );


    viewerConnection.ontrack =
      e => {

        const stream =
          e.streams?.[0] ||
          new MediaStream(
            [e.track]
          );


        if(
          stream.getVideoTracks()
            .length
        ){

          liveVideo.srcObject =
            stream;


          liveVideo.muted =
            true;


          liveVideo.style.display =
            "block";


          videoFrame.style.display =
            "none";


          videoShell
            .classList
            .remove("empty");


          $("videoMsg")
            .classList
            .add("hide");


          liveVideo
            .play()
            .catch(
              () => {}
            );

        }


        if(
          stream.getAudioTracks()
            .length
        ){

          setupLiveAudio(
            new MediaStream(
              stream.getAudioTracks()
            )
          );


          duckRadio(true);

        }


        setLiveUI(true);

      };


    viewerConnection.onicecandidate =
      async e => {

        if(
          !e.candidate
        )
          return;


        const latest =
          await getRoom(
            artistId
          );


        if(!latest)
          return;


        const s =
          latest.signaling_data ||
          {};


        s.viewer_ice =
          Array.isArray(
            s.viewer_ice
          )
            ? s.viewer_ice
            : [];


        s.viewer_ice.push(
          e.candidate.toJSON()
        );


        await supabaseClient
          .from(
            "glctc1_live_rooms"
          )
          .update({
            signaling_data:s
          })
          .eq(
            "user_id",
            artistId
          );

      };


    await viewerConnection
      .setRemoteDescription(
        signaling.offer
      );


    const answer =
      await viewerConnection
        .createAnswer();


    await viewerConnection
      .setLocalDescription(
        answer
      );


    const latest =
      await getRoom(
        artistId
      );


    const s =
      latest?.signaling_data ||
      signaling;


    s.answer = {

      type:
        answer.type,

      sdp:
        answer.sdp

    };


    s.viewer_ice =
      [];


    await supabaseClient
      .from(
        "glctc1_live_rooms"
      )
      .update({
        signaling_data:s
      })
      .eq(
        "user_id",
        artistId
      );


    if(
      artistIceTimer
    )
      clearInterval(
        artistIceTimer
      );


    let applied = 0;


    artistIceTimer =
      setInterval(
        async () => {

          const r =
            await getRoom(
              artistId
            );


          const list =
            r?.signaling_data
              ?.artist_ice ||
            [];


          while(
            applied <
            list.length
          ){

            try{

              await viewerConnection
                .addIceCandidate(
                  list[
                    applied
                  ]
                );

            }catch(e){}


            applied++;

          }

        },
        1200
      );


    if(
      roomTimer
    )
      clearInterval(
        roomTimer
      );


    roomTimer =
      setInterval(
        async () => {

          const r =
            await getRoom(
              artistId
            );


          if(
            !r?.signaling_data?.offer
          ){

            stopWatching();

          }

        },
        5000
      );


    $("videoNotice").textContent =
      "LIVE SESSION CONNECTED";

  }catch(error){

    console.error(
      "GLCTC1 LIVE CONNECTION ERROR:",
      error
    );

    $("videoNotice").textContent =
      "LIVE CONNECTION ERROR";

  }

}


/* =====================================================
   STOP LIVE
===================================================== */

function stopWatching(){

  if(
    artistIceTimer
  )
    clearInterval(
      artistIceTimer
    );


  if(
    roomTimer
  )
    clearInterval(
      roomTimer
    );


  artistIceTimer =
    null;


  roomTimer =
    null;


  viewerConnection?.close();


  viewerConnection =
    null;


  liveVideo.srcObject =
    null;


  liveVideo.style.display =
    "none";


  setLiveUI(false);


  if(videoUrl){

    videoFrame.style.display =
      "block";


    videoShell
      .classList
      .remove("empty");


    $("videoMsg")
      .classList
      .add("hide");

  }else{

    clearVideo();

  }

}

===================================================== */

$("goLiveBtn").onclick =
  async () => {

    if(!isAdmin)
      return;


    const artistId =
      liveArtistId ||
      currentUser?.id;


    if(!artistId){

      $("videoNotice").textContent =
        "SIGN IN AS ARTIST OR OPEN AN ARTIST LIVE LINK";

      return;

    }


    if(
      window.GLCTC1Live?.start
    ){

      try{

        await window.GLCTC1Live
          .start(
            artistId
          );


        setLiveUI(true);

        return;

      }catch(error){

        console.error(
          "GLCTC1 LIVE START ERROR:",
          error
        );

      }

    }


    const target =
      new URL(
        "artist.html",
        window.location.href
      );


    target.searchParams.set(
      "live",
      "1"
    );


    target.searchParams.set(
      "artist",
      artistId
    );


    target.searchParams.set(
      "return",
      "radio.html"
    );


    window.open(
      target.toString(),
      "_blank",
      "noopener"
    );


    $("videoNotice").textContent =
      "ARTIST LIVE MODULE OPENED • START LIVE THERE";

  };

$("endLiveBtn").onclick =
