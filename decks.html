<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLCTC1 – Decks</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      text-align: center;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 16px #0ea5e9;
      margin-bottom: 8px;
    }
    .top-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .deck {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }
    .deck-title {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.8rem;
      color: #a5b4fc;
      margin-bottom: 8px;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    button {
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      background: linear-gradient(90deg, #22c55e, #06b6d4);
      color: #020617;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
    }
    input[type="range"] {
      width: 100%;
    }
    .slider-group {
      margin-bottom: 6px;
    }
    .slider-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 2px;
    }
    .waveform {
      width: 100%;
      height: 80px;
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1f2937;
    }
    .bottom-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }
    .panel {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
      font-size: 0.75rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.7rem;
    }
    th, td {
      padding: 4px 6px;
      border-bottom: 1px solid #1f2937;
    }
    th {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      text-align: left;
    }
    td button {
      font-size: 0.65rem;
      padding: 4px 8px;
    }
    select {
      background: #020617;
      color: #e5e7eb;
      border-radius: 6px;
      border: 1px solid #1f2937;
      padding: 4px 6px;
      font-size: 0.7rem;
    }
    .status {
      font-size: 0.7rem;
      color: #a5b4fc;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<h1>GLCTC1 – Decks</h1>

<div class="top-row">
  <!-- Deck 1 -->
  <div class="deck" id="deck1Panel">
    <div class="deck-title">Deck 1</div>

    <div class="controls-row">
      <button id="deck1Play">Play</button>
      <button id="deck1Stop">Stop</button>
      <button id="deck1Cue">Set Cue</button>
      <button id="deck1Loop">Loop</button>
      <button id="deck1Sync">Sync</button>
    </div>

    <div class="slider-group">
      <div class="slider-label">Pitch</div>
      <input type="range" id="deck1Pitch" min="0.5" max="1.5" step="0.01" value="1">
    </div>

    <div class="slider-group">
      <div class="slider-label">Volume</div>
      <input type="range" id="deck1Volume" min="0" max="1" step="0.01" value="1">
    </div>

    <canvas id="deck1Waveform" class="waveform"></canvas>

    <div class="status" id="deck1Status">No track loaded.</div>
  </div>

  <!-- Deck 2 -->
  <div class="deck" id="deck2Panel">
    <div class="deck-title">Deck 2</div>

    <div class="controls-row">
      <button id="deck2Play">Play</button>
      <button id="deck2Stop">Stop</button>
      <button id="deck2Cue">Set Cue</button>
      <button id="deck2Loop">Loop</button>
      <button id="deck2Sync">Sync</button>
    </div>

    <div class="slider-group">
      <div class="slider-label">Pitch</div>
      <input type="range" id="deck2Pitch" min="0.5" max="1.5" step="0.01" value="1">
    </div>

    <div class="slider-group">
      <div class="slider-label">Volume</div>
      <input type="range" id="deck2Volume" min="0" max="1" step="0.01" value="1">
    </div>

    <canvas id="deck2Waveform" class="waveform"></canvas>

    <div class="status" id="deck2Status">No track loaded.</div>
  </div>
</div>

<!-- Crossfader -->
<div class="panel">
  <div class="slider-group">
    <div class="slider-label">Crossfader</div>
    <input type="range" id="crossfader" min="0" max="1" step="0.01" value="0.5">
  </div>
</div>

<div class="bottom-row">
  <!-- Master Library -->
  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span style="text-transform:uppercase; letter-spacing:0.12em; color:#a5b4fc;">Master Library</span>
      <span>
        Bank:
        <select id="bankSelect">
          <option value="">Select</option>
          <option value="A">A</option><option value="B">B</option><option value="C">C</option>
          <option value="D">D</option><option value="E">E</option><option value="F">F</option>
          <option value="G">G</option><option value="H">H</option><option value="I">I</option>
          <option value="J">J</option><option value="K">K</option><option value="L">L</option>
          <option value="M">M</option><option value="N">N</option><option value="O">O</option>
          <option value="P">P</option><option value="Q">Q</option><option value="R">R</option>
          <option value="S">S</option><option value="T">T</option><option value="U">U</option>
          <option value="V">V</option><option value="W">W</option><option value="X">X</option>
          <option value="Y">Y</option><option value="Z">Z</option>
        </select>
      </span>
    </div>
    <table id="libraryTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Artist</th>
          <th>BPM</th>
          <th>Key</th>
          <th>Load 1</th>
          <th>Load 2</th>
          <th>Add</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Banks A–Z -->
  <div class="panel">
    <div style="text-transform:uppercase; letter-spacing:0.12em; color:#a5b4fc; margin-bottom:6px;">Banks A–Z</div>
    <select id="bankViewSelect" style="margin-bottom:6px;">
      <option value="">Select Bank</option>
      <option value="A">A</option><option value="B">B</option><option value="C">C</option>
      <option value="D">D</option><option value="E">E</option><option value="F">F</option>
      <option value="G">G</option><option value="H">H</option><option value="I">I</option>
      <option value="J">J</option><option value="K">K</option><option value="L">L</option>
      <option value="M">M</option><option value="N">N</option><option value="O">O</option>
      <option value="P">P">P</option><option value="Q">Q</option><option value="R">R</option>
      <option value="S">S</option><option value="T">T</option><option value="U">U</option>
      <option value="V">V</option><option value="W">W</option><option value="X">X</option>
      <option value="Y">Y</option><option value="Z">Z</option>
    </select>
    <table id="banksTable">
      <thead>
        <tr>
          <th>Title — Artist</th>
          <th>Deck 1</th>
          <th>Deck 2</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  // --- In-memory Master Library (example seed) ---
  // In your real app, this is created on Page 2 and passed here.
  const masterLibrary = [
    // Example track objects; replace with real ones.
    // Each must have: id, title, artist, bpm, key, audioBuffer, stems, etc.
    // audioBuffer should be a decoded AudioBuffer.
  ];

  // --- Banks A–Z: { A: [ { trackId, title, artist } ], ... } ---
  const banks = {};
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
    banks[letter] = [];
  });

  // --- Deck objects ---
  function createDeck(name) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return {
      name,
      audioCtx,
      source: null,
      gainNode: audioCtx.createGain(),
      filterNode: audioCtx.createBiquadFilter(),
      delayNode: audioCtx.createDelay(),
      audioBuffer: null,
      position: 0,
      cuePoint: 0,
      isPlaying: false,
      isLooping: false,
      loopStart: 0,
      loopEnd: 0,
      pitch: 1,
    };
  }

  const deck1 = createDeck("Deck 1");
  const deck2 = createDeck("Deck 2");

  // Connect deck nodes to destination
  function connectDeckNodes(deck) {
    deck.filterNode.connect(deck.delayNode);
    deck.delayNode.connect(deck.gainNode);
    deck.gainNode.connect(deck.audioCtx.destination);
  }
  connectDeckNodes(deck1);
  connectDeckNodes(deck2);

  // --- Attach audio buffer to deck ---
  function attachDeckAudio(deck) {
    if (!deck.audioBuffer) return;
    if (deck.source) {
      try { deck.source.stop(); } catch (e) {}
    }
    const source = deck.audioCtx.createBufferSource();
    source.buffer = deck.audioBuffer;
    source.playbackRate.value = deck.pitch;
    source.loop = deck.isLooping;
    if (deck.isLooping) {
      source.loopStart = deck.loopStart;
      source.loopEnd = deck.loopEnd;
    }
    source.connect(deck.filterNode);
    deck.source = source;
  }

  // --- Transport functions ---
  function playDeck(deck, statusEl) {
    if (!deck.audioBuffer) {
      statusEl.textContent = "No track loaded.";
      return;
    }
    attachDeckAudio(deck);
    deck.source.start(0, deck.position);
    deck.isPlaying = true;
    statusEl.textContent = "Playing from " + deck.position.toFixed(2) + "s";
    drawWaveformForDeck(deck);
  }

  function stopDeck(deck, statusEl) {
    if (deck.source) {
      try { deck.source.stop(); } catch (e) {}
    }
    deck.position = 0;
    deck.isPlaying = false;
    statusEl.textContent = "Stopped.";
  }

  function setCue(deck, statusEl) {
    deck.cuePoint = deck.position;
    statusEl.textContent = "Cue set at " + deck.cuePoint.toFixed(2) + "s";
  }

  function toggleLoop(deck, statusEl) {
    deck.isLooping = !deck.isLooping;
    if (deck.isLooping) {
      deck.loopStart = deck.position;
      deck.loopEnd = deck.position + 8; // example 8s loop
      statusEl.textContent = "Loop ON (" + deck.loopStart.toFixed(2) + "–" + deck.loopEnd.toFixed(2) + "s)";
    } else {
      statusEl.textContent = "Loop OFF";
    }
  }

  function setPitch(deck, value, statusEl) {
    deck.pitch = parseFloat(value);
    if (deck.source) {
      deck.source.playbackRate.value = deck.pitch;
    }
    statusEl.textContent = "Pitch: " + deck.pitch.toFixed(2);
  }

  function setVolume(deck, value) {
    deck.gainNode.gain.value = parseFloat(value);
  }

  function syncDeck(deck, otherDeck, statusEl) {
    // Simple sync: match pitch (BPM alignment would be more complex)
    deck.pitch = otherDeck.pitch;
    if (deck.source) deck.source.playbackRate.value = deck.pitch;
    statusEl.textContent = "Synced to " + otherDeck.name;
  }

  // --- Crossfader ---
  function applyVolumes(crossValue) {
    const xf = parseFloat(crossValue); // 0 = full deck1, 1 = full deck2
    deck1.gainNode.gain.value = 1 - xf;
    deck2.gainNode.gain.value = xf;
  }

  // --- Waveform drawing ---
  function drawWaveform(canvas, audioBuffer) {
    const ctx = canvas.getContext("2d");
    const width = canvas.width;
    const height = canvas.height;
    ctx.clearRect(0, 0, width, height);
    if (!audioBuffer) {
      ctx.fillStyle = "#111827";
      ctx.fillRect(0, 0, width, height);
      return;
    }
    const data = audioBuffer.getChannelData(0);
    const step = Math.ceil(data.length / width);
    const amp = height / 2;
    ctx.fillStyle = "#020617";
    ctx.fillRect(0, 0, width, height);
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < width; i++) {
      let min = 1.0;
      let max = -1.0;
      for (let j = 0; j < step; j++) {
        const datum = data[(i * step) + j];
        if (datum < min) min = datum;
        if (datum > max) max = datum;
      }
      ctx.moveTo(i, (1 + min) * amp);
      ctx.lineTo(i, (1 + max) * amp);
    }
    ctx.stroke();
  }

  function drawWaveformForDeck(deck) {
    const canvasId = deck.name === "Deck 1" ? "deck1Waveform" : "deck2Waveform";
    const canvas = document.getElementById(canvasId);
    drawWaveform(canvas, deck.audioBuffer);
  }

  // --- Load track to deck ---
  function loadToDeck(deck, track, statusEl) {
    deck.audioBuffer = track.audioBuffer;
    deck.position = 0;
    deck.cuePoint = 0;
    deck.isLooping = false;
    statusEl.textContent = "Loaded: " + track.title + " — " + track.artist;
    drawWaveformForDeck(deck);
  }

  // --- Banks logic ---
  function addToBank(track, bankLetter) {
    if (!bankLetter) return;
    banks[bankLetter].push({
      trackId: track.id,
      title: track.title,
      artist: track.artist
    });
    renderBanks(bankLetter);
  }

  function renderBanks(bankLetter) {
    const tbody = document.querySelector("#banksTable tbody");
    tbody.innerHTML = "";
    if (!bankLetter) return;
    const list = banks[bankLetter];
    list.forEach(entry => {
      const tr = document.createElement("tr");
      const tdInfo = document.createElement("td");
      tdInfo.textContent = `${entry.title} — ${entry.artist}`;
      const tdD1 = document.createElement("td");
      const tdD2 = document.createElement("td");
      const btnD1 = document.createElement("button");
      btnD1.textContent = "Add to Deck 1";
      btnD1.onclick = () => {
        const track = masterLibrary.find(t => t.id === entry.trackId);
        if (track) loadToDeck(deck1, track, document.getElementById("deck1Status"));
      };
      const btnD2 = document.createElement("button");
      btnD2.textContent = "Add to Deck 2";
      btnD2.onclick = () => {
        const track = masterLibrary.find(t => t.id === entry.trackId);
        if (track) loadToDeck(deck2, track, document.getElementById("deck2Status"));
      };
      tdD1.appendChild(btnD1);
      tdD2.appendChild(btnD2);
      tr.appendChild(tdInfo);
      tr.appendChild(tdD1);
      tr.appendChild(tdD2);
      tbody.appendChild(tr);
    });
  }

  // --- Render Master Library ---
  function renderLibrary() {
    const tbody = document.querySelector("#libraryTable tbody");
    tbody.innerHTML = "";
    masterLibrary.forEach((track, index) => {
      const tr = document.createElement("tr");
      const tdIndex = document.createElement("td");
      tdIndex.textContent = index + 1;
      const tdTitle = document.createElement("td");
      tdTitle.textContent = track.title;
      const tdArtist = document.createElement("td");
      tdArtist.textContent = track.artist;
      const tdBpm = document.createElement("td");
      tdBpm.textContent = track.bpm;
      const tdKey = document.createElement("td");
      tdKey.textContent = track.key;
      const tdLoad1 = document.createElement("td");
      const tdLoad2 = document.createElement("td");
      const tdAdd = document.createElement("td");

      const btnLoad1 = document.createElement("button");
      btnLoad1.textContent = "Load 1";
      btnLoad1.onclick = () => loadToDeck(deck1, track, document.getElementById("deck1Status"));

      const btnLoad2 = document.createElement("button");
      btnLoad2.textContent = "Load 2";
      btnLoad2.onclick = () => loadToDeck(deck2, track, document.getElementById("deck2Status"));

      const btnAdd = document.createElement("button");
      btnAdd.textContent = "Add";
      btnAdd.onclick = () => {
        const bankLetter = document.getElementById("bankSelect").value;
        addToBank(track, bankLetter);
      };

      tdLoad1.appendChild(btnLoad1);
      tdLoad2.appendChild(btnLoad2);
      tdAdd.appendChild(btnAdd);

      tr.appendChild(tdIndex);
      tr.appendChild(tdTitle);
      tr.appendChild(tdArtist);
      tr.appendChild(tdBpm);
      tr.appendChild(tdKey);
      tr.appendChild(tdLoad1);
      tr.appendChild(tdLoad2);
      tr.appendChild(tdAdd);

      tbody.appendChild(tr);

      // Row click to expand (stems, extra metadata) – placeholder
      tr.onclick = () => {
        // Here you can open a modal or panel showing stems, chakra, frequency, notes, etc.
        // And buttons to add stems to Deck 1/2 or Banks A–Z.
      };
    });
  }

  // --- Wire UI events ---
  function wireUI() {
    const d1Status = document.getElementById("deck1Status");
    const d2Status = document.getElementById("deck2Status");

    document.getElementById("deck1Play").onclick = () => playDeck(deck1, d1Status);
    document.getElementById("deck1Stop").onclick = () => stopDeck(deck1, d1Status);
    document.getElementById("deck1Cue").onclick = () => setCue(deck1, d1Status);
    document.getElementById("deck1Loop").onclick = () => toggleLoop(deck1, d1Status);
    document.getElementById("deck1Sync").onclick = () => syncDeck(deck1, deck2, d1Status);
    document.getElementById("deck1Pitch").oninput = (e) => setPitch(deck1, e.target.value, d1Status);
    document.getElementById("deck1Volume").oninput = (e) => setVolume(deck1, e.target.value);

    document.getElementById("deck2Play").onclick = () => playDeck(deck2, d2Status);
    document.getElementById("deck2Stop").onclick = () => stopDeck(deck2, d2Status);
    document.getElementById("deck2Cue").onclick = () => setCue(deck2, d2Status);
    document.getElementById("deck2Loop").onclick = () => toggleLoop(deck2, d2Status);
    document.getElementById("deck2Sync").onclick = () => syncDeck(deck2, deck1, d2Status);
    document.getElementById("deck2Pitch").oninput = (e) => setPitch(deck2, e.target.value, d2Status);
    document.getElementById("deck2Volume").oninput = (e) => setVolume(deck2, e.target.value);

    document.getElementById("crossfader").oninput = (e) => applyVolumes(e.target.value);

    document.getElementById("bankViewSelect").onchange = (e) => {
      renderBanks(e.target.value);
    };

    // Initial waveform blank
    drawWaveformForDeck(deck1);
    drawWaveformForDeck(deck2);
  }

  // --- Init ---
  renderLibrary();
  wireUI();
</script>

</body>
</html>
