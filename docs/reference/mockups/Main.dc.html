<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GLCTC1 Studio Arrange</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070b1c}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.hov{transition:background .2s,transform .2s,box-shadow .2s}
.hov:hover{background:rgba(255,255,255,.1)!important}
.clip{transition:box-shadow .25s,transform .25s}
.clip:hover{transform:translateY(-1px)}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(660px)}}
.run{animation:sweep 18s linear infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.rec{animation:breathe 2.4s ease-in-out infinite}
@keyframes aurora1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,8%) scale(1.15)}}
@keyframes aurora2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-8%,-6%) scale(.95)}}
.au1{animation:aurora1 22s ease-in-out infinite}
.au2{animation:aurora2 28s ease-in-out infinite}
</style>
</helmet>
<div style="position:relative;min-height:900px;display:flex;flex-wrap:wrap;background:radial-gradient(900px 520px at 12% -10%,rgba(142,124,255,.28),transparent 70%),radial-gradient(800px 500px at 96% 8%,rgba(255,99,216,.16),transparent 70%),radial-gradient(900px 600px at 50% 120%,rgba(121,235,255,.14),transparent 70%),#070b1c;color:#eef2ff;font-family:Manrope,system-ui,sans-serif;font-size:16px;overflow:hidden">

<div class="au1" style="position:absolute;z-index:0;left:18%;top:8%;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(142,124,255,.32),transparent 68%);filter:blur(40px);pointer-events:none"></div>
<div class="au2" style="position:absolute;z-index:0;right:4%;top:30%;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(255,99,216,.22),transparent 68%);filter:blur(44px);pointer-events:none"></div>
<div class="au1" style="position:absolute;z-index:0;left:40%;bottom:-12%;width:700px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(121,235,255,.22),transparent 68%);filter:blur(50px);pointer-events:none"></div>

<!-- Rail -->
<nav aria-label="Rooms" style="position:relative;z-index:1;flex:0 0 auto;width:88px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 0">
<div style="width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#79ebff,#8e7cff 55%,#ff63d8);display:flex;align-items:center;justify-content:center;font-family:'Tenor Sans',serif;font-size:22px;color:#0b1020;margin-bottom:18px">G</div>

<a href="Main.dc.html" class="hov" aria-label="Arrange" style="width:64px;padding:12px 0;border-radius:18px;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:6px;color:#79ebff">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h7"/></svg>
<span style="font-size:15px;font-weight:600">Arrange</span></a>

<a href="Hub.dc.html" class="hov" aria-label="Instruments" style="width:64px;padding:12px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#b9c3e6">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
<span style="font-size:15px;font-weight:600">Play</span></a>

<a href="Mixer.dc.html" class="hov" aria-label="Mixer" style="width:64px;padding:12px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#b9c3e6">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M12 4v16M17 4v16"/><circle cx="7" cy="15" r="2" fill="#070b1c"/><circle cx="12" cy="8" r="2" fill="#070b1c"/><circle cx="17" cy="13" r="2" fill="#070b1c"/></svg>
<span style="font-size:15px;font-weight:600">Mix</span></a>

<a href="Song.dc.html" class="hov" aria-label="Song" style="width:64px;padding:12px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#b9c3e6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17V5l10-2v12"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="15" r="2"/></svg><span style="font-size:15px;font-weight:600">Song</span></a>
<a href="Stage.dc.html" class="hov" aria-label="Stage" style="width:64px;padding:12px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#b9c3e6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg><span style="font-size:15px;font-weight:600">Stage</span></a>
<a href="Library.dc.html" class="hov" aria-label="Library" style="width:64px;padding:12px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#b9c3e6"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span style="font-size:15px;font-weight:600">Library</span></a>
</nav>

<!-- Main -->
<main style="flex:999 1 560px;min-width:0;position:relative;display:flex;flex-direction:column;padding:18px 28px 150px 6px">

<!-- Top bar -->
<header style="display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin-bottom:22px">
<div style="flex:1 1 220px;min-width:0">
<div style="font-family:'Tenor Sans',serif;font-size:28px;letter-spacing:.01em;line-height:1.1">Cosmic Lift</div>
<div style="font-size:15px;color:#a9b4d6;margin-top:4px">Saved just now · on this device</div>
</div>

<div style="display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:999px;background:rgba(20,28,64,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 18px 50px rgba(0,0,0,.35)">
<button class="hov" aria-label="Back to start" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#d8dff6;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg></button>
<button class="hov" aria-label="Stop" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#d8dff6;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
<button onClick="{{togglePlay}}" aria-label="Play or pause" style="width:60px;height:60px;border:0;border-radius:50%;background:linear-gradient(135deg,#79ebff,#8e7cff 60%,#ff63d8);color:#0b1020;display:flex;align-items:center;justify-content:center;box-shadow:0 0 36px rgba(142,124,255,.55)">
<sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ true }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg></sc-if>
</button>
<a href="Sheets.dc.html" class="hov" aria-label="Record" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center"><span class="rec" style="width:16px;height:16px;border-radius:50%;background:#ff63d8;box-shadow:0 0 16px rgba(255,99,216,.8)"></span></a>
<button class="hov" aria-label="Loop" style="width:44px;height:44px;border:0;border-radius:50%;background:rgba(121,235,255,.14);color:#79ebff;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 013-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 01-3 3H4"/></svg></button>
</div>

<div style="display:flex;align-items:center;gap:26px;padding:10px 24px;border-radius:22px;background:rgba(20,28,64,.4);box-shadow:0 0 0 1px rgba(255,255,255,.08)">
<div><div style="font-family:'DM Mono',monospace;font-size:30px;letter-spacing:.02em">{{position}}</div><div style="font-size:15px;color:#a9b4d6">Bar · Beat</div></div>
<div><div style="font-family:'DM Mono',monospace;font-size:30px">130</div><div style="font-size:15px;color:#a9b4d6">BPM</div></div>

</div>

<div style="flex:1 1 200px;display:flex;justify-content:flex-end;align-items:center;gap:12px">
<button class="hov" style="height:48px;padding:0 22px;border:0;border-radius:999px;background:rgba(255,255,255,.08);color:#eef2ff;font-size:16px;font-weight:600">Share</button>
<a href="Sheets.dc.html" style="height:48px;padding:0 26px;border-radius:999px;background:linear-gradient(135deg,#79ebff,#8e7cff 60%,#ff63d8);color:#0b1020;font-size:16px;font-weight:700;box-shadow:0 10px 34px rgba(142,124,255,.4);display:flex;align-items:center">Export</a>
</div>
</header>

<!-- Arrangement -->
<section aria-label="Arrangement" style="position:relative;border-radius:30px;background:rgba(14,20,48,.55);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.4);overflow:hidden">
<div style="overflow-x:auto;padding-bottom:6px">
<div style="position:relative;width:1730px">

<!-- Ruler -->
<div style="display:flex;height:52px;align-items:flex-end">
<div style="position:sticky;left:0;z-index:5;flex:0 0 240px;height:52px;display:flex;align-items:center;padding:0 22px;background:linear-gradient(90deg,#0d1434 82%,rgba(13,20,52,0));font-size:15px;color:#a9b4d6;font-weight:600">Tracks</div>
<div style="position:relative;width:1408px;height:52px">
<div style="position:absolute;left:352px;width:352px;top:10px;bottom:0;border-radius:16px 16px 0 0;background:linear-gradient(180deg,rgba(121,235,255,.28),rgba(121,235,255,0))"></div>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="16">
<div style="position:absolute;left:{{b.left}}px;bottom:10px;font-family:'DM Mono',monospace;font-size:15px;color:#a9b4d6;padding-left:8px">{{b.n}}</div>
</sc-for>
</div>
</div>

<!-- Tracks -->
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="5">
<div style="display:flex;height:100px;align-items:stretch;opacity:{{t.opacity}};transition:opacity .25s">
<div style="position:sticky;left:0;z-index:4;flex:0 0 240px;display:flex;align-items:center;gap:12px;padding:0 16px 0 22px;background:linear-gradient(90deg,#0d1434 84%,rgba(13,20,52,0))">
<span style="width:10px;height:44px;border-radius:6px;background:{{t.color}};box-shadow:0 0 18px {{t.glow}}"></span>
<div style="flex:1;min-width:0">
<div style="font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.name}}</div>
<div style="font-size:15px;color:#a9b4d6;white-space:nowrap">{{t.sub}}</div>
</div>
<button onClick="{{t.onMute}}" aria-label="Mute {{t.name}}" style="width:38px;height:38px;border:0;border-radius:12px;font-weight:700;font-size:15px;background:{{t.muteBg}};color:{{t.muteFg}}">M</button>
</div>
<div style="position:relative;width:1408px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 88px)">
<sc-for list="{{t.clips}}" as="c" hint-placeholder-count="2">
<button class="clip" onClick="{{c.onSelect}}" aria-label="{{c.name}}" style="{{c.box}}">
<span style="position:absolute;left:0;right:0;top:0;display:block;text-align:left;font-size:15px;font-weight:600;padding:6px 12px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.name}}</span>
<span style="position:absolute;left:10px;right:10px;top:30px;height:48px;display:block">
<sc-for list="{{c.bars}}" as="w" hint-placeholder-count="20"><i style="{{w.s}}"></i></sc-for>
</span>
</button>
</sc-for>
</div>
</div>
</sc-for>

<!-- Add track -->
<div style="display:flex;height:84px;align-items:center">
<div style="position:sticky;left:0;z-index:4;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 22px;background:#0d1434">
<span style="font-size:15px;color:#a9b4d6;font-weight:600;margin-right:6px">Add</span>
<button class="hov" style="height:42px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.08);color:#eef2ff;font-size:15px;font-weight:600">Audio</button>
<button class="hov" style="height:42px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.08);color:#eef2ff;font-size:15px;font-weight:600">Instrument</button>
<button class="hov" style="height:42px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.08);color:#eef2ff;font-size:15px;font-weight:600">Drums</button>
<button class="hov" style="height:42px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.08);color:#eef2ff;font-size:15px;font-weight:600">Video</button>
</div>
</div>

<!-- Playhead -->
<div style="position:absolute;left:630px;top:0;bottom:0;width:0;pointer-events:none;z-index:6">
<div class="{{playheadCls}}" style="position:absolute;left:0;top:0;bottom:0;width:0">
<div style="position:absolute;left:-150px;width:300px;top:30px;bottom:0;background:radial-gradient(closest-side,rgba(121,235,255,.22),transparent);pointer-events:none"></div>
<div style="position:absolute;left:-7px;top:36px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 20px #79ebff"></div>
<div style="position:absolute;left:-1px;top:44px;bottom:0;width:2px;background:linear-gradient(180deg,#fff,#79ebff 30%,rgba(142,124,255,.1));box-shadow:0 0 22px rgba(121,235,255,.9)"></div>
</div>
</div>

</div>
</div>
</section>

<!-- Inspector -->
<aside aria-label="Clip" style="position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 40px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 30px;padding:16px 28px;border-radius:28px;background:rgba(18,26,62,.7);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 30px 80px rgba(0,0,0,.55)">
<div style="display:flex;align-items:center;gap:14px">
<span style="width:14px;height:14px;border-radius:50%;background:{{sel.color}};box-shadow:0 0 18px {{sel.glow}}"></span>
<div>
<div style="font-family:'Tenor Sans',serif;font-size:22px;line-height:1.1">{{sel.name}}</div>
<div style="font-family:'DM Mono',monospace;font-size:15px;color:#a9b4d6;margin-top:3px">{{sel.track}} · {{sel.range}}</div>
</div>
</div>
<div style="display:flex;gap:26px">
<div style="width:120px"><div style="display:flex;justify-content:space-between;font-size:15px;color:#a9b4d6"><span>Gain</span><span style="font-family:'DM Mono',monospace;color:#eef2ff">0 dB</span></div><div style="height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:10px"><div style="width:68%;height:6px;border-radius:6px;background:linear-gradient(90deg,#79ebff,#8e7cff)"></div></div></div>
<div style="width:120px"><div style="display:flex;justify-content:space-between;font-size:15px;color:#a9b4d6"><span>Pitch</span><span style="font-family:'DM Mono',monospace;color:#eef2ff">+0 st</span></div><div style="height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:10px"><div style="width:50%;height:6px;border-radius:6px;background:linear-gradient(90deg,#8e7cff,#ff63d8)"></div></div></div>
<div style="width:120px"><div style="display:flex;justify-content:space-between;font-size:15px;color:#a9b4d6"><span>Fade</span><span style="font-family:'DM Mono',monospace;color:#eef2ff">1/8</span></div><div style="height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:10px"><div style="width:24%;height:6px;border-radius:6px;background:linear-gradient(90deg,#79ebff,#8e7cff)"></div></div></div>
</div>
<div style="display:flex;gap:8px">
<a href="Editor.dc.html" style="height:46px;padding:0 20px;border-radius:999px;background:linear-gradient(135deg,#79ebff,#8e7cff 70%);color:#0b1020;font-size:15px;font-weight:700;display:flex;align-items:center">Open editor</a>
<button class="hov" style="height:46px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#eef2ff;font-size:15px;font-weight:600">Split</button>
<button class="hov" style="height:46px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#eef2ff;font-size:15px;font-weight:600">Duplicate</button>
<button class="hov" style="height:46px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,99,216,.16);color:#ffb3ec;font-size:15px;font-weight:600">Delete</button>
</div>
</aside>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { playing: false, sel: 'lead1', muted: {} };

  renderVals() {
    const BAR = 88;
    const rnd = (seed) => { let s = seed; return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; };
    const defs = [
      { id: 'drums', name: 'Drums', sub: '80LA8 drum machine', color: '#79ebff', kind: 'drums', clips: [[0,4,'Pattern A'],[4,4,'Pattern B'],[8,4,'Pattern A'],[12,4,'Fill + break']] },
      { id: 'bass', name: 'Acid bass', sub: '30LEE synth', color: '#8e7cff', kind: 'notes', clips: [[2,6,'Acid line'],[8,8,'Acid line, filter up']] },
      { id: 'lead', name: 'Lead', sub: '0010110 synth', color: '#ff63d8', kind: 'notes', clips: [[4,4,'Hook'],[10,4,'Hook B']] },
      { id: 'vox', name: 'Vocal', sub: 'Audio · mic', color: '#7cf0c0', kind: 'wave', clips: [[6,5,'Verse take 3']] },
      { id: 'vis', name: 'Visuals', sub: 'Video', color: '#ffd36a', kind: 'video', clips: [[0,16,'Galactic loop']] }
    ];
    const hex2 = (c, a) => c + a;
    const tracks = defs.map((t, ti) => {
      const muted = !!this.state.muted[t.id];
      const clips = t.clips.map((c, ci) => {
        const id = t.id + (ci + 1);
        const w = c[1] * BAR - 6;
        const aw = w - 20;
        const r = rnd(ti * 97 + ci * 31 + 7);
        const bars = [];
        if (t.kind === 'wave') {
          for (let x = 0; x < aw; x += 6) {
            const env = 0.35 + 0.65 * Math.abs(Math.sin(x / 70 + ci));
            const h = Math.max(4, Math.round((6 + r() * 38) * env));
            bars.push({ s: 'position:absolute;left:' + x + 'px;top:' + Math.round((48 - h) / 2) + 'px;width:3px;height:' + h + 'px;border-radius:2px;background:' + t.color });
          }
        } else if (t.kind === 'drums') {
          const beat = BAR / 4;
          for (let x = 0, i = 0; x < aw; x += beat, i++) {
            const pos = i % 4;
            if (pos === 0 || pos === 2 || (pos === 3 && r() > .6)) bars.push({ s: 'position:absolute;left:' + Math.round(x) + 'px;top:26px;width:8px;height:20px;border-radius:4px;background:' + t.color });
            if (pos === 1 || pos === 3) bars.push({ s: 'position:absolute;left:' + Math.round(x) + 'px;top:6px;width:8px;height:12px;border-radius:4px;background:' + t.color + 'cc' });
            bars.push({ s: 'position:absolute;left:' + Math.round(x + beat / 2) + 'px;top:21px;width:5px;height:5px;border-radius:50%;background:' + t.color + '88' });
          }
        } else if (t.kind === 'notes') {
          let x = 0;
          while (x < aw - 10) {
            const len = [10, 16, 22, 34][Math.floor(r() * 4)];
            const row = Math.floor(r() * 7);
            bars.push({ s: 'position:absolute;left:' + x + 'px;top:' + (4 + row * 6) + 'px;width:' + len + 'px;height:5px;border-radius:3px;background:' + t.color });
            x += len + [4, 8, 14][Math.floor(r() * 3)];
          }
        }
        const selected = this.state.sel === id;
        const video = t.kind === 'video';
        const bg = video
          ? 'linear-gradient(90deg,rgba(255,211,106,.5),rgba(255,99,216,.4) 35%,rgba(142,124,255,.5) 70%,rgba(121,235,255,.45))'
          : 'linear-gradient(180deg,' + hex2(t.color, '38') + ',' + hex2(t.color, '14') + ')';
        const box = 'position:absolute;top:10px;height:80px;left:' + (c[0] * BAR + 3) + 'px;width:' + w + 'px;padding:0;border:0;border-radius:18px;color:#eef2ff;overflow:hidden;background:' + bg + ';box-shadow:' + (selected ? '0 0 0 2px ' + t.color + ',0 0 34px ' + hex2(t.color, '66') : '0 0 0 1px ' + hex2(t.color, '55')) + ';display:block';
        return { id, name: c[2], box, bars, onSelect: () => this.setState({ sel: id }), range: 'Bar ' + (c[0] + 1) + '–' + (c[0] + c[1]), track: t.name, color: t.color };
      });
      return {
        name: t.name, sub: t.sub, color: t.color, glow: hex2(t.color, '88'),
        opacity: muted ? 0.38 : 1,
        muteBg: muted ? '#ff63d8' : 'rgba(255,255,255,.08)', muteFg: muted ? '#0b1020' : '#d8dff6',
        onMute: () => this.setState({ muted: { ...this.state.muted, [t.id]: !muted } }),
        clips
      };
    });
    const all = tracks.flatMap((t) => t.clips);
    const cur = all.find((c) => c.id === this.state.sel) || all[0];
    const tc = defs.find((t) => cur.id.startsWith(t.id));
    const bars = Array.from({ length: 16 }, (_, i) => ({ n: String(i + 1).padStart(2, '0'), left: i * BAR }));
    return {
      tracks, bars,
      sel: { name: cur.name, track: cur.track, range: cur.range, color: cur.color, glow: cur.color + '99' },
      playing: this.state.playing, paused: !this.state.playing,
      playheadCls: this.state.playing ? 'run' : '',
      position: this.state.playing ? '07 · 01' : '05 · 02',
      togglePlay: () => this.setState({ playing: !this.state.playing })
    };
  }
}
</script>
