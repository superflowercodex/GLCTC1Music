<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Access</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  padding:20px;
  background:radial-gradient(circle at top,#0b1120 0%,#020617 40%,#000 100%);
  color:#e5e7eb;
  font-family:system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
}
h1 {
  font-size:2rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:#38bdf8;
  text-shadow:0 0 16px #0ea5e9;
}
.glow-card {
  width:100%;
  max-width:600px;
  background:rgba(15,23,42,0.9);
  border-radius:14px;
  padding:20px;
  box-shadow:0 0 25px rgba(56,189,248,0.35),
              0 0 60px rgba(129,140,248,0.35);
  border:1px solid rgba(56,189,248,0.5);
}
button {
  padding:10px 20px;
  border-radius:999px;
  border:none;
  font-size:0.8rem;
  font-weight:600;
  text-transform:uppercase;
  cursor:pointer;
  background:linear-gradient(90deg,#22c55e,#06b6d4);
  color:#020617;
  margin-top:10px;
}
input {
  width:100%;
  padding:6px 8px;
  margin-top:4px;
  border-radius:6px;
  border:1px solid #1f2937;
  background:#020617;
  color:#e5e7eb;
}
.hidden { display:none; }
nav a {
  color:#38bdf8;
  opacity:0.4;
  pointer-events:none;
}
nav a.active {
  opacity:1;
  pointer-events:auto;
}
</style>
</head>

<body>

<h1>GLCTC1 Cosmic 1200 Decks</h1>

<!-- MODE SELECT -->
<div class="glow-card">
  <h2>Welcome</h2>
  <p>Select an option below:</p>

  <button id="showLogin">Log In</button>
  <button id="showRegister">Create Account</button>
</div>

<!-- LOGIN FORM -->
<div class="glow-card hidden" id="loginForm">
  <h2>Log In</h2>
  <label>Email</label>
  <input id="loginEmail" type="email">
  <label>Password</label>
  <input id="loginPassword" type="password">
  <button id="loginBtn">Log In</button>
  <div id="loginStatus"></div>
</div>

<!-- REGISTER FORM -->
<div class="glow-card hidden" id="registerForm">
  <h2>Create Account</h2>
  <label>Email</label>
  <input id="regEmail" type="email">
  <label>Password</label>
  <input id="regPassword" type="password">
  <button id="registerBtn">Create Account</button>
  <div id="regStatus"></div>
</div>

<nav>
  <a id="navLogin" href="index.html">Access</a> |
  <a id="navUpload" href="upload.html">Upload</a> |
  <a id="navDecks" href="decks.html">Decks</a>
</nav>

<script>
// ⭐ REAL SUPABASE KEYS
const supabaseUrl = "https://zdlaloiruxamxsduxqxw.supabase.co";
const supabaseKey = "YOUR_ANON_KEY_HERE"; // paste your anon key here
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

// ⭐ Show forms
showLogin.onclick = () => {
  loginForm.classList.remove("hidden");
  registerForm.classList.add("hidden");
};
showRegister.onclick = () => {
  registerForm.classList.remove("hidden");
  loginForm.classList.add("hidden");
};

// ⭐ Unlock nav
function unlockNav() {
  navUpload.classList.add("active");
  navDecks.classList.add("active");
}
function lockNav() {
  navUpload.classList.remove("active");
  navDecks.classList.remove("active");
}

// ⭐ LOGIN
loginBtn.onclick = async () => {
  const email = loginEmail.value.trim();
  const password = loginPassword.value.trim();

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    loginStatus.textContent = error.message;
    return;
  }

  unlockNav();
  window.location.href = "upload.html";
};

// ⭐ REGISTER → auto-login → redirect
registerBtn.onclick = async () => {
  const email = regEmail.value.trim();
  const password = regPassword.value.trim();

  regStatus.textContent = "Creating account...";

  let { error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: { emailRedirectTo: null }
  });

  if (error) {
    regStatus.textContent = "Account exists — logging in...";
  }

  const { error: loginError } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (loginError) {
    regStatus.textContent = loginError.message;
    return;
  }

  unlockNav();
  window.location.href = "upload.html";
};

// ⭐ AUTO CHECK LOGIN
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) unlockNav();
  else lockNav();
})();
</script>

</body>
</html>
