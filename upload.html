<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLCTC1 – Cosmic Upload</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

    body {
      background: radial-gradient(circle at top, #0a0020 0%, #000010 100%);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.5px;
      margin: 0;
      padding: 40px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .nav-links a {
      color: #0ff;
      text-decoration: none;
      font-size: 1.1em;
      font-weight: bold;
      text-shadow: 0 0 10px #0ff;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: #f0f;
      text-shadow: 0 0 20px #f0f;
    }

    h1 {
      text-align: center;
      font-size: 2em;
      color: #0ff;
      text-shadow: 0 0 20px #0ff, 0 0 40px #f0f;
      margin-bottom: 30px;
    }

    .form-container {
      background: rgba(20, 20, 40, 0.8);
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
      padding: 30px;
      backdrop-filter: blur(10px);
      max-width: 900px;
      margin: 0 auto;
    }

    .required-row {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }

    .required-row > div {
      flex: 1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9em;
      color: #0ff;
    }

    input, textarea, select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #0a0a1a;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
    }

    .required-box {
      border: 2px solid #0ff;
      box-shadow: 0 0 15px #0ff;
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px #0ff; }
      50% { box-shadow: 0 0 20px #f0f; }
      100% { box-shadow: 0 0 10px #0ff; }
    }

    button {
      margin-top: 25px;
      padding: 14px;
      width: 100%;
      background: linear-gradient(90deg, #0ff, #f0f);
      color: #000;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 20px #0ff;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #f0f, 0 0 50px #0ff;
    }

    .optional-fields {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="decks.html">Decks</a>
  </div>

  <h1>Add Track to GLCTC1 Master Library</h1>

  <div class="form-container">

    <!-- REQUIRED FIELDS -->
    <div class="required-row">
      <div>
        <label>Track Title *</label>
        <input id="title" type="text" class="required-box" placeholder="Enter track name">
      </div>

      <div>
        <label>Artist *</label>
        <input id="artist" type="text" class="required-box" placeholder="Enter artist name">
      </div>

      <div>
        <label>Master Audio *</label>
        <input id="master_audio" type="file" accept="audio/*" class="required-box">
      </div>
    </div>

    <!-- OPTIONAL FIELDS -->
    <div class="optional-fields">

      <label>Album</label>
      <input id="album" type="text">

      <label>Genre</label>
      <input id="genre" type="text">

      <label>BPM</label>
      <input id="bpm" type="number">

      <label>Key</label>
      <input id="key" type="text">

      <label>Frequency (Hz)</label>
      <input id="frequency_hz" type="number">

      <label>Chakra</label>
      <select id="chakra">
        <option value="">Select Chakra</option>
        <option value="Root">Root</option>
        <option value="Sacral">Sacral</option>
        <option value="Solar Plexus">Solar Plexus</option>
        <option value="Heart">Heart</option>
        <option value="Throat">Throat</option>
        <option value="Third Eye">Third Eye</option>
        <option value="Crown">Crown</option>
      </select>

      <label>Copyright</label>
      <select id="copyright">
        <option value="">Select copyright status</option>
        <option value="I own all rights">I own all rights</option>
        <option value="Cover version (licensed)">Cover version (licensed)</option>
        <option value="Public domain">Public domain</option>
        <option value="Permission granted by owner">Permission granted by owner</option>
      </select>

      <label>Planet</label>
      <input id="planet" type="text">

      <label>Spatial</label>
      <input id="spatial" type="text">

      <label>Notes</label>
      <textarea id="notes"></textarea>

      <label>Cover Art</label>
      <input id="cover_art" type="file" accept="image/*">

      <label>Stem 1</label>
      <input id="stem1" type="file" accept="audio/*">

      <label>Stem 2</label>
      <input id="stem2" type="file" accept="audio/*">

      <label>Stem 3</label>
      <input id="stem3" type="file" accept="audio/*">

      <label>Stem 4</label>
      <input id="stem4" type="file" accept="audio/*">

    </div>

    <button id="addTrackBtn">Add Track to Library</button>

  </div>

  <script>
    document.getElementById("addTrackBtn").addEventListener("click", () => {

      const title = document.getElementById("title").value.trim();
      const artist = document.getElementById("artist").value.trim();
      const masterInput = document.getElementById("master_audio");

      if (!title || !artist || masterInput.files.length === 0) {
        alert("Track Title, Artist, and Master Audio are required.");
        return;
      }

      const masterFile = masterInput.files[0];

      const track = {
        id: Date.now(),
        title,
        artist,
        master_audio: masterFile.name,

        album: document.getElementById("album").value.trim(),
        genre: document.getElementById("genre").value.trim(),
        bpm: document.getElementById("bpm").value.trim(),
        key: document.getElementById("key").value.trim(),
        frequency_hz: document.getElementById("frequency_hz").value.trim(),
        chakra: document.getElementById("chakra").value,
        copyright: document.getElementById("copyright").value,
        planet: document.getElementById("planet").value.trim(),
        spatial: document.getElementById("spatial").value.trim(),
        notes: document.getElementById("notes").value.trim(),

        cover_art: document.getElementById("cover_art").files[0]
          ? document.getElementById("cover_art").files[0].name
          : "",

        stem1: document.getElementById("stem1").files[0]
          ? document.getElementById("stem1").files[0].name
          : "",
        stem2: document.getElementById("stem2").files[0]
          ? document.getElementById("stem2").files[0].name
          : "",
        stem3: document.getElementById("stem3").files[0]
          ? document.getElementById("stem3").files[0].name
          : "",
        stem4: document.getElementById("stem4").files[0]
          ? document.getElementById("stem4").files[0].name
          : ""
      };

      const library = JSON.parse(localStorage.getItem("glctc1_library") || "[]");
      library.push(track);
      localStorage.setItem("glctc1_library", JSON.stringify(library));

      window.location.href = "decks.html";
    });
  </script>

</body>
</html>
