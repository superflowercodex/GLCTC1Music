<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GLCTC1 Studio Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070b1c}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:radial-gradient(420px 300px at 10% -6%,rgba(142,124,255,.32),transparent 70%),radial-gradient(380px 300px at 100% 30%,rgba(255,99,216,.16),transparent 70%),radial-gradient(420px 320px at 40% 110%,rgba(121,235,255,.2),transparent 70%),#070b1c;color:#eef2ff;font-family:Manrope,system-ui,sans-serif;font-size:16px">

<div style="padding:56px 20px 0;display:flex;align-items:center;gap:12px">
<div style="flex:1;min-width:0">
<div style="font-family:'Tenor Sans',serif;font-size:26px;line-height:1.1">Cosmic Lift</div>
<div style="font-size:15px;color:#a9b4d6;margin-top:3px">130 BPM · F♯m · 4/4</div>
</div>
<button style="height:44px;padding:0 20px;border:0;border-radius:999px;background:linear-gradient(135deg,#79ebff,#8e7cff 60%,#ff63d8);color:#0b1020;font-size:16px;font-weight:700">Export</button>
</div>

<div style="margin:16px 20px 0;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(20,28,64,.6);box-shadow:0 0 0 1px rgba(255,255,255,.1)">
<button aria-label="Back to start" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#d8dff6;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg></button>
<button aria-label="Play" style="width:56px;height:56px;border:0;border-radius:50%;background:linear-gradient(135deg,#79ebff,#8e7cff 60%,#ff63d8);color:#0b1020;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(142,124,255,.55)"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg></button>
<button aria-label="Record" style="width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center"><span style="width:15px;height:15px;border-radius:50%;background:#ff63d8;box-shadow:0 0 14px rgba(255,99,216,.8)"></span></button>
<span style="flex:1"></span>
<div style="font-family:'DM Mono',monospace;font-size:24px;padding-right:12px">05 · 02</div>
</div>

<div style="position:relative;margin:16px 0 0;padding:0 20px">
<div style="display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:15px;color:#a9b4d6;padding:0 0 8px">
<span>05</span><span>06</span><span>07</span><span>08</span>
</div>

<sc-for list="{{tracks}}" as="t" hint-placeholder-count="4">
<div style="margin-bottom:6px">
<div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;padding:0 4px 4px"><span style="width:8px;height:8px;border-radius:50%;background:{{t.color}}"></span>{{t.name}}</div>
<div style="position:relative;height:48px;border-radius:16px;background:rgba(255,255,255,.04);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 87px)">
<sc-for list="{{t.clips}}" as="c" hint-placeholder-count="1">
<div style="{{c.box}}"><sc-for list="{{c.bars}}" as="w" hint-placeholder-count="10"><i style="{{w}}"></i></sc-for></div>
</sc-for>
</div>
</div>
</sc-for>

<div style="position:absolute;left:{{headLeft}}px;top:26px;bottom:-8px;width:2px;background:linear-gradient(180deg,#fff,#79ebff 30%,rgba(142,124,255,.1));box-shadow:0 0 18px rgba(121,235,255,.9);border-radius:2px"></div>
</div>

<div style="position:absolute;left:12px;right:12px;bottom:112px;padding:16px 18px;border-radius:26px;background:rgba(18,26,62,.72);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.5)">
<div style="display:flex;align-items:center;gap:12px">
<span style="width:12px;height:12px;border-radius:50%;background:#ff63d8;box-shadow:0 0 16px rgba(255,99,216,.8)"></span>
<div style="flex:1"><div style="font-family:'Tenor Sans',serif;font-size:20px">Hook</div><div style="font-family:'DM Mono',monospace;font-size:15px;color:#a9b4d6;margin-top:2px">Lead · Bar 5–8</div></div>
<button style="height:44px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#eef2ff;font-size:15px;font-weight:600">Split</button>
<button style="height:44px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,99,216,.16);color:#ffb3ec;font-size:15px;font-weight:600">Delete</button>
</div>
<div style="display:flex;gap:20px;margin-top:16px">
<div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:15px;color:#a9b4d6"><span>Gain</span><span style="font-family:'DM Mono',monospace;color:#eef2ff">0 dB</span></div><div style="height:8px;border-radius:8px;background:rgba(255,255,255,.12);margin-top:10px"><div style="width:68%;height:8px;border-radius:8px;background:linear-gradient(90deg,#79ebff,#8e7cff)"></div></div></div>
<div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:15px;color:#a9b4d6"><span>Pitch</span><span style="font-family:'DM Mono',monospace;color:#eef2ff">+0 st</span></div><div style="height:8px;border-radius:8px;background:rgba(255,255,255,.12);margin-top:10px"><div style="width:50%;height:8px;border-radius:8px;background:linear-gradient(90deg,#8e7cff,#ff63d8)"></div></div></div>
</div>
</div>

<nav aria-label="Rooms" style="position:absolute;left:20px;right:20px;bottom:26px;height:72px;display:flex;align-items:center;justify-content:space-around;border-radius:999px;background:rgba(20,28,64,.7);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 20px 50px rgba(0,0,0,.5)">
<a href="Phone.dc.html" aria-label="Arrange" style="width:76px;height:56px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#79ebff"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h7"/></svg><span style="font-size:15px;font-weight:600">Arrange</span></a>
<a href="Hub.dc.html" aria-label="Play" style="width:60px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span style="font-size:15px;font-weight:600">Play</span></a>
<a href="Mixer.dc.html" aria-label="Mix" style="width:60px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M12 4v16M17 4v16"/><circle cx="7" cy="15" r="2" fill="#0d1434"/><circle cx="12" cy="8" r="2" fill="#0d1434"/><circle cx="17" cy="13" r="2" fill="#0d1434"/></svg><span style="font-size:15px;font-weight:600">Mix</span></a>
<a href="Song.dc.html" aria-label="Song" style="width:60px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17V5l10-2v12"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="15" r="2"/></svg><span style="font-size:15px;font-weight:600">Song</span></a>
<a href="Library.dc.html" aria-label="More: stage and library" style="width:60px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg><span style="font-size:15px;font-weight:600">More</span></a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rnd = (seed) => { let s = seed; return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; };
    const PX = 87;
    const defs = [
      { name: 'Drums', color: '#79ebff', kind: 'drums', clips: [[0, 4]] },
      { name: 'Acid bass', color: '#8e7cff', kind: 'notes', clips: [[0, 4]] },
      { name: 'Lead', color: '#ff63d8', kind: 'notes', clips: [[0, 4]] },
      { name: 'Vocal', color: '#7cf0c0', kind: 'wave', clips: [[1, 3]] }
    ];
    const tracks = defs.map((t, ti) => ({
      name: t.name, color: t.color,
      clips: t.clips.map((c, ci) => {
        const r = rnd(ti * 53 + 11);
        const w = c[1] * PX - 6;
        const bars = [];
        if (t.kind === 'wave') {
          for (let x = 8; x < w - 8; x += 6) { const h = Math.max(4, Math.round((6 + r() * 26) * (0.4 + 0.6 * Math.abs(Math.sin(x / 40))))); bars.push('position:absolute;left:' + x + 'px;top:' + Math.round((48 - 8 - h) / 2 + 4) + 'px;width:3px;height:' + h + 'px;border-radius:2px;background:' + t.color); }
        } else if (t.kind === 'drums') {
          for (let x = 8, i = 0; x < w - 8; x += 22, i++) { const k = i % 4; bars.push('position:absolute;left:' + x + 'px;top:' + (k === 1 || k === 3 ? 6 : 17) + 'px;width:7px;height:' + (k === 1 || k === 3 ? 9 : 17) + 'px;border-radius:4px;background:' + t.color); }
        } else {
          let x = 8;
          while (x < w - 18) { const len = [10, 16, 24][Math.floor(r() * 3)]; bars.push('position:absolute;left:' + x + 'px;top:' + (5 + Math.floor(r() * 7) * 4) + 'px;width:' + len + 'px;height:5px;border-radius:3px;background:' + t.color); x += len + [4, 8, 12][Math.floor(r() * 3)]; }
        }
        return {
          bars,
          box: 'position:absolute;top:4px;bottom:4px;left:' + (c[0] * PX + 3) + 'px;width:' + w + 'px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,' + t.color + '38,' + t.color + '14);box-shadow:0 0 0 1px ' + t.color + '55'
        };
      })
    }));
    return { tracks, headLeft: 20 + 87 * 1.5 };
  }
}
</script>
</body>
</html>
