<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GLCTC1 Studio Clip Editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070b1c}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.hov{transition:background .2s,transform .2s}
.hov:hover{background:rgba(255,255,255,.1)!important}
.nc{transition:transform .12s,background .2s}
.nc:hover{background:rgba(255,255,255,.2)!important}
</style>
</helmet>
<div style="position:relative;min-height:900px;display:flex;flex-wrap:wrap;background:radial-gradient(900px 520px at 12% -10%,rgba(142,124,255,.28),transparent 70%),radial-gradient(800px 500px at 96% 8%,rgba(255,99,216,.16),transparent 70%),radial-gradient(900px 600px at 50% 120%,rgba(121,235,255,.18),transparent 70%),#070b1c;color:#eef2ff;font-family:Manrope,system-ui,sans-serif;font-size:16px;overflow:hidden">

<nav aria-label="Rooms" style="flex:0 0 auto;width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0">
<div style="width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#79ebff,#8e7cff 55%,#ff63d8);display:flex;align-items:center;justify-content:center;font-family:'Tenor Sans',serif;font-size:22px;color:#0b1020;margin-bottom:14px">G</div>
<a href="Main.dc.html" class="hov" aria-label="Arrange" style="width:68px;padding:10px 0;border-radius:18px;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:4px;color:#79ebff"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h7"/></svg><span style="font-size:15px;font-weight:600">Arrange</span></a>
<a href="Hub.dc.html" class="hov" aria-label="Instruments" style="width:68px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span style="font-size:15px;font-weight:600">Play</span></a>
<a href="Mixer.dc.html" class="hov" aria-label="Mix" style="width:68px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M12 4v16M17 4v16"/><circle cx="7" cy="15" r="2" fill="#070b1c"/><circle cx="12" cy="8" r="2" fill="#070b1c"/><circle cx="17" cy="13" r="2" fill="#070b1c"/></svg><span style="font-size:15px;font-weight:600">Mix</span></a>
<a href="Song.dc.html" class="hov" aria-label="Song" style="width:68px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17V5l10-2v12"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="15" r="2"/></svg><span style="font-size:15px;font-weight:600">Song</span></a>
<a href="Stage.dc.html" class="hov" aria-label="Stage" style="width:68px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg><span style="font-size:15px;font-weight:600">Stage</span></a>
<a href="Library.dc.html" class="hov" aria-label="Library" style="width:68px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span style="font-size:15px;font-weight:600">Library</span></a>
</nav>

<main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;padding:18px 28px 0 6px;gap:16px">

<header style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px">
<div style="flex:1 1 200px;min-width:0">
<div style="font-family:'Tenor Sans',serif;font-size:28px;line-height:1.1">Cosmic Lift</div>
<div style="font-size:15px;color:#a9b4d6;margin-top:3px">Editing “Verse take 3” · Vocal · Bar 7–11</div>
</div>
<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;background:rgba(20,28,64,.55);box-shadow:0 0 0 1px rgba(255,255,255,.1)">
<button aria-label="Play" style="width:48px;height:48px;border:0;border-radius:50%;background:linear-gradient(135deg,#79ebff,#8e7cff 60%,#ff63d8);color:#0b1020;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg></button>
<span style="font-family:'DM Mono',monospace;font-size:22px;padding:0 12px 0 6px">07 · 02</span>
</div>
<a href="Main.dc.html" class="hov" style="height:48px;padding:0 24px;border-radius:999px;background:rgba(255,255,255,.1);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px">Close editor<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</header>

<!-- Context -->
<section aria-label="Arrangement context" style="position:relative;border-radius:24px;background:rgba(14,20,48,.5);box-shadow:0 0 0 1px rgba(255,255,255,.07);padding:14px 16px 14px 16px;display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ctx}}" as="t" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:14px;height:44px">
<div style="flex:0 0 120px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600"><span style="width:8px;height:26px;border-radius:5px;background:{{t.color}}"></span>{{t.name}}</div>
<div style="position:relative;flex:1;height:44px;border-radius:12px;background:rgba(255,255,255,.04)">
<sc-for list="{{t.clips}}" as="c" hint-placeholder-count="2"><div style="{{c}}"></div></sc-for>
</div>
</div>
</sc-for>
<div style="position:absolute;left:calc(120px + 14px + 16px + 41%);top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,#fff,#79ebff);box-shadow:0 0 16px rgba(121,235,255,.9);border-radius:2px"></div>
</section>

<!-- Editor drawer -->
<section aria-label="Editor" style="flex:1;display:flex;flex-direction:column;gap:16px;padding:20px 22px 24px;border-radius:30px 30px 0 0;background:rgba(20,28,64,.66);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 -20px 80px rgba(0,0,0,.45)">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px">
<div style="display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.06)">
<button onClick="{{showAudio}}" style="{{tabAudio}}">Audio</button>
<button onClick="{{showNotes}}" style="{{tabNotes}}">Notes</button>
</div>
<sc-if value="{{isAudio}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-wrap:wrap;gap:6px">
<button class="hov" style="height:44px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.09);color:#eef2ff;font-size:15px;font-weight:600">Split at playhead</button>
<button class="hov" style="height:44px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.09);color:#eef2ff;font-size:15px;font-weight:600">Cut out selection</button>
<button class="hov" style="height:44px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.09);color:#eef2ff;font-size:15px;font-weight:600">Keep selection</button>
<button class="hov" style="height:44px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.09);color:#eef2ff;font-size:15px;font-weight:600">Duplicate</button>
<button class="hov" style="height:44px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.09);color:#eef2ff;font-size:15px;font-weight:600">Reverse</button>
</div>
</sc-if>
<sc-if value="{{isNotes}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
<span style="font-size:15px;color:#a9b4d6;font-weight:600;margin-right:4px">Grid</span>
<span style="padding:10px 16px;border-radius:999px;background:linear-gradient(135deg,#79ebff,#8e7cff);color:#0b1020;font-size:15px;font-weight:700">1/16</span>
<span style="padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.09);font-size:15px;font-weight:600">1/8</span>
<span style="padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.09);font-size:15px;font-weight:600">1/4</span>
<span style="margin-left:14px;font-size:15px;color:#a9b4d6;font-weight:600">Length</span>
<span style="padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.09);font-size:15px;font-weight:600">2 bars</span>
<button class="hov" style="height:44px;padding:0 18px;border:0;border-radius:999px;background:rgba(255,255,255,.09);color:#eef2ff;font-size:15px;font-weight:600;margin-left:8px">Record from keys</button>
</div>
</sc-if>
<span style="flex:1"></span>
<div style="display:flex;align-items:center;gap:12px"><span style="font-size:15px;color:#a9b4d6;font-weight:600">Zoom</span><div style="width:140px;height:8px;border-radius:8px;background:rgba(255,255,255,.12)"><div style="width:40%;height:8px;border-radius:8px;background:linear-gradient(90deg,#79ebff,#8e7cff)"></div></div></div>
</div>

<sc-if value="{{isAudio}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:stretch">
<div style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:12px">
<div style="position:relative;height:230px;border-radius:22px;background:rgba(0,0,0,.32);overflow:hidden">
<div style="position:absolute;left:30%;width:36%;top:0;bottom:0;background:linear-gradient(180deg,rgba(121,235,255,.2),rgba(142,124,255,.1));border-left:2px solid #79ebff;border-right:2px solid #79ebff"></div>
<div style="position:absolute;left:0;right:0;top:114px;height:1px;background:rgba(255,255,255,.1)"></div>
<sc-for list="{{wave}}" as="w" hint-placeholder-count="120"><i style="{{w}}"></i></sc-for>
<div style="position:absolute;left:41%;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#fff,#79ebff);box-shadow:0 0 18px rgba(121,235,255,.9)"></div>
<div style="position:absolute;left:0;top:0;width:8%;height:100%;background:linear-gradient(90deg,rgba(7,11,28,.8),transparent)"></div>
<div style="position:absolute;right:0;top:0;width:10%;height:100%;background:linear-gradient(270deg,rgba(7,11,28,.8),transparent)"></div>
<div style="position:absolute;left:12px;bottom:10px;display:flex;gap:18px;font-family:'DM Mono',monospace;font-size:15px;color:#a9b4d6"><span>Fade in 1/8</span></div>
<div style="position:absolute;right:12px;bottom:10px;font-family:'DM Mono',monospace;font-size:15px;color:#a9b4d6">Fade out 1/4</div>
<div style="position:absolute;left:30%;top:12px;margin-left:10px;padding:5px 12px;border-radius:999px;background:rgba(121,235,255,.2);color:#79ebff;font-family:'DM Mono',monospace;font-size:15px">Selection · 1.9 s</div>
</div>
<div style="position:relative;height:44px;border-radius:14px;background:rgba(255,255,255,.04);overflow:hidden">
<sc-for list="{{mini}}" as="w" hint-placeholder-count="80"><i style="{{w}}"></i></sc-for>
<div style="position:absolute;left:12%;width:64%;top:0;bottom:0;border-radius:12px;box-shadow:0 0 0 2px rgba(255,255,255,.4);background:rgba(255,255,255,.07)"></div>
</div>
</div>

<div style="flex:1 1 320px;max-width:420px;display:flex;flex-direction:column;gap:14px">
<div style="padding:18px;border-radius:22px;background:rgba(255,255,255,.06)">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:17px;font-weight:700">Tempo</span><span style="padding:6px 14px;border-radius:999px;background:rgba(121,235,255,.16);color:#79ebff;font-family:'DM Mono',monospace;font-size:16px">128.0 detected</span></div>
<div style="display:flex;gap:8px;margin-top:14px">
<button class="hov" style="flex:1;height:44px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#eef2ff;font-size:15px;font-weight:600">Use for project</button>
<button class="hov" style="width:56px;height:44px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#eef2ff;font-size:15px;font-weight:600">½</button>
<button class="hov" style="width:56px;height:44px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#eef2ff;font-size:15px;font-weight:600">×2</button>
</div>
<button onClick="{{toggleSync}}" style="width:100%;margin-top:12px;height:50px;display:flex;align-items:center;gap:12px;padding:0 6px 0 16px;border:0;border-radius:16px;background:rgba(255,255,255,.06);color:#eef2ff;font-size:16px;font-weight:600;text-align:left"><span style="flex:1">Follow project tempo (130)</span><span style="{{sync.track}}"><span style="{{sync.knob}}"></span></span></button>
</div>
<div style="padding:18px;border-radius:22px;background:rgba(255,255,255,.06)">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:17px;font-weight:700">Key</span><span style="padding:6px 14px;border-radius:999px;background:rgba(255,99,216,.16);color:#ffb3ec;font-family:'DM Mono',monospace;font-size:16px">A♭ minor detected</span></div>
<button onClick="{{toggleLock}}" style="width:100%;margin-top:14px;height:50px;display:flex;align-items:center;gap:12px;padding:0 6px 0 16px;border:0;border-radius:16px;background:rgba(255,255,255,.06);color:#eef2ff;font-size:16px;font-weight:600;text-align:left"><span style="flex:1">Keep the key when tempo changes</span><span style="{{lock.track}}"><span style="{{lock.knob}}"></span></span></button>
<div style="margin-top:16px"><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:600"><span>Pitch</span><span style="font-family:'DM Mono',monospace;font-weight:400;color:#a9b4d6">+2 st</span></div><div style="position:relative;height:10px;border-radius:10px;background:rgba(255,255,255,.12);margin-top:12px"><div style="width:58%;height:10px;border-radius:10px;background:linear-gradient(90deg,#8e7cff,#ff63d8)"></div><div style="position:absolute;left:calc(58% - 11px);top:-6px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(255,99,216,.7)"></div></div></div>
<div style="margin-top:16px"><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:600"><span>Fine tune</span><span style="font-family:'DM Mono',monospace;font-weight:400;color:#a9b4d6">−8 ct</span></div><div style="position:relative;height:10px;border-radius:10px;background:rgba(255,255,255,.12);margin-top:12px"><div style="width:42%;height:10px;border-radius:10px;background:linear-gradient(90deg,#8e7cff,#ff63d8)"></div><div style="position:absolute;left:calc(42% - 11px);top:-6px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(255,99,216,.7)"></div></div></div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isNotes}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:0;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.28)">
<div style="flex:0 0 76px;display:flex;flex-direction:column">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><div style="{{k.style}}">{{k.name}}</div></sc-for>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<sc-for list="{{roll}}" as="r" hint-placeholder-count="12">
<div style="display:grid;grid-template-columns:repeat(32,minmax(0,1fr));height:27px;background:{{r.bg}}">
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="32"><button class="nc" onClick="{{c.onPick}}" aria-label="{{c.label}}" style="{{c.style}}"></button></sc-for>
</div>
</sc-for>
</div>
</div>
<div style="display:flex;gap:0;align-items:flex-end">
<div style="flex:0 0 76px;font-size:15px;color:#a9b4d6;font-weight:600;padding-bottom:6px">Velocity</div>
<div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(32,minmax(0,1fr));height:72px;align-items:end;padding:0;gap:0">
<sc-for list="{{vel}}" as="v" hint-placeholder-count="32"><div style="display:flex;justify-content:center;align-items:flex-end;height:72px"><span style="{{v}}"></span></div></sc-for>
</div>
</div>
</div>
</sc-if>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = {
    tab: 'audio', sync: true, lock: true,
    notes: { '2:0': 1, '4:2': 1, '7:4': 1, '9:6': 1, '4:8': 1, '2:10': 1, '7:12': 1, '11:14': 1, '9:16': 1, '7:18': 1, '4:20': 1, '2:22': 1, '0:24': 1, '4:26': 1, '7:28': 1, '9:30': 1 }
  };

  renderVals() {
    const S = this.state;
    const A = (s) => 'position:absolute;' + s;
    const ctx = [
      { name: 'Lead', color: '#ff63d8', clips: [[10, 20], [52, 20]] },
      { name: 'Vocal', color: '#7cf0c0', clips: [[30, 36]] },
      { name: 'Drums', color: '#79ebff', clips: [[0, 25], [26, 25], [52, 25], [78, 20]] }
    ].map((t) => ({
      name: t.name, color: t.color,
      clips: t.clips.map((c) => A('left:' + c[0] + '%;width:' + c[1] + '%;top:5px;bottom:5px;border-radius:9px;background:linear-gradient(180deg,' + t.color + '44,' + t.color + '18);box-shadow:' + (t.name === 'Vocal' ? '0 0 0 2px ' + t.color + ',0 0 22px ' + t.color + '66' : '0 0 0 1px ' + t.color + '55')))
    }));
    const wave = [], mini = [];
    for (let i = 0; i < 240; i++) {
      const env = 0.25 + 0.75 * Math.abs(Math.sin(i / 23)) * (0.5 + 0.5 * Math.abs(Math.sin(i / 7 + 1)));
      const h = Math.max(4, Math.round(env * 190 * (0.55 + 0.45 * Math.abs(Math.sin(i * 1.7)))));
      const x = i / 240 * 100;
      const inSel = x >= 30 && x <= 66;
      wave.push(A('left:' + x + '%;top:' + (115 - h / 2) + 'px;width:0.26%;height:' + h + 'px;border-radius:2px;background:' + (inSel ? '#bff6ff' : 'rgba(121,235,255,.5)') + (inSel ? ';box-shadow:0 0 8px rgba(121,235,255,.6)' : '')));
    }
    for (let i = 0; i < 120; i++) {
      const h = Math.max(3, Math.round((0.3 + 0.7 * Math.abs(Math.sin(i / 11))) * 30));
      mini.push(A('left:' + (i / 120 * 100) + '%;top:' + (22 - h / 2) + 'px;width:0.5%;height:' + h + 'px;border-radius:2px;background:rgba(121,235,255,.5)'));
    }
    const names = ['B', 'A♯', 'A', 'G♯', 'G', 'F♯', 'F', 'E', 'D♯', 'D', 'C♯', 'C'];
    const black = (n) => n.indexOf('♯') > -1;
    const keys = names.map((n) => ({ name: n, style: 'height:27px;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-family:DM Mono,monospace;font-size:15px;box-sizing:border-box;border-bottom:1px solid rgba(0,0,0,.25);background:' + (black(n) ? '#1b2250' : '#dfe5fb') + ';color:' + (black(n) ? '#a9b4d6' : '#10173a') }));
    const velOf = (r, c) => 40 + ((r * 31 + c * 17) % 55);
    const roll = names.map((n, r) => ({
      bg: black(n) ? 'rgba(255,255,255,.035)' : 'rgba(255,255,255,.07)',
      cells: Array.from({ length: 32 }, (_, c) => {
        const on = !!S.notes[r + ':' + c];
        return {
          label: n + ' step ' + (c + 1),
          style: 'border:0;padding:0;margin:0;height:27px;background:' + (on ? 'linear-gradient(135deg,#79ebff,#ff63d8)' : 'transparent') + ';border-left:1px solid ' + (c % 4 === 0 ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.04)') + ';' + (on ? 'border-radius:6px;box-shadow:0 0 14px rgba(255,99,216,.5);margin:2px 1px;height:23px' : ''),
          onPick: () => { const notes = { ...S.notes }; const k = r + ':' + c; if (notes[k]) delete notes[k]; else notes[k] = 1; this.setState({ notes }); }
        };
      })
    }));
    const vel = Array.from({ length: 32 }, (_, c) => {
      let r = -1; names.forEach((_, ri) => { if (S.notes[ri + ':' + c]) r = ri; });
      return r < 0 ? 'display:none' : 'display:block;width:8px;height:' + Math.round(velOf(r, c) * 0.7) + 'px;border-radius:4px;background:linear-gradient(0deg,#ff63d8,#79ebff)';
    });
    const tab = (on) => 'height:42px;padding:0 26px;border:0;border-radius:999px;font-size:16px;font-weight:700;color:' + (on ? '#0b1020' : '#d8dff6') + ';background:' + (on ? 'linear-gradient(135deg,#79ebff,#8e7cff 70%)' : 'transparent');
    const sw = (on) => ({ track: 'flex:0 0 auto;width:54px;height:32px;border-radius:32px;position:relative;background:' + (on ? 'linear-gradient(135deg,#79ebff,#8e7cff)' : 'rgba(255,255,255,.16)'), knob: 'position:absolute;top:4px;left:' + (on ? 26 : 4) + 'px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s' });
    return {
      ctx, wave, mini, keys, roll, vel,
      isAudio: S.tab === 'audio', isNotes: S.tab === 'notes',
      tabAudio: tab(S.tab === 'audio'), tabNotes: tab(S.tab === 'notes'),
      showAudio: () => this.setState({ tab: 'audio' }), showNotes: () => this.setState({ tab: 'notes' }),
      sync: sw(S.sync), lock: sw(S.lock),
      toggleSync: () => this.setState({ sync: !S.sync }), toggleLock: () => this.setState({ lock: !S.lock })
    };
  }
}
</script>
