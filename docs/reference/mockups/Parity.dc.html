<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GLCTC1 Studio Parity Map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070b1c}
button{font-family:inherit;cursor:pointer}
.hov{transition:background .2s}
.hov:hover{background:rgba(255,255,255,.12)!important}
</style>
</helmet>
<div style="min-height:900px;box-sizing:border-box;padding:48px 48px 64px;background:radial-gradient(900px 520px at 10% -10%,rgba(142,124,255,.28),transparent 70%),radial-gradient(800px 500px at 100% 10%,rgba(255,99,216,.14),transparent 70%),#070b1c;color:#eef2ff;font-family:Manrope,system-ui,sans-serif;font-size:16px">

<div style="max-width:1320px;margin:0 auto">
<div style="font-size:15px;color:#a9b4d6;font-weight:600;letter-spacing:.04em">Redesign contract</div>
<h1 style="font-family:'Tenor Sans',serif;font-size:48px;font-weight:400;margin:6px 0 10px;line-height:1.1">Parity map</h1>
<p style="font-size:18px;line-height:1.55;color:#c8d1ee;max-width:760px;margin:0 0 28px">Every capability found in the six-part audit of <span style="font-family:'DM Mono',monospace">daw.html</span>, the room it moves to, and what changes. Nothing is dropped. Anything marked Fixed is broken or dead in the current app.</p>

<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:30px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button class="hov" onClick="{{f.onPick}}" style="{{f.style}}"><span style="width:10px;height:10px;border-radius:50%;background:{{f.dot}}"></span>{{f.label}}<span style="font-family:'DM Mono',monospace;opacity:.75">{{f.count}}</span></button>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<section style="padding:26px;border-radius:26px;background:rgba(14,20,48,.6);box-shadow:0 0 0 1px rgba(255,255,255,.08);display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
<h2 style="font-family:'Tenor Sans',serif;font-size:24px;font-weight:400;margin:0;line-height:1.2">{{g.title}}</h2>
<span style="flex:0 0 auto;padding:6px 14px;border-radius:999px;background:rgba(121,235,255,.12);color:#79ebff;font-size:15px;font-weight:600;white-space:nowrap">{{g.room}}</span>
</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
<div style="display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.45;color:#dfe5fb">
<span style="flex:0 0 auto;margin-top:7px;width:10px;height:10px;border-radius:50%;background:{{it.dot}};box-shadow:0 0 10px {{it.dot}}"></span>
<span>{{it.text}}</span>
</div>
</sc-for>
</section>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2400}}'>
class Component extends DCLogic {
  state = { filter: 'all' };

  renderVals() {
    const C = { k: '#79ebff', i: '#8e7cff', n: '#ff63d8', f: '#ffd36a' };
    const G = [
      ['Transport and clock', 'Arrange', [
        ['k', 'Play, stop, loop, record, back to start, loop region'],
        ['k', 'BPM, time signature, snap, grid, metronome'],
        ['k', 'One shared clock; play-all, solo-play and bypass for every instrument'],
        ['i', 'Tap tempo and count-in in the top bar for every instrument, not just two'],
        ['f', 'Status text no longer doubles as the unsaved-changes flag, so the close-tab warning always works']
      ]],
      ['Tracks and clips', 'Arrange', [
        ['k', 'Audio, video, MIDI, instrument and FX tracks; drag, move across tracks, resize'],
        ['k', 'Split, trim to playhead, duplicate, copy, cut, paste, fades, gain, numeric bar fields'],
        ['k', 'Undo and redo, 80 steps deep'],
        ['n', 'Reorder tracks, delete imported media, multi-select clips'],
        ['n', 'Autosave, so nothing depends on pressing Save']
      ]],
      ['Clip editor', 'Arrange · drawer', [
        ['k', 'Waveform range select, cut out, keep selection, zoom, trim bar, fade handles'],
        ['k', 'BPM and key detection, use BPM, half and double, warp to project tempo, key lock, pitch and fine tune'],
        ['f', 'Turning on Sync tempo no longer throws an error on clips with a detected BPM']
      ]],
      ['Automation', 'Arrange · lanes', [
        ['k', 'FX tracks with per-target automation, preset shapes, linked targets'],
        ['n', 'Record automation by moving a knob while playing']
      ]],
      ['MIDI and piano roll', 'Piano roll', [
        ['k', 'Piano roll note editing, computer keyboard and hardware MIDI recording'],
        ['k', 'MIDI learn on any control'],
        ['i', 'See, rename and clear every MIDI binding in one list'],
        ['n', 'Note velocity and a grid longer than 16 steps']
      ]],
      ['Instruments hub', 'Instruments', [
        ['k', 'Eight instruments: 80LA8, Divine09, PAD-64, 30LEE, 0010110, Galactic One, Galactic Vox, Looper'],
        ['f', 'Create Track works on every instrument (it did nothing on Divine09, 30LEE and 0010110)'],
        ['n', 'One shell for all of them: presets left, play surface centre, sound right, record and bounce below']
      ]],
      ['Drum machines', 'Instruments', [
        ['k', '80LA8: 12 voices, 4 patterns, step velocity, swing, samples, euclid and random, bounce'],
        ['k', 'Divine09: 15 voices, 12 kits, 4 patterns up to 128 steps, 4 samples, per-channel mixer'],
        ['k', 'PAD-64: 16 synth voices, sample pads, 64 steps, 4 patterns, accent steps'],
        ['n', 'Bounce, record and MIDI export on Divine09; Divine09 state saved inside the project'],
        ['f', 'Divine09 stutter stops when you stop']
      ]],
      ['Synths', 'Instruments', [
        ['k', '30LEE: sound and FX controls, arpeggiator, 4 patterns, bounce'],
        ['k', '0010110: 3 oscillator layers, 16-step pattern, arp with latch, sample layer, record'],
        ['k', 'Galactic One: 2 patches, split and dual modes, mod matrix, macros, 8 pattern banks, song chain, probability, ratchet, slide'],
        ['n', 'Presets, audio record and bounce for 30LEE and 0010110'],
        ['f', 'Dead controls removed or wired: stereo width, loop length, arp swing; saved 30LEE settings load again'],
        ['i', 'Naming a patch and Euclid settings use a sheet, not a browser prompt']
      ]],
      ['Galactic Vox', 'Instruments', [
        ['k', 'Mic and file input, gate, compressor, pitch and formant shift, auto-tune, harmoniser'],
        ['k', 'Vocoder, choir that sings typed lyrics, piano, multi-sampler, 16 pads, FX rack, 19 vocal presets'],
        ['n', 'Pads, key samples and key maps are saved with the project'],
        ['n', 'Save your own vocal presets; record MIDI; bounce to a track']
      ]],
      ['Sampler and looper', 'Instruments', [
        ['k', '16 pads with loop, one-shot and gate modes, per-pad FX, record from mic, bounce'],
        ['n', 'Trim, slice and envelope on every sample'],
        ['f', 'Pad samples survive a reload and travel with the project package']
      ]],
      ['Mixer and routing', 'Mix', [
        ['k', 'Strip per track with meters, fader, pan, mute, solo, send to master, cue'],
        ['k', 'Master filter, delay and reverb; limiter; headphone and booth device routing'],
        ['n', 'Per-track sends and insert effects'],
        ['f', 'Master effect settings are saved with the project']
      ]],
      ['Presets', 'Instruments · left rail', [
        ['k', 'Save, load and delete presets; genre packs (Techno, House, DnB, Hip-Hop, Ambient, Pop); JSON import and export'],
        ['i', 'One preset browser, same place in every instrument'],
        ['f', 'New factory presets reach existing users, not just first-time visitors']
      ]],
      ['Song composer', 'Song', [
        ['k', 'Section templates (16, 32, 64 bars or the 36-bar demo), pattern per instrument per section, levels'],
        ['k', 'Prompt-based pattern generator'],
        ['f', 'Bounce and Export render the composed song, not the main timeline'],
        ['f', 'Section changes stay on time when the tab is in the background']
      ]],
      ['Performance recorder', 'Arrange · sheet', [
        ['k', 'Arm, record knob and pad gestures, layers, lanes, snap, JSON import and export'],
        ['f', 'Replay is locked to the transport and no longer drifts'],
        ['f', 'Imported takes can only trigger recordable controls']
      ]],
      ['Record anything', 'Record sheet', [
        ['k', 'Record the master, an instrument, a track or the mic; mixed or separate stems'],
        ['k', 'Count-in and auto-stop; takes become clips on new tracks'],
        ['n', 'Punch-in and overdub']
      ]],
      ['Stage', 'Stage', [
        ['k', 'Video and image clips on the visual stage; widescreen, phone-shaped and fullscreen'],
        ['k', 'Preview that follows the playhead'],
        ['n', 'Bigger stage with a clip strip underneath']
      ]],
      ['Library and projects', 'Library', [
        ['k', 'Import audio, video and images; browse assets; search'],
        ['k', 'New, open and save projects; .glctc1 package import and export; saved projects list'],
        ['k', 'WAV export with the long-project warning'],
        ['f', 'Packages include looper and Divine09 samples'],
        ['f', 'Importing a package asks before it replaces a saved project with the same name'],
        ['f', 'Export includes the limiter and module audio, so it sounds like playback']
      ]],
      ['Platform', 'Library · Share', [
        ['k', 'Site navigation and account'],
        ['n', 'Publish a finished track straight to GLCTC1 radio and your artist page']
      ]],
      ['Polish everywhere', 'All rooms', [
        ['i', 'Sheets and toasts replace browser confirm and prompt boxes'],
        ['n', 'Command palette on Cmd+K and a keyboard shortcuts sheet'],
        ['k', 'Existing shortcuts, mobile layout at 480px and below, 15px minimum text']
      ]]
    ];
    const f = this.state.filter;
    const counts = { k: 0, i: 0, n: 0, f: 0 };
    G.forEach((g) => g[2].forEach((it) => { counts[it[0]]++; }));
    const total = counts.k + counts.i + counts.n + counts.f;
    const mk = (id, label, dot, count) => ({
      label, dot, count,
      style: 'display:flex;align-items:center;gap:10px;height:46px;padding:0 20px;border:0;border-radius:999px;font-size:16px;font-weight:600;color:#eef2ff;background:' + (f === id ? 'rgba(142,124,255,.45)' : 'rgba(255,255,255,.08)') + ';box-shadow:' + (f === id ? '0 0 0 1px rgba(255,255,255,.35)' : 'none'),
      onPick: () => this.setState({ filter: id })
    });
    return {
      filters: [mk('all', 'All', '#eef2ff', total), mk('k', 'Kept', C.k, counts.k), mk('i', 'Improved', C.i, counts.i), mk('n', 'New', C.n, counts.n), mk('f', 'Fixed', C.f, counts.f)],
      groups: G.map((g) => ({
        title: g[0], room: g[1],
        items: g[2].filter((it) => f === 'all' || it[0] === f).map((it) => ({ dot: C[it[0]], text: it[1] }))
      })).filter((g) => g.items.length)
    };
  }
}
</script>
</body>
</html>
