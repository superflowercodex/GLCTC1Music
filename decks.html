<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Cosmic 1200 Decks</title>

<style>
@keyframes spinWheel {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes waveMove {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: radial-gradient(circle at top, #0f172a 0%, #020617 40%, #000 100%);
  color: #e5e7eb;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

h1 {
  text-align: center;
  color: #a78bfa;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-size: 0.9rem;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  font-size: 0.75rem;
  margin-bottom: 20px;
}

.glow-card {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  background: rgba(15,23,42,0.95);
  border-radius: 16px;
  border: 1px solid rgba(167,139,250,0.7);
  box-shadow: 0 0 40px rgba(88,28,135,0.6);
}

/* Twin decks layout */
.decks-container {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: 20px;
}

.deck {
  flex: 1 1 0;
  max-width: 480px;
  background: rgba(2,6,23,0.95);
  border-radius: 16px;
  padding: 16px;
  border: 1px solid rgba(30,64,175,0.6);
  box-shadow: 0 0 24px rgba(30,64,175,0.4);
}

.deck-title {
  text-align: center;
  text-transform: uppercase;
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  color: #a78bfa;
  margin-bottom: 10px;
}

/* Platter + pitch */
.deck-top-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin-bottom: 10px;
}

.deck-wheel {
  width: 220px;
  aspect-ratio: 1/1;
  border-radius: 50%;
  background: radial-gradient(circle at center,
    #3b0764 0%,
    #4c1d95 40%,
    #1e1b4b 70%,
    #000 100%
  );
  border: 6px solid #a78bfa; /* medium cosmic glow */
  box-shadow: 0 0 30px rgba(167,139,250,0.9);
  position: relative;

  animation: spinWheel 2.5s linear infinite;
  animation-play-state: paused;
}

/* rotation marker */
.deck-wheel-marker {
  position: absolute;
  top: 10px;
  left: 50%;
  width: 12px;
  height: 70px;
  background: #ff9800;
  border-radius: 999px;
  transform: translateX(-50%);
}

/* grooves */
.deck-wheel-texture {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background-image: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.08) 0px,
    rgba(255,255,255,0.08) 6px,
    transparent 6px,
    transparent 12px
  );
}

/* pitch slider */
.pitch-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.pitch-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #94a3b8;
}

.pitch-slider {
  -webkit-appearance: slider-vertical;
  writing-mode: bt-lr;
  height: 170px;
  width: 18px;
}

/* audio + waveform */
.audio-bar {
  margin-top: 8px;
}

audio {
  width: 100%;
}

.wave-strip {
  height: 32px;
  background: rgba(15,23,42,0.9);
  margin-top: 8px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(148,163,184,0.4);
}

.wave-bar {
  width: 200%;
  height: 100%;
  background: linear-gradient(135deg,#a78bfa,#6366f1,#ec4899,#22c55e);
  opacity: 0.55;
  animation: waveMove 10s linear infinite;
}

/* transport */
.transport-row {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
}

button {
  padding: 6px 12px;
  border-radius: 999px;
  border: none;
  background: #1d4ed8;
  color: #e5e7eb;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  cursor: pointer;
}

button.secondary {
  background: #ec4899;
}

button:focus,
button:hover {
  outline: none;
  box-shadow: 0 0 12px rgba(59,130,246,0.8);
}

/* sliders row */
.slider-row {
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
}

.slider-block {
  text-align: center;
}

.slider-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #94a3b8;
}

.slider-block input[type="range"] {
  width: 100%;
}

/* crossfader */
.crossfader-wrap {
  margin-top: 18px;
  text-align: center;
}

.crossfader-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #94a3b8;
  margin-bottom: 4px;
}

.crossfader {
  width: 60%;
}

/* banks + library */
.section-title {
  margin-top: 18px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #a78bfa;
}

.banks-grid {
  margin-top: 6px;
  display: grid;
  grid-template-columns: repeat(13,1fr);
  gap: 4px;
}

.bank-btn {
  padding: 4px 0;
  border-radius: 999px;
  border: none;
  background: #0f172a;
  color: #e5e7eb;
  font-size: 0.6rem;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(30,64,175,0.7);
}

.bank-btn:hover {
  background: #1d4ed8;
}

.bank-tracks {
  margin-top: 8px;
  font-size: 0.7rem;
}

.bank-track-item,
.library-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  border-bottom: 1px solid rgba(30,64,175,0.4);
}

.library-item-title {
  font-size: 0.7rem;
}

.library-controls select {
  font-size: 0.65rem;
}

/* footer nav */
.footer-nav {
  margin-top: 18px;
  text-align: center;
  font-size: 0.7rem;
  color: #64748b;
}

.footer-nav span {
  margin: 0 8px;
  cursor: pointer;
}

/* responsive scaling */
@media (max-width: 900px) {
  .deck {
    max-width: 380px;
  }
  .deck-wheel {
    width: 190px;
  }
}

@media (max-width: 700px) {
  .glow-card {
    padding: 14px;
  }
  .decks-container {
    gap: 10px;
  }
  .deck {
    max-width: 320px;
    padding: 12px;
  }
  .deck-wheel {
    width: 170px;
  }
}

@media (max-width: 540px) {
  .decks-container {
    transform: scale(0.9);
  }
}
</style>
</head>
<body>

<h1>GLCTC1 – COSMIC 1200 DECKS</h1>
<div class="subtitle">Twin cosmic decks • Pitch‑linked spin • Banks & Library</div>

<div class="glow-card">

  <div class="decks-container">

    <!-- Deck A -->
    <div class="deck" id="deckA">
      <div class="deck-title">Deck A</div>

      <div class="deck-top-row">
        <div class="deck-wheel" id="wheelA">
          <div class="deck-wheel-marker"></div>
          <div class="deck-wheel-texture"></div>
        </div>

        <div class="pitch-wrap">
          <div class="pitch-label">Pitch</div>
          <input type="range" min="0.5" max="1.5" step="0.01"
                 class="pitch-slider" value="1"
                 oninput="setPitch('A', this.value)">
        </div>
      </div>

      <div class="audio-bar">
        <audio id="audioA" controls></audio>
      </div>

      <div class="wave-strip">
        <div class="wave-bar"></div>
      </div>

      <div class="transport-row">
        <button onclick="playDeck('A')">Play</button>
        <button onclick="stopDeck('A')">Stop</button>
        <button onclick="setCue('A')">Cue</button>
        <button onclick="toggleLoop('A')">Loop</button>
        <button class="secondary" onclick="syncDeck('A','B')">Sync → B</button>
      </div>

      <div class="slider-row">
        <div class="slider-block">
          <div class="slider-label">Volume</div>
          <input type="range" min="0" max="1" step="0.01" value="1"
                 oninput="setVolume('A', this.value)">
        </div>
        <div class="slider-block">
          <div class="slider-label">High</div>
          <input type="range" min="-12" max="12" step="1" value="0">
        </div>
        <div class="slider-block">
          <div class="slider-label">Low</div>
          <input type="range" min="-12" max="12" step="1" value="0">
        </div>
      </div>

      <div class="slider-row">
        <div class="slider-block">
          <div class="slider-label">Filter</div>
          <input type="range" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="slider-block">
          <div class="slider-label">Delay</div>
          <input type="range" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="slider-block">
          <div class="slider-label">Trim</div>
          <input type="range" min="0" max="1" step="0.01" value="1">
        </div>
      </div>
    </div>

    <!-- Deck B -->
    <div class="deck" id="deckB">
      <div class="deck-title">Deck B</div>

      <div class="deck-top-row">
        <div class="deck-wheel" id="wheelB">
          <div class="deck-wheel-marker"></div>
          <div class="deck-wheel-texture"></div>
        </div>

        <div class="pitch-wrap">
          <div class="pitch-label">Pitch</div>
          <input type="range" min="0.5" max="1.5" step="0.01"
                 class="pitch-slider" value="1"
                 oninput="setPitch('B', this.value)">
        </div>
      </div>

      <div class="audio-bar">
        <audio id="audioB" controls></audio>
      </div>

      <div class="wave-strip">
        <div class="wave-bar"></div>
      </div>

      <div class="transport-row">
        <button onclick="playDeck('B')">Play</button>
        <button onclick="stopDeck('B')">Stop</button>
        <button onclick="setCue('B')">Cue</button>
        <button onclick="toggleLoop('B')">Loop</button>
        <button class="secondary" onclick="syncDeck('B','A')">Sync → A</button>
      </div>

      <div class="slider-row">
        <div class="slider-block">
          <div class="slider-label">Volume</div>
          <input type="range" min="0" max="1" step="0.01" value="1"
                 oninput="setVolume('B', this.value)">
        </div>
        <div class="slider-block">
          <div class="slider-label">High</div>
          <input type="range" min="-12" max="12" step="1" value="0">
        </div>
        <div class="slider-block">
          <div class="slider-label">Low</div>
          <input type="range" min="-12" max="12" step="1" value="0">
        </div>
      </div>

      <div class="slider-row">
        <div class="slider-block">
          <div class="slider-label">Filter</div>
          <input type="range" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="slider-block">
          <div class="slider-label">Delay</div>
          <input type="range" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="slider-block">
          <div class="slider-label">Trim</div>
          <input type="range" min="0" max="1" step="0.01" value="1">
        </div>
      </div>
    </div>

  </div>

  <!-- Crossfader -->
  <div class="crossfader-wrap">
    <div class="crossfader-label">Crossfader</div>
    <input type="range" min="0" max="1" step="0.01" value="0.5"
           class="crossfader" oninput="setCrossfader(this.value)">
  </div>

  <!-- Banks -->
  <div class="section-title">Banks A–Z</div>
  <div class="banks-grid" id="banksGrid"></div>
  <div class="bank-tracks" id="bankTracks"></div>

  <!-- Master Library -->
  <div class="section-title">Master Library</div>
  <div id="masterLibrary"></div>

  <!-- Footer nav -->
  <div class="footer-nav">
    <span>Login</span>•<span>Upload</span>•<span>Decks</span>
  </div>

</div>

<script>
const MASTER_LIBRARY = [
  { id:'001', title:'Cosmic Dawn', artist:'Leyton', file:'tracks/cosmic-dawn.mp3' },
  { id:'002', title:'Neon Temple', artist:'Leyton', file:'tracks/neon-temple.mp3' }
];

const BANKS = {};
let cues = {A:0,B:0};
let loops = {A:false,B:false};

function audio(deck){
  return document.getElementById(deck === 'A' ? 'audioA' : 'audioB');
}
function wheel(deck){
  return document.getElementById(deck === 'A' ? 'wheelA' : 'wheelB');
}

function playDeck(deck){
  audio(deck).play();
  wheel(deck).style.animationPlayState = 'running';
}

function stopDeck(deck){
  audio(deck).pause();
  audio(deck).currentTime = 0;
  wheel(deck).style.animationPlayState = 'paused';
}

function setCue(deck){
  cues[deck] = audio(deck).currentTime;
}

function toggleLoop(deck){
  loops[deck] = !loops[deck];
  audio(deck).loop = loops[deck];
}

function setPitch(deck, val){
  const rate = parseFloat(val);
  audio(deck).playbackRate = rate;
  wheel(deck).style.animationDuration = (2.5 / rate) + 's';
}

function setVolume(deck, val){
  audio(deck).volume = parseFloat(val);
}

function setCrossfader(v){
  const val = parseFloat(v);
  audio('A').volume = 1 - val;
  audio('B').volume = val;
}

function syncDeck(from, to){
  audio(to).currentTime = audio(from).currentTime;
}

/* Library + banks */
function renderMaster(){
  const box = document.getElementById('masterLibrary');
  box.innerHTML = '';
  MASTER_LIBRARY.forEach(t => {
    const row = document.createElement('div');
    row.className = 'library-item';
    row.innerHTML = `
      <div class="library-item-title"><strong>${t.title}</strong> – ${t.artist}</div>
      <div class="library-controls">
        <select onchange="addToBank('${t.id}', this.value)">
          <option value="">Bank…</option>
          ${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => `<option>${l}</option>`).join('')}
        </select>
        <button onclick="audio('A').src='${t.file}'">Load A</button>
        <button onclick="audio('B').src='${t.file}'">Load B</button>
      </div>
    `;
    box.appendChild(row);
  });
}

function renderBanks(){
  const grid = document.getElementById('banksGrid');
  grid.innerHTML = '';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'bank-btn';
    btn.textContent = letter;
    btn.onclick = () => showBank(letter);
    grid.appendChild(btn);
  });
}

function addToBank(id, letter){
  if (!letter) return;
  const track = MASTER_LIBRARY.find(t => t.id === id);
  if (!track) return;
  if (!BANKS[letter]) BANKS[letter] = [];
  BANKS[letter].push(track);
  showBank(letter);
}

function showBank(letter){
  const box = document.getElementById('bankTracks');
  box.innerHTML = '';
  const list = BANKS[letter] || [];
  const title = document.createElement('div');
  title.textContent = `Bank ${letter}`;
  box.appendChild(title);

  list.forEach(t => {
    const row = document.createElement('div');
    row.className = 'bank-track-item';
    row.innerHTML = `
      <div><strong>${t.title}</strong> – ${t.artist}</div>
      <div>
        <button onclick="audio('A').src='${t.file}'">Load A</button>
        <button onclick="audio('B').src='${t.file}'">Load B</button>
      </div>
    `;
    box.appendChild(row);
  });
}

renderMaster();
renderBanks();
</script>

</body>
</html>
