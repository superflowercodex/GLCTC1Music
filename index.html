<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLCTC1 Cosmic 1200 Decks – Login</title>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 16px #0ea5e9;
      text-align: center;
    }

    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #a5b4fc;
      margin-bottom: 8px;
    }

    .glow-card {
      width: 100%;
      max-width: 600px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 14px;
      padding: 20px;
      box-shadow:
        0 0 25px rgba(56, 189, 248, 0.35),
        0 0 60px rgba(129, 140, 248, 0.35);
      border: 1px solid rgba(56, 189, 248, 0.5);
      margin-top: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 20px;
      margin-top: 16px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
    }

    input {
      width: 100%;
      padding: 6px 8px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.8rem;
    }

    .button-row {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      background: linear-gradient(90deg, #22c55e, #06b6d4);
      color: #020617;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }

    button.secondary {
      background: linear-gradient(90deg, #6366f1, #ec4899);
      color: #f9fafb;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    .auth-status {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #9ca3af;
    }

    nav {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    nav a {
      color: #38bdf8;
      text-decoration: none;
      margin: 0 6px;
      pointer-events: none;
      opacity: 0.4;
    }

    nav a.active {
      pointer-events: auto;
      opacity: 1;
    }
  </style>
</head>

<body>

  <h1>GLCTC1 Cosmic 1200 Decks</h1>

  <!-- CREATE ACCOUNT -->
  <div class="glow-card">
    <h2>Create Account</h2>
    <p style="font-size:0.8rem; color:#9ca3af;">
      Register with email + password to unlock GLCTC1 Studio.
    </p>

    <div class="form-grid">
      <div>
        <label>Email</label>
        <input id="regEmail" type="email" placeholder="you@example.com">
      </div>
      <div>
        <label>Password</label>
        <input id="regPassword" type="password" placeholder="Choose a password">
      </div>
    </div>

    <div class="button-row">
      <button id="createAccountBtn">Create Account</button>
    </div>

    <div class="auth-status" id="regStatus"></div>
  </div>

  <!-- LOGIN -->
  <div class="glow-card">
    <h2>Login</h2>
    <p style="font-size:0.8rem; color:#9ca3af;">
      Log in to enter GLCTC1 Studio.
    </p>

    <div class="form-grid">
      <div>
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="you@example.com">
      </div>
      <div>
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Your password">
      </div>
    </div>

    <div class="button-row">
      <button id="loginBtn">Login</button>
      <button class="secondary" id="logoutBtn">Logout</button>
    </div>

    <div class="auth-status" id="loginStatus">Not logged in.</div>
  </div>

  <!-- ENTER STUDIO -->
  <div class="glow-card">
    <h2>Enter GLCTC1 Studio</h2>
    <p style="font-size:0.8rem; color:#9ca3af;">
      You must be logged in to continue.
    </p>

    <div class="button-row">
      <button id="enterStudioBtn">Go to Upload Page</button>
    </div>
  </div>

  <!-- Navigation -->
  <nav>
    <span>Navigation:</span>
    <a id="navLogin" href="index.html">Login</a> |
    <a id="navUpload" href="upload.html">Upload</a> |
    <a id="navDecks" href="decks.html">Decks</a>
  </nav>

  <script>
    // ⭐ Supabase Client
    const supabaseUrl = "https://zdlaloiruxamxsduxqxw.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbGFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQ";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    /* -----------------------------
       CREATE ACCOUNT → AUTO LOGIN → REDIRECT
    ----------------------------- */
    document.getElementById('createAccountBtn').addEventListener('click', async () => {
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      const { error } = await supabaseClient.auth.signUp({ email, password });

      if (error) {
        const msg = error.message.includes("request this after")
          ? "Please wait a moment before trying again."
          : error.message;
        document.getElementById('regStatus').textContent = msg;
        return;
      }

      document.getElementById('regStatus').textContent = "Account created! Logging you in...";

      // Auto-login
      const { error: loginError } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (loginError) {
        document.getElementById('regStatus').textContent = loginError.message;
        return;
      }

      unlockNavigation();
      window.location.href = "upload.html";
    });

    /* -----------------------------
       LOGIN
    ----------------------------- */
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        document.getElementById('loginStatus').textContent = error.message;
      } else {
        document.getElementById('loginStatus').textContent = "Logged in!";
        unlockNavigation();
      }
    });

    /* -----------------------------
       LOGOUT
    ----------------------------- */
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      document.getElementById('loginStatus').textContent = "Logged out.";
      lockNavigation();
    });

    /* -----------------------------
       ENTER STUDIO (protected)
    ----------------------------- */
    document.getElementById('enterStudioBtn').addEventListener('click', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        alert("You must be logged in.");
        return;
      }

      window.location.href = "upload.html";
    });

    /* -----------------------------
       NAVIGATION LOCK / UNLOCK
    ----------------------------- */
    function unlockNavigation() {
      document.getElementById("navUpload").classList.add("active");
      document.getElementById("navDecks").classList.add("active");
    }

    function lockNavigation() {
      document.getElementById("navUpload").classList.remove("active");
      document.getElementById("navDecks").classList.remove("active");
    }

    /* -----------------------------
       AUTO CHECK LOGIN ON LOAD
    ----------------------------- */
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) unlockNavigation();
      else lockNavigation();
    })();
  </script>

</body>
</html>
