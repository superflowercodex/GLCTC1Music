<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 - Cosmic 1200 Decks</title>

<style>
/* GLOBAL */
body {
  margin: 0;
  padding: 20px;
  background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
  color: #e5e7eb;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}
h1 {
  font-size: 2rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #38bdf8;
  text-shadow: 0 0 16px #0ea5e9;
  text-align: center;
}
h2 {
  font-size: 1.1rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #a5b4fc;
  margin-bottom: 8px;
}

/* GLOW CARD */
.glow-card {
  width: 100%;
  max-width: 1200px;
  background: rgba(15, 23, 42, 0.9);
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 0 25px rgba(56,189,248,0.35), 0 0 60px rgba(129,140,248,0.35);
  border: 1px solid rgba(56,189,248,0.5);
  margin-top: 10px;
}

/* DECK GRID */
.deck-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-top: 20px;
}
.deck {
  background: rgba(2,6,23,0.8);
  border-radius: 12px;
  padding: 16px;
  box-shadow: inset 0 0 20px rgba(56,189,248,0.25);
  position: relative;
}
.deck h3 {
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #38bdf8;
  margin-bottom: 12px;
  text-align: center;
}

/* DECK WHEEL + JOG */
.deck-wheel-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}
.deck-wheel {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle at center, #0f172a 0%, #020617 40%, #000 100%);
  border: 4px solid #38bdf8;
  box-shadow: 0 0 20px rgba(56,189,248,0.7), 0 0 40px rgba(129,140,248,0.5);
  position: relative;
  overflow: hidden;
  transition: transform 0.1s linear;
}
.deck-wheel-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 40px;
  height: 40px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, #38bdf8, #0ea5e9);
  box-shadow: 0 0 20px rgba(56,189,248,0.8);
}
.deck-wheel-ring {
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  border: 2px dashed rgba(129,140,248,0.8);
}

/* LED RING (BPM feel) */
.led-ring {
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 2px solid rgba(56,189,248,0.2);
  box-shadow: 0 0 18px rgba(56,189,248,0.6);
  opacity: 0.6;
}

/* CHAKRA DOTS */
.chakra-dot {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  box-shadow: 0 0 12px currentColor;
}
.chakra-root   { color:#ef4444; bottom:0; left:50%; transform:translateX(-50%); }
.chakra-sacral { color:#f97316; bottom:20%; left:80%; }
.chakra-solar  { color:#eab308; bottom:50%; right:0; transform:translateY(50%); }
.chakra-heart  { color:#22c55e; top:50%; right:0; transform:translateY(-50%); }
.chakra-throat { color:#0ea5e9; top:20%; right:20%; }
.chakra-third  { color:#6366f1; top:0; left:50%; transform:translateX(-50%); }
.chakra-crown  { color:#a855f7; top:20%; left:20%; }

/* WAVE STRIP */
.wave-strip {
  width:100%;
  height:60px;
  margin-top:10px;
  border-radius:10px;
  background:linear-gradient(90deg,rgba(56,189,248,0.1),rgba(129,140,248,0.3));
  box-shadow:inset 0 0 20px rgba(56,189,248,0.25);
  overflow:hidden;
  position:relative;
}
.wave-bar {
  position:absolute;
  width:200%;
  height:100%;
  background-image:linear-gradient(135deg,
    rgba(56,189,248,0.6) 0%,
    rgba(129,140,248,0.6) 25%,
    rgba(236,72,153,0.6) 50%,
    rgba(34,197,94,0.6) 75%,
    rgba(56,189,248,0.6) 100%);
  opacity:0.6;
  animation:waveMove 8s linear infinite;
}
@keyframes waveMove { from{transform:translateX(0);} to{transform:translateX(-50%);} }

/* BUTTONS */
button {
  padding: 8px 16px;
  border-radius: 999px;
  border: none;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  cursor: pointer;
  background: linear-gradient(90deg, #22c55e, #06b6d4);
  color: #020617;
  box-shadow: 0 0 12px rgba(34,197,94,0.5);
}
button.secondary {
  background: linear-gradient(90deg, #6366f1, #ec4899);
  color: #fff;
  box-shadow: 0 0 12px rgba(99,102,241,0.5);
}

/* DJ CROSSFADER */
.crossfader-wrap { margin-top: 20px; }
.crossfader-labels {
  display:flex;
  justify-content:space-between;
  font-size:0.75rem;
  text-transform:uppercase;
  color:#9ca3af;
  margin-bottom:4px;
}
.crossfader {
  width:100%;
  height:14px;
  background:#111;
  border-radius:6px;
  box-shadow:inset 0 0 8px #000;
  outline:none;
}
.crossfader::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:28px;
  height:28px;
  background:#38bdf8;
  border-radius:4px;
  box-shadow:0 0 12px #38bdf8;
  cursor:pointer;
}
.crossfader::-moz-range-thumb {
  width:28px;
  height:28px;
  background:#38bdf8;
  border-radius:4px;
  box-shadow:0 0 12px #38bdf8;
  cursor:pointer;
}

/* VOLUME */
.slider-wrap {
  margin-top: 12px;
  text-align: center;
}
.slider-wrap label {
  font-size: 0.75rem;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.slider {
  width: 80%;
  margin-top: 4px;
}

/* VERTICAL PITCH (DJ STYLE) */
.pitch-wrap {
  position: absolute;
  right: -40px;
  top: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.pitch-wrap label {
  font-size: 0.75rem;
  color: #38bdf8;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.pitch-slider {
  -webkit-appearance: slider-vertical;
  writing-mode: bt-lr;
  width: 14px;
  height: 180px;
  background: #1f2937;
  border-radius: 8px;
  box-shadow: inset 0 0 10px rgba(56,189,248,0.4);
}
.pitch-slider::-webkit-slider-thumb {
  width: 22px;
  height: 22px;
  background: #38bdf8;
  border-radius: 50%;
  box-shadow: 0 0 12px #38bdf8;
  cursor: pointer;
}

/* EQ + FILTER */
.eq-row {
  margin-top: 12px;
  display: flex;
  justify-content: center;
  gap: 12px;
}
.eq-knob {
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:0.7rem;
  color:#9ca3af;
  text-transform:uppercase;
  letter-spacing:0.12em;
}
.eq-knob input {
  width: 60px;
}

/* CUE + LOOP */
.transport-row {
  margin-top: 10px;
  display:flex;
  justify-content:center;
  gap:8px;
}

/* VISUALIZER + BEAT GRID */
.visualizer {
  width:100%;
  height:200px;
  background:radial-gradient(circle at center,#020617 0%,#000 60%);
  border-radius:12px;
  margin-top:20px;
  box-shadow:inset 0 0 20px rgba(129,140,248,0.25);
  position:relative;
  overflow:hidden;
}
.visual-orb {
  position:absolute;
  width:40px;
  height:40px;
  border-radius:50%;
  background:radial-gradient(circle,#38bdf8,transparent);
  box-shadow:0 0 30px rgba(56,189,248,0.8);
  animation:orbPulse 4s ease-in-out infinite;
}
@keyframes orbPulse {
  0%{transform:translate(20%,40%) scale(1);opacity:0.7;}
  50%{transform:translate(60%,20%) scale(1.4);opacity:1;}
  100%{transform:translate(30%,70%) scale(1);opacity:0.7;}
}
.beat-grid {
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  height:40px;
  display:flex;
  gap:4px;
}
.beat-bar {
  flex:1;
  background:#1f2937;
  border-radius:4px;
  box-shadow:inset 0 0 6px #000;
}

/* LIBRARY */
.library-list {
  margin-top:20px;
  background:rgba(2,6,23,0.8);
  padding:16px;
  border-radius:12px;
  box-shadow:inset 0 0 20px rgba(56,189,248,0.25);
}
.library-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid rgba(31,41,55,0.8);
  font-size:0.85rem;
}
.library-item:last-child { border-bottom:none; }

/* BANKS */
#banks { margin-top: 24px; }
.banks-grid {
  display:grid;
  grid-template-columns:repeat(13,1fr);
  gap:8px;
  margin-top:12px;
}
.bank-btn {
  background: radial-gradient(circle, #38bdf8 0%, #020617 80%);
  border: 2px solid #38bdf8;
  color: #020617;
  font-weight: 700;
  border-radius: 999px;
  padding: 6px 0;
  cursor: pointer;
  font-size: 0.8rem;
  text-transform: uppercase;
  box-shadow: 0 0 12px rgba(56,189,248,0.6);
  transition: 0.2s;
}
.bank-btn:hover {
  background: #f9fafb;
  color: #020617;
  box-shadow: 0 0 16px rgba(56,189,248,0.9);
}
#bankTracks { margin-top: 16px; }
.bank-track-item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid rgba(31,41,55,0.8);
  font-size:0.85rem;
}
.bank-track-item:last-child { border-bottom:none; }
</style>
</head>

<body>
<h1>GLCTC1 - Cosmic 1200 Decks</h1>

<!-- DECKS CARD -->
<div class="glow-card">
  <h2>Cosmic 1200 Twin Decks</h2>

  <div class="deck-grid">

    <!-- DECK A -->
    <div class="deck" id="deckA">
      <h3>Deck A</h3>

      <div class="deck-wheel-wrap">
        <div class="deck-wheel" id="deckAWheel">
          <div class="deck-wheel-inner"></div>
          <div class="deck-wheel-ring"></div>
          <div class="led-ring" id="deckALed"></div>
          <div class="chakra-dot chakra-root"></div>
          <div class="chakra-dot chakra-sacral"></div>
          <div class="chakra-dot chakra-solar"></div>
          <div class="chakra-dot chakra-heart"></div>
          <div class="chakra-dot chakra-throat"></div>
          <div class="chakra-dot chakra-third"></div>
          <div class="chakra-dot chakra-crown"></div>
        </div>

        <!-- Vertical pitch slider -->
        <div class="pitch-wrap">
          <label>Pitch</label>
          <input type="range" min="0.5" max="1.5" step="0.01"
                 class="pitch-slider"
                 oninput="setPitch('A',this.value)">
        </div>
      </div>

      <audio id="deckAAudio" controls></audio>

      <div class="wave-strip"><div class="wave-bar"></div></div>

      <div class="transport-row">
        <button onclick="playDeck('A')">Play</button>
        <button onclick="stopDeck('A')">Stop</button>
        <button class="secondary" onclick="syncDeck('A','B')">Sync → B</button>
        <button onclick="setCue('A')">Cue</button>
        <button onclick="loopDeck('A')">Loop</button>
      </div>

      <div class="slider-wrap">
        <label>Volume</label>
        <input type="range" min="0" max="1" step="0.01"
               class="slider" oninput="setVolume('A',this.value)">
      </div>

      <div class="eq-row">
        <div class="eq-knob">
          <span>High</span>
          <input type="range" min="0" max="2" step="0.01"
                 oninput="setEQ('A','high',this.value)">
        </div>
        <div class="eq-knob">
          <span>Mid</span>
          <input type="range" min="0" max="2" step="0.01"
                 oninput="setEQ('A','mid',this.value)">
        </div>
        <div class="eq-knob">
          <span>Low</span>
          <input type="range" min="0" max="2" step="0.01"
                 oninput="setEQ('A','low',this.value)">
        </div>
        <div class="eq-knob">
          <span>Filter</span>
          <input type="range" min="0" max="1" step="0.01"
                 oninput="setFilter('A',this.value)">
        </div>
      </div>
    </div>

    <!-- DECK B -->
    <div class="deck" id="deckB">
      <h3>Deck B</h3>

      <div class="deck-wheel-wrap">
        <div class="deck-wheel" id="deckBWheel">
          <div class="deck-wheel-inner"></div>
          <div class="deck-wheel-ring"></div>
          <div class="led-ring" id="deckBLed"></div>
          <div class="chakra-dot chakra-root"></div>
          <div class="chakra-dot chakra-sacral"></div>
          <div class="chakra-dot chakra-solar"></div>
          <div class="chakra-dot chakra-heart"></div>
          <div class="chakra-dot chakra-throat"></div>
          <div class="chakra-dot chakra-third"></div>
          <div class="chakra-dot chakra-crown"></div>
        </div>

        <!-- Vertical pitch slider -->
        <div class="pitch-wrap">
          <label>Pitch</label>
          <input type="range" min="0.5" max="1.5" step="0.01"
                 class="pitch-slider"
                 oninput="setPitch('B',this.value)">
        </div>
      </div>

      <audio id="deckBAudio" controls></audio>

      <div class="wave-strip"><div class="wave-bar"></div></div>

      <div class="transport-row">
        <button onclick="playDeck('B')">Play</button>
        <button onclick="stopDeck('B')">Stop</button>
        <button class="secondary" onclick="syncDeck('B','A')">Sync → A</button>
        <button onclick="setCue('B')">Cue</button>
        <button onclick="loopDeck('B')">Loop</button>
      </div>

      <div class="slider-wrap">
        <label>Volume</label>
        <input type="range" min="0" max="1" step="0.01"
               class="slider" oninput="setVolume('B',this.value)">
      </div>

      <div class="eq-row">
        <div class="eq-knob">
          <span>High</span>
          <input type="range" min="0" max="2" step="0.01"
                 oninput="setEQ('B','high',this.value)">
        </div>
        <div class="eq-knob">
          <span>Mid</span>
          <input type="range" min="0" max="2" step="0.01"
                 oninput="setEQ('B','mid',this.value)">
        </div>
        <div class="eq-knob">
          <span>Low</span>
          <input type="range" min="0" max="2" step="0.01"
                 oninput="setEQ('B','low',this.value)">
        </div>
        <div class="eq-knob">
          <span>Filter</span>
          <input type="range" min="0" max="1" step="0.01"
                 oninput="setFilter('B',this.value)">
        </div>
      </div>
    </div>

  </div>

  <!-- DJ CROSSFADER -->
  <div class="crossfader-wrap">
    <div class="crossfader-labels">
      <span>Deck A</span>
      <span>Deck B</span>
    </div>
    <input type="range" id="crossfader" class="crossfader"
           min="0" max="100" value="50"
           oninput="updateCrossfader(this.value)">
  </div>

  <!-- VISUALIZER + BEAT GRID -->
  <div class="visualizer">
    <div class="visual-orb"></div>
    <div class="beat-grid" id="beatGrid">
      <div class="beat-bar"></div>
      <div class="beat-bar"></div>
      <div class="beat-bar"></div>
      <div class="beat-bar"></div>
      <div class="beat-bar"></div>
      <div class="beat-bar"></div>
      <div class="beat-bar"></div>
      <div class="beat-bar"></div>
    </div>
  </div>
</div>

<!-- BANKS CARD -->
<div class="glow-card" id="banks">
  <h2>GLCTC1 Banks A–Z</h2>
  <p style="font-size:0.8rem; color:#9ca3af;">
    Select a bank to view its playlist and load tracks to Deck A or Deck B.
  </p>

  <div class="banks-grid">
    <script>
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l =>
        document.write(`<button class='bank-btn' onclick="selectBank('${l}')">${l}</button>`)
      );
    </script>
  </div>

  <div id="bankTracks"></div>
</div>

<!-- MASTER LIBRARY CARD -->
<div class="glow-card">
  <h2>GLCTC1 Master Library</h2>
  <div class="library-list" id="masterList">
    <div class="library-item">
      <div>
        <div class="library-title">Cosmic Sunrise</div>
        <div class="library-meta">GLCTC1 · 120 BPM · A minor</div>
      </div>
      <div class="library-actions">
        <button class="secondary" onclick="loadDeck('A','tracks/cosmic_sunrise.mp3')">Load A</button>
        <button class="secondary" onclick="loadDeck('B','tracks/cosmic_sunrise.mp3')">Load B</button>
      </div>
    </div>
  </div>
</div>

<script>
/* BASIC DECK CONTROL */
function loadDeck(deck, src) {
  const audio = document.getElementById(`deck${deck}Audio`);
  audio.src = src;
  audio.play();
}
function playDeck(deck) {
  const audio = document.getElementById(`deck${deck}Audio`);
  audio.play();
}
function stopDeck(deck) {
  const audio = document.getElementById(`deck${deck}Audio`);
  audio.pause();
}

/* CUE + LOOP (simple) */
const cues = { A: 0, B: 0 };
const loops = { A: false, B: false };

function setCue(deck) {
  const audio = document.getElementById(`deck${deck}Audio`);
  cues[deck] = audio.currentTime;
}
function loopDeck(deck) {
  loops[deck] = !loops[deck];
}

/* SYNC */
function syncDeck(from, to) {
  const f = document.getElementById(`deck${from}Audio`);
  const t = document.getElementById(`deck${to}Audio`);
  t.currentTime = f.currentTime;
}

/* DJ CROSSFADER */
function updateCrossfader(v) {
  const a = document.getElementById('deckAAudio');
  const b = document.getElementById('deckBAudio');
  const mix = v / 100;      // 0 = full A, 1 = full B
  a.volume = 1 - mix;
  b.volume = mix;
}

/* VOLUME + PITCH */
function setVolume(deck, value) {
  const audio = document.getElementById(`deck${deck}Audio`);
  audio.volume = parseFloat(value);
}
function setPitch(deck, value) {
  const audio = document.getElementById(`deck${deck}Audio`);
  const wheel = document.getElementById(`deck${deck}Wheel`);
  const led = document.getElementById(`deck${deck}Led`);
  const rate = parseFloat(value);
  audio.playbackRate = rate;

  // LED intensity + wheel rotation speed feel
  led.style.opacity = 0.4 + (rate - 0.5);
  wheel.dataset.rate = rate;
}

/* EQ + FILTER (visual only) */
const eqState = {
  A: { high:1, mid:1, low:1, filter:0 },
  B: { high:1, mid:1, low:1, filter:0 }
};
function setEQ(deck, band, value) {
  eqState[deck][band] = parseFloat(value);
}
function setFilter(deck, value) {
  eqState[deck].filter = parseFloat(value);
}

/* SIMPLE BANKS */
const BANKS = {
  A: [
    { title: 'Alpha Dawn',   meta: 'GLCTC1 · 118 BPM · A minor', file: 'tracks/alpha_dawn.mp3' },
    { title: 'Astral Drift', meta: 'GLCTC1 · 122 BPM · C minor', file: 'tracks/astral_drift.mp3' }
  ],
  B: [
    { title: 'Binary Bloom', meta: 'GLCTC1 · 124 BPM · B minor', file: 'tracks/binary_bloom.mp3' }
  ]
};

function selectBank(letter) {
  const container = document.getElementById('bankTracks');
  const tracks = BANKS[letter] || [];

  container.innerHTML =
    `<h3 style="text-transform:uppercase; letter-spacing:0.12em; color:#a5b4fc;">Bank ${letter} Playlist</h3>`;

  if (!tracks.length) {
    container.innerHTML += `<p style="font-size:0.8rem; color:#9ca3af;">No tracks in this bank yet.</p>`;
    return;
  }

  tracks.forEach(track => {
    const div = document.createElement('div');
    div.className = 'bank-track-item';
    div.innerHTML = `
      <div>
        <div class="bank-track-title">${track.title}</div>
        <div class="bank-track-meta">${track.meta}</div>
      </div>
      <div class="bank-track-actions">
        <button class="secondary" onclick="loadDeck('A','${track.file}')">Load A</button>
        <button class="secondary" onclick="loadDeck('B','${track.file}')">Load B</button>
      </div>
    `;
    container.appendChild(div);
  });
}

/* JOG WHEEL ROTATION + BEAT GRID PULSE */
let lastTime = performance.now();
function animateDecks(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  ['A','B'].forEach(deck => {
    const wheel = document.getElementById(`deck${deck}Wheel`);
    const rate = parseFloat(wheel.dataset.rate || '1');
    const current = parseFloat(wheel.dataset.angle || '0');
    const newAngle = current + rate * 90 * dt; // 90 deg/sec at rate 1
    wheel.style.transform = `rotate(${newAngle}deg)`;
    wheel.dataset.angle = newAngle;
  });

  // Beat grid pulse based on Deck A rate
  const grid = document.getElementById('beatGrid');
  const bars = grid.querySelectorAll('.beat-bar');
  const aWheel = document.getElementById('deckAWheel');
  const aRate = parseFloat(aWheel.dataset.rate || '1');
  const intensity = 0.3 + (aRate - 0.5);
  bars.forEach((bar, i) => {
    const phase = (now / 200 + i) % 2;
    bar.style.backgroundColor = phase < 1
      ? `rgba(56,189,248,${intensity})`
      : '#1f2937';
  });

  requestAnimationFrame(animateDecks);
}
requestAnimationFrame(animateDecks);

/* SIMPLE LOOP (visual cue only) */
setInterval(() => {
  ['A','B'].forEach(deck => {
    if (!loops[deck]) return;
    const audio = document.getElementById(`deck${deck}Audio`);
    if (audio.currentTime - cues[deck] > 4) { // 4s loop
      audio.currentTime = cues[deck];
    }
  });
}, 200);
</script>
</body>
</html>
