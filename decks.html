<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLCTC1 – Page 3 Cosmic Decks</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #1a0033, #000010);
      color: #fff;
    }
    a {
      color: #0ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .page3-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .top-nav-links a {
      margin-right: 12px;
      font-size: 13px;
    }
    h2, h3, h4, h5 {
      margin: 0 0 8px 0;
    }

    .top-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .deck-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(10, 0, 40, 0.85);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 30px #0ff3;
    }

    .waveform {
      width: 100%;
      height: 80px;
      background: linear-gradient(90deg, #0ff2, #80f2);
      border: 2px solid #0ff;
      box-shadow: 0 0 12px #0ff;
      border-radius: 6px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #aaf;
      margin-top: 4px;
    }

    .platter-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .platter {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #0ff, #003);
      border: 6px solid #0ff;
      box-shadow: 0 0 25px #0ff;
      animation: spin 4s linear infinite;
    }
    .pitch {
      width: 220px;
    }

    .deck-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }
    .deck-controls button {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #0ff;
      background: #020314;
      color: #0ff;
      cursor: pointer;
      font-size: 12px;
    }
    .deck-controls button:hover {
      background: #041a2a;
    }

    .vol-gain-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
    }
    .vol-gain-row label {
      font-size: 11px;
      text-align: center;
      color: #aaf;
    }
    .vol-gain-row input[type="range"] {
      width: 100px;
    }

    .eq-row, .fx-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }
    .eq-row label, .fx-row label {
      font-size: 11px;
      text-align: center;
      color: #aaf;
    }
    .eq-row input[type="range"],
    .fx-row input[type="range"] {
      width: 80px;
    }

    .banks-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }
    .banks-row button {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #f0f;
      background: #12021a;
      color: #f0f;
      cursor: pointer;
      font-size: 11px;
    }
    .banks-row button:hover {
      background: #2a0433;
    }

    .visualizer {
      width: 100%;
      height: 40px;
      margin-top: 8px;
      background: linear-gradient(90deg, #f0f2, #40f2);
      border-radius: 8px;
      border: 2px solid #f0f;
      box-shadow: 0 0 15px #f0f;
    }

    .crossfader-panel {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(5, 0, 30, 0.9);
      box-shadow: 0 0 20px #0ff3;
      text-align: center;
    }
    .crossfader-panel input[type="range"] {
      width: 60%;
    }

    .library-panel {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(5, 0, 30, 0.9);
      box-shadow: 0 0 20px #f0f3;
    }
    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .library-header span {
      font-size: 12px;
      color: #aaf;
    }

    .library-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .library-item {
      flex: 1 1 260px;
      padding: 10px;
      border-radius: 8px;
      background: #12021a;
      border: 1px solid #0ff4;
      cursor: pointer;
      position: relative;
    }
    .library-item:hover {
      border-color: #f0f;
    }
    .library-item strong {
      display: block;
      margin-bottom: 2px;
    }
    .library-item small {
      color: #aaf;
    }
    .library-load-buttons {
      position: absolute;
      right: 8px;
      bottom: 8px;
      display: flex;
      gap: 4px;
    }
    .library-load-buttons button {
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #0ff;
      background: #020314;
      color: #0ff;
      font-size: 11px;
      cursor: pointer;
    }

    .track-details {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #080015;
      border: 1px solid #0ff4;
    }
    .track-meta {
      font-size: 12px;
      color: #aaf;
      margin-bottom: 8px;
    }
    .stem-list {
      margin-top: 8px;
    }
    .stem-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 6px;
      border-radius: 6px;
      background: #140022;
    }
    .stem-item span {
      font-size: 12px;
    }
    .stem-item button {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #0ff;
      background: #020314;
      color: #0ff;
      cursor: pointer;
      font-size: 11px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .top-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="page3-wrapper">
    <div class="top-nav">
      <div>
        <h2>GLCTC1 Cosmic Decks – Page 3</h2>
      </div>
      <div class="top-nav-links">
        <a href="index.html">Login</a>
        <a href="upload.html">Upload</a>
        <a href="decks.html">Decks</a>
      </div>
    </div>

    <!-- TWIN DECKS -->
    <div class="top-row">
      <!-- DECK A -->
      <div class="deck-column" id="deckA">
        <h3>Deck A</h3>

        <!-- Waveform slot -->
        <canvas id="waveA" class="waveform"></canvas>

        <!-- Time display -->
        <div class="time-row">
          <span id="timeA">0:00</span>
          <span id="durationA">0:00</span>
        </div>

        <!-- Platter + pitch -->
        <div class="platter-row">
          <div class="platter" id="platterA"></div>
          <input type="range" class="pitch" id="pitchA" min="-50" max="50" value="0">
        </div>

        <!-- Deck controls -->
        <div class="deck-controls">
          <button id="playA">Play</button>
          <button id="pauseA">Pause</button>
          <button id="stopA">Stop</button>
          <button id="cueA">Cue</button>
          <button id="loopA">Loop</button>
          <button id="syncBtoA">Sync → A</button>
        </div>

        <!-- Volume / Gain -->
        <div class="vol-gain-row">
          <label>Volume<br><input type="range" id="volA" min="0" max="100" value="80"></label>
          <label>Gain<br><input type="range" id="gainA" min="0" max="100" value="50"></label>
        </div>

        <!-- EQ -->
        <div class="eq-row">
          <div>
            <label>High<br><input type="range" id="eqHighA" min="-12" max="12" value="0"></label>
          </div>
          <div>
            <label>Mid<br><input type="range" id="eqMidA" min="-12" max="12" value="0"></label>
          </div>
          <div>
            <label>Low<br><input type="range" id="eqLowA" min="-12" max="12" value="0"></label>
          </div>
        </div>

        <!-- FX -->
        <div class="fx-row">
          <div>
            <label>Filter<br><input type="range" id="filterA" min="0" max="100" value="50"></label>
          </div>
          <div>
            <label>Delay<br><input type="range" id="delayA" min="0" max="100" value="0"></label>
          </div>
        </div>

        <!-- Banks / hotcues -->
        <div class="banks-row">
          <button>Bank A</button>
          <button>Bank B</button>
          <button>Bank C</button>
          <button>Bank D</button>
          <button>Bank E</button>
          <button>Bank F</button>
          <button>Bank G</button>
          <button>Bank H</button>
        </div>

        <!-- Visualizer -->
        <canvas id="vizA" class="visualizer"></canvas>
      </div>

      <!-- DECK B -->
      <div class="deck-column" id="deckB">
        <h3>Deck B</h3>

        <!-- Waveform slot -->
        <canvas id="waveB" class="waveform"></canvas>

        <!-- Time display -->
        <div class="time-row">
          <span id="timeB">0:00</span>
          <span id="durationB">0:00</span>
        </div>

        <!-- Platter + pitch -->
        <div class="platter-row">
          <div class="platter" id="platterB"></div>
          <input type="range" class="pitch" id="pitchB" min="-50" max="50" value="0">
        </div>

        <!-- Deck controls -->
        <div class="deck-controls">
          <button id="playB">Play</button>
          <button id="pauseB">Pause</button>
          <button id="stopB">Stop</button>
          <button id="cueB">Cue</button>
          <button id="loopB">Loop</button>
          <button id="syncAtoB">Sync → B</button>
        </div>

        <!-- Volume / Gain -->
        <div class="vol-gain-row">
          <label>Volume<br><input type="range" id="volB" min="0" max="100" value="80"></label>
          <label>Gain<br><input type="range" id="gainB" min="0" max="100" value="50"></label>
        </div>

        <!-- EQ -->
        <div class="eq-row">
          <div>
            <label>High<br><input type="range" id="eqHighB" min="-12" max="12" value="0"></label>
          </div>
          <div>
            <label>Mid<br><input type="range" id="eqMidB" min="-12" max="12" value="0"></label>
          </div>
          <div>
            <label>Low<br><input type="range" id="eqLowB" min="-12" max="12" value="0"></label>
          </div>
        </div>

        <!-- FX -->
        <div class="fx-row">
          <div>
            <label>Filter<br><input type="range" id="filterB" min="0" max="100" value="50"></label>
          </div>
          <div>
            <label>Delay<br><input type="range" id="delayB" min="0" max="100" value="0"></label>
          </div>
        </div>

        <!-- Banks / hotcues -->
        <div class="banks-row">
          <button>Bank I</button>
          <button>Bank J</button>
          <button>Bank K</button>
          <button>Bank L</button>
          <button>Bank M</button>
          <button>Bank N</button>
          <button>Bank O</button>
          <button>Bank P</button>
        </div>

        <!-- Visualizer -->
        <canvas id="vizB" class="visualizer"></canvas>
      </div>
    </div>

    <!-- Crossfader -->
    <div class="crossfader-panel">
      <h3>Crossfader</h3>
      <label>
        Mix A ↔ B<br>
        <input type="range" id="crossfader" min="0" max="100" value="50">
      </label>
    </div>

    <!-- MASTER LIBRARY + STEMS -->
    <div class="library-panel">
      <div class="library-header">
        <h3>Master Library</h3>
        <span>Click a track row to see full details here.</span>
      </div>

      <div class="library-list" id="libraryList"></div>

      <div class="track-details" id="trackDetails" style="display:none;">
        <h4 id="trackTitle"></h4>
        <p class="track-meta" id="trackMeta"></p>

        <h5>Stems</h5>
        <div class="stem-list" id="stemList"></div>
      </div>
    </div>
  </div>

  <script>
    /* AUDIO CONTEXTS */
    const audioCtxA = new (window.AudioContext || window.webkitAudioContext)();
    const audioCtxB = new (window.AudioContext || window.webkitAudioContext)();

    let bufferA = null;
    let bufferB = null;
    let sourceA = null;
    let sourceB = null;

    let startTimeA = 0;
    let startTimeB = 0;
    let pausedAtA = 0;
    let pausedAtB = 0;

    /* PITCH-LINKED SPIN */
    function updatePitch(platterId, pitchValue) {
      const platter = document.getElementById(platterId);
      const speed = 4 - (pitchValue / 25);
      platter.style.animationDuration = `${Math.max(0.5, speed)}s`;
    }
    document.getElementById("pitchA").addEventListener("input", e => {
      updatePitch("platterA", e.target.value);
    });
    document.getElementById("pitchB").addEventListener("input", e => {
      updatePitch("platterB", e.target.value);
    });

    /* WAVEFORM DRAWING */
    function drawWaveform(audioBuffer, canvasId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      const width = canvas.width = canvas.offsetWidth;
      const height = canvas.height = canvas.offsetHeight;

      const data = audioBuffer.getChannelData(0);
      const step = Math.max(1, Math.floor(data.length / width));
      const amp = height / 2;

      ctx.clearRect(0, 0, width, height);
      ctx.beginPath();
      ctx.moveTo(0, amp);

      for (let i = 0; i < width; i++) {
        const v = data[i * step] * amp;
        ctx.lineTo(i, amp + v);
      }

      ctx.strokeStyle = "#0ff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    /* VISUALIZER (FAKE BARS) */
    function drawVisualizer(canvasId, tick) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const width = canvas.width = canvas.offsetWidth;
      const height = canvas.height = canvas.offsetHeight;

      ctx.clearRect(0, 0, width, height);
      const bars = 32;
      const barWidth = width / bars;
      for (let i = 0; i < bars; i++) {
        const h = (Math.sin((i + tick) * 0.3) * 0.5 + 0.5) * height;
        ctx.fillStyle = `hsl(${200 + i * 3}, 100%, 60%)`;
        ctx.fillRect(i * barWidth, height - h, barWidth - 2, h);
      }
    }
    let vizTick = 0;
    setInterval(() => {
      vizTick += 1;
      drawVisualizer("vizA", vizTick);
      drawVisualizer("vizB", vizTick + 10);
    }, 80);

    /* TIME DISPLAY */
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s.toString().padStart(2, "0")}`;
    }
    setInterval(() => {
      if (bufferA && sourceA) {
        const now = audioCtxA.currentTime;
        const elapsed = now - startTimeA + pausedAtA;
        document.getElementById("timeA").textContent = formatTime(elapsed);
        document.getElementById("durationA").textContent = formatTime(bufferA.duration);
      }
      if (bufferB && sourceB) {
        const now = audioCtxB.currentTime;
        const elapsed = now - startTimeB + pausedAtB;
        document.getElementById("timeB").textContent = formatTime(elapsed);
        document.getElementById("durationB").textContent = formatTime(bufferB.duration);
      }
    }, 200);

    /* LOAD STEM INTO DECK + WAVEFORM */
    async function loadStemToDeck(url, deck) {
      const response = await fetch(url);
      const arrayBuffer = await response.arrayBuffer();

      if (deck === "A") {
        bufferA = await audioCtxA.decodeAudioData(arrayBuffer);
        drawWaveform(bufferA, "waveA");
        pausedAtA = 0;
        document.getElementById("timeA").textContent = "0:00";
        document.getElementById("durationA").textContent = formatTime(bufferA.duration);
      } else {
        bufferB = await audioCtxB.decodeAudioData(arrayBuffer);
        drawWaveform(bufferB, "waveB");
        pausedAtB = 0;
        document.getElementById("timeB").textContent = "0:00";
        document.getElementById("durationB").textContent = formatTime(bufferB.duration);
      }
    }

    /* PLAY / PAUSE / STOP */
    function playDeck(deck) {
      if (deck === "A" && bufferA) {
        if (sourceA) sourceA.stop();
        sourceA = audioCtxA.createBufferSource();
        sourceA.buffer = bufferA;
        sourceA.connect(audioCtxA.destination);
        startTimeA = audioCtxA.currentTime;
        sourceA.start(0, pausedAtA);
      }
      if (deck === "B" && bufferB) {
        if (sourceB) sourceB.stop();
        sourceB = audioCtxB.createBufferSource();
        sourceB.buffer = bufferB;
        sourceB.connect(audioCtxB.destination);
        startTimeB = audioCtxB.currentTime;
        sourceB.start(0, pausedAtB);
      }
    }
    function pauseDeck(deck) {
      if (deck === "A" && sourceA) {
        const now = audioCtxA.currentTime;
        pausedAtA += now - startTimeA;
        sourceA.stop();
        sourceA = null;
      }
      if (deck === "B" && sourceB) {
        const now = audioCtxB.currentTime;
        pausedAtB += now - startTimeB;
        sourceB.stop();
        sourceB = null;
      }
    }
    function stopDeck(deck) {
      if (deck === "A" && sourceA) {
        sourceA.stop();
        sourceA = null;
        pausedAtA = 0;
        document.getElementById("timeA").textContent = "0:00";
      }
      if (deck === "B" && sourceB) {
        sourceB.stop();
        sourceB = null;
        pausedAtB = 0;
        document.getElementById("timeB").textContent = "0:00";
      }
    }

    document.getElementById("playA").addEventListener("click", () => playDeck("A"));
    document.getElementById("pauseA").addEventListener("click", () => pauseDeck("A"));
    document.getElementById("stopA").addEventListener("click", () => stopDeck("A"));

    document.getElementById("playB").addEventListener("click", () => playDeck("B"));
    document.getElementById("pauseB").addEventListener("click", () => pauseDeck("B"));
    document.getElementById("stopB").addEventListener("click", () => stopDeck("B"));

    /* CROSSFADER (DEMO) */
    document.getElementById("crossfader").addEventListener("input", e => {
      const value = e.target.value; // 0 = A, 100 = B
      console.log("Crossfader:", value);
      // Wire into GainNodes for each deck in your real engine.
    });

    /* SYNC BUTTONS (DEMO) */
    document.getElementById("syncBtoA").addEventListener("click", () => {
      console.log("Sync B to A");
      // Implement BPM sync logic here.
    });
    document.getElementById("syncAtoB").addEventListener("click", () => {
      console.log("Sync A to B");
      // Implement BPM sync logic here.
    });

    /* DUMMY LIBRARY DATA – REPLACE WITH SUPABASE FETCH */
    const library = [
      {
        id: 1,
        title: "GLCTC1 Cosmic Track 1",
        artist: "Leyton",
        bpm: 120,
        key: "Am",
        urlA: "https://example.com/audio/full1.mp3",
        urlB: "https://example.com/audio/full1.mp3",
        stems: [
          { name: "Drums", url: "https://example.com/audio/drums1.mp3" },
          { name: "Bass", url: "https://example.com/audio/bass1.mp3" },
          { name: "Lead", url: "https://example.com/audio/lead1.mp3" }
        ]
      },
      {
        id: 2,
        title: "GLCTC1 Cosmic Track 2",
        artist: "Leyton",
        bpm: 128,
        key: "Fm",
        urlA: "https://example.com/audio/full2.mp3",
        urlB: "https://example.com/audio/full2.mp3",
        stems: [
          { name: "Drums", url: "https://example.com/audio/drums2.mp3" },
          { name: "Bass", url: "https://example.com/audio/bass2.mp3" },
          { name: "Vocals", url: "https://example.com/audio/vocals2.mp3" }
        ]
      }
    ];

    function renderLibrary() {
      const list = document.getElementById("libraryList");
      list.innerHTML = "";
      library.forEach(track => {
        const div = document.createElement("div");
        div.className = "library-item";
        div.innerHTML = `
          <strong>${track.title}</strong>
          <span>${track.artist}</span><br>
          <small>${track.bpm} BPM • ${track.key}</small>
          <div class="library-load-buttons">
            <button onclick="loadTrackToDeck('${track.id}', 'A')">Load A</button>
            <button onclick="loadTrackToDeck('${track.id}', 'B')">Load B</button>
          </div>
        `;
        div.addEventListener("click", () => showTrackDetails(track));
        list.appendChild(div);
      });
    }

    async function loadTrackToDeck(trackId, deck) {
      const track = library.find(t => t.id == trackId);
      if (!track) return;
      const url = deck === "A" ? track.urlA : track.urlB;
      await loadStemToDeck(url, deck); // reuse stem loader for full track
    }

    function showTrackDetails(track) {
      const details = document.getElementById("trackDetails");
      const title = document.getElementById("trackTitle");
      const meta = document.getElementById("trackMeta");
      const stemList = document.getElementById("stemList");

      details.style.display = "block";
      title.textContent = track.title;
      meta.textContent = `${track.artist} • ${track.bpm} BPM • ${track.key}`;

      stemList.innerHTML = "";
      if (!track.stems) return;

      track.stems.forEach(stem => {
        const div = document.createElement("div");
        div.className = "stem-item";
        div.innerHTML = `
          <span>${stem.name}</span>
          <div>
            <button onclick="loadStemToDeck('${stem.url}', 'A')">Add to Deck A</button>
            <button onclick="loadStemToDeck('${stem.url}', 'B')">Add to Deck B</button>
          </div>
        `;
        stemList.appendChild(div);
      });
    }

    renderLibrary();
  </script>
</body>
</html>
