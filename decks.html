<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 Cosmic Decks</title>

<style>
body {
margin:0;
padding:20px;
background:radial-gradient(circle at top,#0f172a 0%,#020617 40%,#000 100%);
color:#e5e7eb;
font-family:system-ui,sans-serif;
}
h1 {
text-align:center;
color:#a78bfa;
letter-spacing:0.18em;
text-transform:uppercase;
font-size:0.9rem;
margin-bottom:10px;
}
.subtitle {
text-align:center;
color:#64748b;
font-size:0.75rem;
margin-bottom:20px;
}
.glow-card {
max-width:1200px;
margin:0 auto;
padding:20px;
background:rgba(15,23,42,0.95);
border-radius:16px;
border:1px solid rgba(167,139,250,0.7);
box-shadow:0 0 40px rgba(88,28,135,0.6);
}
.decks-container {
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:24px;
}

/* DECKS */
.deck {
flex:1 1 0;
max-width:480px;
background:rgba(2,6,23,0.95);
border-radius:16px;
padding:18px;
border:1px solid rgba(30,64,175,0.6);
box-shadow:0 0 24px rgba(30,64,175,0.4);
}
.deck-title {
text-align:center;
text-transform:uppercase;
font-size:0.8rem;
letter-spacing:0.12em;
color:#a78bfa;
margin-bottom:12px;
}
.deck-top-row {
display:flex;
align-items:center;
justify-content:space-between;
gap:18px;
margin-bottom:12px;
}
.deck-wheel-wrap {
position:relative;
width:220px;
height:220px;
}
.deck-wheel {
width:220px;
height:220px;
border-radius:50%;
background:radial-gradient(circle at center,#3b0764 0%,#4c1d95 40%,#1e1b4b 70%,#000 100%);
border:6px solid #a78bfa;
box-shadow:0 0 30px rgba(167,139,250,0.9);
position:absolute;
top:0;
left:0;
animation:spinWheel 2.5s linear infinite;
animation-play-state:paused;
}
@keyframes spinWheel {
from { transform:rotate(0deg); }
to { transform:rotate(360deg); }
}
.deck-wheel-texture {
position:absolute;
inset:0;
border-radius:50%;
background-image:repeating-linear-gradient(45deg,rgba(255,255,255,0.08)0px,rgba(255,255,255,0.08)6px,transparent6px,transparent12px);
}
.deck-wheel-marker {
position:absolute;
top:10px;
left:50%;
width:12px;
height:70px;
background:#ff9800;
border-radius:999px;
transform:translateX(-50%);
z-index:10;
}

/* PITCH */
.pitch-wrap {
display:flex;
flex-direction:column;
align-items:center;
gap:6px;
margin-left:auto;
}
.pitch-label {
font-size:0.7rem;
text-transform:uppercase;
letter-spacing:0.08em;
color:#94a3b8;
}
.pitch-slider {
-webkit-appearance:slider-vertical;
writing-mode:bt-lr;
height:170px;
width:18px;
}

/* AUDIO */
.audio-bar {
margin-top:16px;
}
audio {
width:100%;
}

/* WAVEFORM */
.wave-strip {
height:32px;
background:rgba(15,23,42,0.9);
margin-top:8px;
border-radius:10px;
overflow:hidden;
position:relative;
border:1px solid rgba(148,163,184,0.4);
}
.wave-canvas {
width:100%;
height:100%;
display:block;
}

/* BPM */
.bpm-meter {
height:10px;
margin-top:6px;
border-radius:999px;
background:linear-gradient(90deg,#3b0764,#a78bfa,#ec4899);
box-shadow:0 0 12px rgba(167,139,250,0.8);
animation:bpmPulse 1s linear infinite;
transform-origin:left;
}
@keyframes bpmPulse {
0% { transform:scaleX(0.2); opacity:0.6; }
50% { transform:scaleX(1); opacity:1; }
100% { transform:scaleX(0.2); opacity:0.6; }
}

/* TRANSPORT */
.transport-row {
margin-top:12px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
}
button {
padding:6px 12px;
border-radius:999px;
border:none;
background:#1d4ed8;
color:#e5e7eb;
font-size:0.7rem;
text-transform:uppercase;
letter-spacing:0.08em;
cursor:pointer;
}
button.secondary {
background:#ec4899;
}
button:hover {
box-shadow:0 0 12px rgba(59,130,246,0.8);
}

/* GAIN + PAN */
.gain-row {
margin-top:12px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}
.slider-block {
text-align:center;
}
.slider-label {
font-size:0.65rem;
text-transform:uppercase;
letter-spacing:0.08em;
color:#94a3b8;
}
.slider-block input[type="range"] {
width:100%;
}

/* PAN VISUAL */
.pan-slider {
width:100%;
height:10px;
border-radius:999px;
background:#1e1b4b;
-webkit-appearance:none;
appearance:none;
}
.pan-slider::-webkit-slider-thumb {
width:22px;
height:22px;
border-radius:50%;
background:#ec4899;
box-shadow:0 0 14px rgba(236,72,153,0.9),0 0 6px rgba(255,255,255,0.4);
cursor:pointer;
}

/* FX */
.slider-row {
margin-top:10px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

/* CROSSFADER */
.crossfader-wrap {
margin-top:22px;
text-align:center;
}
.crossfader-label {
font-size:0.7rem;
text-transform:uppercase;
letter-spacing:0.08em;
color:#94a3b8;
margin-bottom:4px;
}
.crossfader {
width:60%;
height:10px;
border-radius:999px;
background:linear-gradient(90deg,#3b0764,#a78bfa,#ec4899,#a78bfa,#3b0764);
box-shadow:0 0 18px rgba(167,139,250,0.8);
-webkit-appearance:none;
appearance:none;
}
.crossfader::-webkit-slider-thumb {
width:22px;
height:22px;
border-radius:50%;
background:#ec4899;
box-shadow:0 0 14px rgba(236,72,153,0.9),0 0 6px rgba(255,255,255,0.4);
cursor:pointer;
}

/* BANKS / DETAILS / STEMS / LIBRARY */
.section-title {
margin-top:18px;
font-size:0.75rem;
text-transform:uppercase;
letter-spacing:0.12em;
color:#a78bfa;
}
.banks-grid {
margin-top:6px;
display:grid;
grid-template-columns:repeat(13,1fr);
gap:4px;
}
.bank-btn {
padding:6px 0;
border-radius:999px;
border:none;
background:#1e1b4b;
color:#e5e7eb;
font-size:0.7rem;
cursor:pointer;
box-shadow:0 0 10px rgba(167,139,250,0.7);
}
.bank-btn:hover {
background:#a78bfa;
color:#000;
}
.bank-track-item {
display:flex;
justify-content:space-between;
align-items:center;
padding:4px 0;
border-bottom:1px solid rgba(30,64,175,0.4);
font-size:0.75rem;
}

.details-panel {
margin-top:10px;
padding:10px;
border-radius:10px;
background:rgba(15,23,42,0.9);
border:1px solid rgba(148,163,184,0.5);
font-size:0.75rem;
}
#stemList {
margin-top:6px;
}

/* MASTER LIBRARY */
.library-wrap {
margin-top:10px;
max-height:260px;
overflow-y:auto;
border-radius:10px;
border:1px solid rgba(30,64,175,0.4);
}
.library-scroll-x {
overflow-x:auto;
}
.library-table {
width:100%;
border-collapse:collapse;
margin-top:8px;
font-size:0.75rem;
min-width:1200px;
}
.library-table th,
.library-table td {
padding:6px 8px;
border-bottom:1px solid rgba(30,64,175,0.4);
white-space:nowrap;
}
.library-table th {
text-align:left;
color:#cbd5f5;
text-transform:uppercase;
letter-spacing:0.08em;
font-size:0.7rem;
cursor:pointer;
}
.library-row:hover {
background:rgba(30,64,175,0.25);
}

/* FOOTER */
.footer-nav {
margin-top:18px;
text-align:center;
font-size:0.7rem;
color:#64748b;
}
.footer-nav span {
margin:0 8px;
cursor:pointer;
color:#a78bfa;
text-decoration:underline;
}
.footer-nav span:hover {
color:#ec4899;
}
</style>
</head>

<!-- MASTER LIBRARY SYSTEM  -->
<script>
document.addEventListener("DOMContentLoaded", () => {

const library = JSON.parse(localStorage.getItem("glctc1_library") || "[]");
const tbody = document.getElementById("libraryBody");
tbody.innerHTML = "";

if (!library.length) {
const emptyRow = document.createElement("tr");
emptyRow.innerHTML =
<td colspan="18" style="text-align:center; color:#888;"&gt;No tracks uploaded yet&lt;/td>;
tbody.appendChild(emptyRow);
return;
}

library.forEach((track, index) => {
const row = document.createElement("tr");

row.innerHTML = &lt;td&gt;${track.title || ""}</td>
<td>${track.master_audio || ""}&lt;/td&gt; &lt;td&gt;${track.stem1 || ""}</td>
<td>${track.stem2 || ""}&lt;/td&gt; &lt;td&gt;${track.stem3 || ""}</td>
<td>${track.stem4 || ""}&lt;/td&gt; &lt;td&gt;${track.artist || ""}</td>
<td>${track.album || ""}&lt;/td&gt; &lt;td&gt;${track.bpm || ""}</td>
<td>${track.genre || ""}&lt;/td&gt; &lt;td&gt;${track.key || ""}</td>
<td>${track.frequency_hz || ""}&lt;/td&gt; &lt;td&gt;${track.chakra || ""}</td>
<td>${track.planet || ""}&lt;/td&gt; &lt;td&gt;${track.spatial || ""}</td>
<td>${track.notes || ""}&lt;/td&gt; &lt;td&gt;${track.cover_art ? "●" : ""}</td>
<td>${track.id || ""}&lt;/td&gt;;

// SELECT ROW
row.addEventListener("click", () => {
selectedLibraryTrack = track;
libraryIndex = index;

document.getElementById("librarySelectedText").textContent =
${track.artist || "Unknown"} — ${track.title || "Untitled"};

document.querySelectorAll("#libraryTable tbody tr")
.forEach(r => r.style.background = "");
row.style.background = "rgba(56,189,248,0.15)";
});

tbody.appendChild(row);
});

});
</script>
