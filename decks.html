<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Cosmic 1200 Decks + Master Library + Banks</title>

<!-- Cosmic Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
/* GLOBAL */
body {
  background: radial-gradient(circle at top, #020024 0%, #090979 35%, #000 100%);
  color: #0ff;
  font-family: 'Orbitron', sans-serif;
  margin: 0;
  padding: 0;
  text-align: center;
}

h1, h2, h3 {
  text-shadow: 0 0 12px #0ff;
  letter-spacing: 2px;
}

/* DECKS CONTAINER */
.decks-container {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 40px;
}

/* INDIVIDUAL DECK */
.deck {
  background: rgba(0, 0, 30, 0.85);
  border: 3px solid #0ff;
  border-radius: 16px;
  padding: 20px;
  width: 360px;
  box-shadow: 0 0 25px #0ff;
}

.deck h2 {
  margin-bottom: 10px;
}

.deck audio {
  width: 100%;
  margin-top: 10px;
}

/* DECK CONTROLS */
.controls {
  margin-top: 15px;
}

.controls button {
  margin: 6px;
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  color: #000;
  font-size: 14px;
}

.play { background: #0ff; }
.stop { background: #f0f; }
.sync { background: #ff0; }

/* CROSSFADER */
.fader-section {
  margin: 40px auto;
  width: 80%;
}

input[type="range"] {
  width: 100%;
  accent-color: #0ff;
}

/* VISUALIZER */
#visualizer {
  width: 90%;
  height: 120px;
  margin: 30px auto;
  background: rgba(0, 0, 30, 0.8);
  border: 2px solid #0ff;
  border-radius: 12px;
  box-shadow: 0 0 20px #0ff inset;
}

/* MASTER LIBRARY */
#masterList {
  margin: 40px auto;
  width: 90%;
  text-align: left;
}

.track-item {
  background: rgba(0, 0, 30, 0.85);
  border: 2px solid #0ff;
  padding: 12px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-radius: 8px;
}

.track-item button {
  margin-left: 10px;
  padding: 8px 14px;
  background: #0ff;
  border: none;
  color: #000;
  cursor: pointer;
  border-radius: 6px;
  font-weight: bold;
}

.track-item button:hover {
  background: #fff;
}

/* BANKS SECTION */
#banks {
  margin-top: 60px;
  padding: 20px;
  border-top: 2px solid #0ff;
}

.banks-grid {
  display: grid;
  grid-template-columns: repeat(13, 1fr);
  gap: 12px;
  margin: 20px auto;
  max-width: 900px;
}

.bank-btn {
  background: radial-gradient(circle, #0ff 0%, #111 80%);
  border: 2px solid #0ff;
  color: #000;
  font-weight: bold;
  border-radius: 50%;
  padding: 12px;
  cursor: pointer;
  transition: 0.3s;
  font-size: 18px;
}

.bank-btn:hover {
  background: #fff;
  color: #000;
  box-shadow: 0 0 12px #0ff;
}

#bankTracks {
  margin-top: 30px;
  text-align: left;
  width: 90%;
  margin-left: auto;
  margin-right: auto;
}

.bank-track-item {
  background: rgba(0, 0, 30, 0.85);
  border: 2px solid #0ff;
  padding: 12px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-radius: 8px;
}

.bank-track-item button {
  margin-left: 10px;
  padding: 8px 14px;
  background: #0ff;
  border: none;
  color: #000;
  cursor: pointer;
  border-radius: 6px;
  font-weight: bold;
}

.bank-track-item button:hover {
  background: #fff;
}
</style>
</head>

<body>

<h1>GLCTC1 – Cosmic 1200 Decks</h1>

<!-- DECKS -->
<div class="decks-container">

  <div class="deck" id="deckA">
    <h2>Deck A</h2>
    <audio id="deckAAudio" controls></audio>
    <div class="controls">
      <button class="play" onclick="playDeck('A')">PLAY</button>
      <button class="stop" onclick="stopDeck('A')">STOP</button>
      <button class="sync" onclick="syncDeck('A','B')">SYNC → B</button>
    </div>
  </div>

  <div class="deck" id="deckB">
    <h2>Deck B</h2>
    <audio id="deckBAudio" controls></audio>
    <div class="controls">
      <button class="play" onclick="playDeck('B')">PLAY</button>
      <button class="stop" onclick="stopDeck('B')">STOP</button>
      <button class="sync" onclick="syncDeck('B','A')">SYNC → A</button>
    </div>
  </div>

</div>

<!-- CROSSFADER -->
<div class="fader-section">
  <label>Deck A</label>
  <input type="range" id="crossfader" min="0" max="100" value="50">
  <label>Deck B</label>
</div>

<!-- VISUALIZER -->
<div id="visualizer"></div>

<!-- MASTER LIBRARY -->
<h2>GLCTC1 Master Library</h2>
<div id="masterList"></div>

<!-- BANKS -->
<section id="banks">
  <h2>GLCTC1 Banks A–Z</h2>
  <p>Select a bank to view its playlist and load tracks to Deck A or Deck B.</p>

  <div class="banks-grid">
    <script>
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      document.write(
        letters.map(l => `<button class="bank-btn">${l}</button>`).join("")
      );
    </script>
  </div>

  <div id="bankTracks"></div>
</section>

<!-- SUPABASE + DECK LOGIC -->
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zdlaloiruxamxsduxqxw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbGFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQ"
);

/* LOAD MASTER LIBRARY */
async function loadMaster() {
  const { data, error } = await supabase.from("tracks").select("*");
  if (error) {
    console.error(error);
    return;
  }

  document.getElementById("masterList").innerHTML =
    data.map(track => `
      <div class="track-item">
        <span>${track.title} – ${track.artist}</span>
        <button onclick="loadDeck('A', '${track.file_path}')">Load A</button>
        <button onclick="loadDeck('B', '${track.file_path}')">Load B</button>
      </div>
    `).join("");
}

loadMaster();

/* BANK PLAYLISTS */
document.querySelectorAll(".bank-btn").forEach(btn => {
  btn.addEventListener("click", async () => {
    const bank = btn.textContent;
    const { data, error } = await supabase
      .from("tracks")
      .select("*")
      .eq("bank", bank);

    if (error) {
      console.error(error);
      alert("Error loading bank " + bank);
      return;
    }

    renderBankTracks(bank, data);
  });
});

function renderBankTracks(bank, tracks) {
  const container = document.getElementById("bankTracks");
  container.innerHTML = `<h3>Bank ${bank} Playlist</h3>`;

  if (tracks.length === 0) {
    container.innerHTML += `<p>No tracks in this bank yet.</p>`;
    return;
  }

  tracks.forEach(track => {
    container.innerHTML += `
      <div class="bank-track-item">
        <span>${track.title} – ${track.artist}</span>
        <button onclick="loadDeck('A', '${track.file_path}')">Load A</button>
        <button onclick="loadDeck('B', '${track.file_path}')">Load B</button>
      </div>
    `;
  });
}

/* DECK FUNCTIONS */
window.loadDeck = function(deck, filePath) {
  const audio = document.getElementById(`deck${deck}Audio`);
  audio.src = filePath;
  audio.play();
};

window.playDeck = function(deck) {
  document.getElementById(`deck${deck}Audio`).play();
};

window.stopDeck = function(deck) {
  document.getElementById(`deck${deck}Audio`).pause();
};

window.syncDeck = function(from, to) {
  const fromAudio = document.getElementById(`deck${from}Audio`);
  const toAudio = document.getElementById(`deck${to}Audio`);
  toAudio.currentTime = fromAudio.currentTime;
};
</script>

</body>
</html>
