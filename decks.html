<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLCTC1 – Cosmic 1200 Decks</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 16px #0ea5e9;
      text-align: center;
    }

    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #a5b4fc;
      margin-bottom: 8px;
    }

    .glow-card {
      width: 100%;
      max-width: 1200px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 14px;
      padding: 20px;
      box-shadow:
        0 0 25px rgba(56, 189, 248, 0.35),
        0 0 60px rgba(129, 140, 248, 0.35);
      border: 1px solid rgba(56, 189, 248, 0.5);
      margin-top: 10px;
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .deck {
      background: rgba(2, 6, 23, 0.8);
      border-radius: 12px;
      padding: 16px;
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.25);
      position: relative;
    }

    .deck h3 {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #38bdf8;
      margin-bottom: 12px;
      text-align: center;
    }

    /* Deck wheel */
    .deck-wheel {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      margin: 0 auto 12px auto;
      background:
        radial-gradient(circle at center, #0f172a 0%, #020617 40%, #000 100%);
      border: 4px solid #38bdf8;
      box-shadow:
        0 0 20px rgba(56, 189, 248, 0.7),
        0 0 40px rgba(129, 140, 248, 0.5);
      position: relative;
      overflow: hidden;
    }

    .deck-wheel-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8, #0ea5e9);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
    }

    .deck-wheel-ring {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 2px dashed rgba(129, 140, 248, 0.8);
      animation: spin 12s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Chakra spotlights */
    .chakra-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      pointer-events: none;
    }

    .chakra-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
    }

    .chakra-root   { color: #ef4444; bottom: 0; left: 50%; transform: translateX(-50%); }
    .chakra-sacral { color: #f97316; bottom: 20%; left: 80%; }
    .chakra-solar  { color: #eab308; bottom: 50%; right: 0; transform: translateY(50%); }
    .chakra-heart  { color: #22c55e; top: 50%; right: 0; transform: translateY(-50%); }
    .chakra-throat { color: #0ea5e9; top: 20%; right: 20%; }
    .chakra-third  { color: #6366f1; top: 0; left: 50%; transform: translateX(-50%); }
    .chakra-crown  { color: #a855f7; top: 20%; left: 20%; }

    /* Wave visual */
    .wave-strip {
      width: 100%;
      height: 60px;
      margin-top: 10px;
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(56,189,248,0.1), rgba(129,140,248,0.3));
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.25);
      overflow: hidden;
      position: relative;
    }

    .wave-bar {
      position: absolute;
      width: 200%;
      height: 100%;
      background-image: linear-gradient(
        135deg,
        rgba(56,189,248,0.6) 0%,
        rgba(129,140,248,0.6) 25%,
        rgba(236,72,153,0.6) 50%,
        rgba(34,197,94,0.6) 75%,
        rgba(56,189,248,0.6) 100%
      );
      opacity: 0.6;
      animation: waveMove 8s linear infinite;
    }

    @keyframes waveMove {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .control-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      justify-content: center;
    }

    button {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      background: linear-gradient(90deg, #22c55e, #06b6d4);
      color: #020617;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }

    button.secondary {
      background: linear-gradient(90deg, #6366f1, #ec4899);
      color: #f9fafb;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    .pitch-slider {
      width: 100%;
      margin-top: 10px;
    }

    /* Improved crossfader */
    .crossfader-wrap {
      margin-top: 20px;
    }

    .crossfader-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .crossfader {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #6366f1, #22c55e);
      outline: none;
    }

    .crossfader::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f9fafb;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      cursor: pointer;
    }

    .crossfader::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f9fafb;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
      cursor: pointer;
    }

    /* Cosmic visualizer */
    .visualizer {
      width: 100%;
      height: 200px;
      background: radial-gradient(circle at center, #020617 0%, #000 60%);
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: inset 0 0 20px rgba(129, 140, 248, 0.25);
      position: relative;
      overflow: hidden;
    }

    .visual-orb {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8, transparent);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
      animation: orbPulse 4s ease-in-out infinite;
    }

    @keyframes orbPulse {
      0%   { transform: translate(20%, 40%) scale(1); opacity: 0.7; }
      50%  { transform: translate(60%, 20%) scale(1.4); opacity: 1; }
      100% { transform: translate(30%, 70%) scale(1); opacity: 0.7; }
    }

    /* Library */
    .library-list {
      margin-top: 20px;
      background: rgba(2, 6, 23, 0.8);
      padding: 16px;
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .library-item {
      padding: 10px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .library-item:last-child {
      border-bottom: none;
    }

    nav {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    nav a {
      color: #38bdf8;
      text-decoration: none;
      margin: 0 6px;
    }

    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <h1>GLCTC1 – Cosmic 1200 Decks</h1>

  <!-- DECKS -->
  <div class="glow-card">
    <h2>DJ Decks</h2>

    <div class="deck-grid">

      <!-- DECK A -->
      <div class="deck">
        <h3>Deck A</h3>

        <div class="deck-wheel" id="wheelA">
          <div class="deck-wheel-inner"></div>
          <div class="deck-wheel-ring"></div>
          <div class="chakra-ring">
            <div class="chakra-dot chakra-root"></div>
            <div class="chakra-dot chakra-sacral"></div>
            <div class="chakra-dot chakra-solar"></div>
            <div class="chakra-dot chakra-heart"></div>
            <div class="chakra-dot chakra-throat"></div>
            <div class="chakra-dot chakra-third"></div>
            <div class="chakra-dot chakra-crown"></div>
          </div>
        </div>

        <audio id="deckA" controls style="width:100%;"></audio>

        <div class="wave-strip">
          <div class="wave-bar" id="waveA"></div>
        </div>

        <input id="pitchA" class="pitch-slider" type="range" min="-50" max="50" value="0">

        <div class="control-row">
          <button id="playA">Play</button>
          <button id="stopA">Stop</button>
          <button class="secondary" id="syncToB">Sync → B</button>
        </div>
      </div>

      <!-- DECK B -->
      <div class="deck">
        <h3>Deck B</h3>

        <div class="deck-wheel" id="wheelB">
          <div class="deck-wheel-inner"></div>
          <div class="deck-wheel-ring"></div>
          <div class="chakra-ring">
            <div class="chakra-dot chakra-root"></div>
            <div class="chakra-dot chakra-sacral"></div>
            <div class="chakra-dot chakra-solar"></div>
            <div class="chakra-dot chakra-heart"></div>
            <div class="chakra-dot chakra-throat"></div>
            <div class="chakra-dot chakra-third"></div>
            <div class="chakra-dot chakra-crown"></div>
          </div>
        </div>

        <audio id="deckB" controls style="width:100%;"></audio>

        <div class="wave-strip">
          <div class="wave-bar" id="waveB"></div>
        </div>

        <input id="pitchB" class="pitch-slider" type="range" min="-50" max="50" value="0">

        <div class="control-row">
          <button id="playB">Play</button>
          <button id="stopB">Stop</button>
          <button class="secondary" id="syncToA">Sync → A</button>
        </div>
      </div>

    </div>

    <!-- CROSSFADER -->
    <div class="crossfader-wrap">
      <div class="crossfader-labels">
        <span>Deck A</span>
        <span>Deck B</span>
      </div>
      <input id="crossfader" class="crossfader" type="range" min="0" max="100" value="50">
    </div>

    <!-- VISUALIZER -->
    <h2>Cosmic Visualizer</h2>
    <div class="visualizer" id="visualizer">
      <div class="visual-orb"></div>
    </div>
  </div>

  <!-- MASTER LIBRARY -->
  <div class="glow-card">
    <h2>GLCTC1 Master Library</h2>

    <div id="libraryList" class="library-list">
      <!-- Example placeholder items (will be replaced by Supabase data) -->
      <div class="library-item">
        <span>GLCTC1-001 – Example Track</span>
        <div>
          <button class="secondary">Load to Deck A</button>
          <button class="secondary">Load to Deck B</button>
        </div>
      </div>
      <div class="library-item">
        <span>GLCTC1-002 – Example Track</span>
        <div>
          <button class="secondary">Load to Deck A</button>
          <button class="secondary">Load to Deck B</button>
        </div>
      </div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav>
    <span>Navigation:</span>
    <a href="index.html">Login</a> |
    <a href="upload.html">Upload</a> |
    <a href="decks.html">Decks</a>
  </nav>

  <!-- JS placeholder -->
  <script>
    const deckA = document.getElementById('deckA');
    const deckB = document.getElementById('deckB');
    const wheelA = document.getElementById('wheelA');
    const wheelB = document.getElementById('wheelB');

    document.getElementById('playA').onclick = () => {
      deckA.play();
      wheelA.style.animationPlayState = 'running';
    };
    document.getElementById('stopA').onclick = () => {
      deckA.pause();
      wheelA.style.animationPlayState = 'paused';
    };

    document.getElementById('playB').onclick = () => {
      deckB.play();
      wheelB.style.animationPlayState = 'running';
    };
    document.getElementById('stopB').onclick = () => {
      deckB.pause();
      wheelB.style.animationPlayState = 'paused';
    };

    document.getElementById('syncToB').onclick = () => {
      deckB.currentTime = deckA.currentTime;
    };
    document.getElementById('syncToA').onclick = () => {
      deckA.currentTime = deckB.currentTime;
    };

    const crossfader = document.getElementById('crossfader');
    crossfader.oninput = () => {
      const value = crossfader.value / 100;
      deckA.volume = 1 - value;
      deckB.volume = value;
    };

    // Next step: Supabase track loading + real waveform/visualizer logic.
  </script>

</body>
</html>
