<script>
/* =====================================================
   🌌 GLCTC1 OPEN SPACE ENGINE
   ===================================================== */

const supabaseUrl =
  "https://zdlaloiruxamxsduxqxw.supabase.co";

const supabaseKey =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQ";

const supabaseClient =
  window.supabase.createClient(
    supabaseUrl,
    supabaseKey
  );


/* =====================================================
   ELEMENTS
   ===================================================== */

const messageWindow =
  document.getElementById("messageWindow");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const attachmentInput =
  document.getElementById("attachmentInput");

const attachmentName =
  document.getElementById("attachmentName");

const statusText =
  document.getElementById("statusText");

const welcomeMessage =
  document.getElementById("welcomeMessage");


/* =====================================================
   STATE
   ===================================================== */

let currentUser = null;

let selectedFile = null;

const displayedPostIds = new Set();

let realtimeChannel = null;

let pollingTimer = null;


/* =====================================================
   CONSTANTS
   ===================================================== */

const OPEN_SPACE_TABLE = "crowd_chat";

const OPEN_SPACE_WINDOW_HOURS = 6;

const MAX_FILE_SIZE =
  100 * 1024 * 1024;


/* =====================================================
   INITIALISE
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  initialiseOpenSpace
);


async function initialiseOpenSpace() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if (error) {
      throw error;
    }

    currentUser =
      data?.session?.user || null;

    updateComposerAccess();

    await updateStatus();

    await loadMessages();

    subscribeToRealtime();


    if (!pollingTimer) {

      pollingTimer =
        setInterval(
          loadMessages,
          15000
        );

    }

  } catch (error) {

    console.error(
      "GLCTC1 OPEN SPACE INIT ERROR:",
      error
    );

    statusText.textContent =
      "OPEN SPACE CONNECTION ERROR";

  }


  supabaseClient.auth.onAuthStateChange(
    async (_event, session) => {

      currentUser =
        session?.user || null;

      updateComposerAccess();

      await updateStatus();

      clearRenderedPosts();

      await loadMessages();

    }
  );

}


/* =====================================================
   AUTH / COMPOSER ACCESS
   ===================================================== */

function updateComposerAccess() {

  const signedIn =
    !!currentUser;


  messageInput.disabled =
    !signedIn;

  sendButton.disabled =
    !signedIn;

  attachmentInput.disabled =
    !signedIn;


  if (signedIn) {

    messageInput.placeholder =
      "Write something for Open Space...";

    sendButton.textContent =
      "SEND";

  } else {

    messageInput.placeholder =
      "Sign in to post in Open Space...";

    attachmentName.textContent =
      "";

  }

}


/* =====================================================
   STATUS
   ===================================================== */

async function updateStatus() {

  if (!currentUser) {

    statusText.textContent =
      "OPEN SPACE ONLINE · SIGN IN TO POST";

    return;

  }


  const artistName =
    await getArtistName(currentUser);


  statusText.textContent =
    "OPEN SPACE ONLINE · " +
    artistName;

}


/* =====================================================
   GET ARTIST NAME
   ===================================================== */

async function getArtistName(user) {

  if (!user) {
    return "OPEN SPACE USER";
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("artist_name")
        .eq("id", user.id)
        .maybeSingle();


    if (
      !error &&
      data?.artist_name
    ) {

      return data.artist_name;

    }

  } catch (error) {

    console.warn(
      "GLCTC1 ARTIST NAME LOOKUP:",
      error
    );

  }


  return "GLCTC1 USER";

}


/* =====================================================
   LOAD LAST 6 HOURS
   ===================================================== */

async function loadMessages() {

  const cutoff =
    new Date(
      Date.now() -
      OPEN_SPACE_WINDOW_HOURS *
      60 *
      60 *
      1000
    ).toISOString();


  const {
    data,
    error
  } =
    await supabaseClient
      .from(OPEN_SPACE_TABLE)
      .select(
        "id,user_id,display_name,message,created_at"
      )
      .gte(
        "created_at",
        cutoff
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      )
      .limit(300);


  if (error) {

    console.error(
      "GLCTC1 OPEN SPACE LOAD ERROR:",
      error
    );

    statusText.textContent =
      "OPEN SPACE CONNECTION ERROR";

    return;

  }


  const posts =
    Array.isArray(data)
      ? data
      : [];


  syncWelcome(
    posts.length === 0
  );


  const validIds =
    new Set(
      posts.map(
        post =>
          String(post.id)
      )
    );


  /*
     Remove messages which are
     no longer inside the six-hour window.
  */

  document
    .querySelectorAll(
      ".message[data-post-id]"
    )
    .forEach(element => {

      const id =
        String(
          element.dataset.postId
        );


      if (!validIds.has(id)) {

        displayedPostIds.delete(id);

        element.remove();

      }

    });


  /*
     Render messages which are
     not already displayed.
  */

  posts.forEach(post => {

    const id =
      String(post.id);


    if (
      !displayedPostIds.has(id)
    ) {

      renderMessage(post);

      displayedPostIds.add(id);

    }

  });


  syncWelcome(
    document.querySelectorAll(
      ".message[data-post-id]"
    ).length === 0
  );


  if (posts.length > 0) {

    scrollToBottom();

  }

}


/* =====================================================
   WELCOME STATE
   ===================================================== */

function syncWelcome(show) {

  if (!welcomeMessage) {
    return;
  }


  welcomeMessage.style.display =
    show
      ? "block"
      : "none";

}


/* =====================================================
   CLEAR RENDERED POSTS
   ===================================================== */

function clearRenderedPosts() {

  document
    .querySelectorAll(
      ".message[data-post-id]"
    )
    .forEach(
      element =>
        element.remove()
    );


  displayedPostIds.clear();

}


/* =====================================================
   ATTACHMENT SELECTION
   ===================================================== */

attachmentInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files?.[0] ||
      null;


    if (!file) {

      selectedFile = null;

      attachmentName.textContent =
        "";

      return;

    }


    if (
      file.size >
      MAX_FILE_SIZE
    ) {

      alert(
        "Maximum file size is 100 MB."
      );

      attachmentInput.value =
        "";

      selectedFile = null;

      attachmentName.textContent =
        "";

      return;

    }


    selectedFile =
      file;

    attachmentName.textContent =
      file.name;

  }
);


/* =====================================================
   SEND
   ===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


async function sendMessage() {

  /*
     Hard authentication guard.
  */

  const {
    data,
    error: authError
  } =
    await supabaseClient.auth.getUser();


  if (
    authError ||
    !data?.user
  ) {

    currentUser = null;

    updateComposerAccess();

    alert(
      "Please sign in before posting in Open Space."
    );

    return;

  }


  currentUser =
    data.user;


  const message =
    messageInput.value.trim();


  /*
     crowd_chat is the verified
     working GLCTC1 message table.

     We deliberately do not invent
     attachment database columns.
  */

  if (!message) {

    if (selectedFile) {

      alert(
        "File attachments are not connected to the verified Open Space database yet. Please send a text post for now."
      );

    }

    return;

  }


  sendButton.disabled =
    true;

  sendButton.textContent =
    "...";


  try {

    const artistName =
      await getArtistName(
        currentUser
      );


    const post = {

      id:
        crypto.randomUUID(),

      user_id:
        currentUser.id,

      display_name:
        artistName,

      message:
        message,

      created_at:
        new Date().toISOString()

    };


    const {
      data: insertedPost,
      error
    } =
      await supabaseClient
        .from(OPEN_SPACE_TABLE)
        .insert(post)
        .select(
          "id,user_id,display_name,message,created_at"
        )
        .single();


    if (error) {
      throw error;
    }


    clearComposer();


    /*
       Realtime may deliver the same post.
       displayedPostIds prevents duplication.
    */

    const savedPost =
      insertedPost || post;

    const id =
      String(savedPost.id);


    if (
      !displayedPostIds.has(id)
    ) {

      renderMessage(
        savedPost
      );

      displayedPostIds.add(id);

    }


    syncWelcome(false);

    scrollToBottom();


  } catch (error) {

    console.error(
      "GLCTC1 OPEN SPACE SEND ERROR:",
      error
    );


    alert(
      "The post could not be sent. Please try again."
    );


  } finally {

    sendButton.textContent =
      "SEND";

    updateComposerAccess();

  }

}


/* =====================================================
   CLEAR COMPOSER
   ===================================================== */

function clearComposer() {

  messageInput.value =
    "";

  selectedFile =
    null;

  attachmentInput.value =
    "";

  attachmentName.textContent =
    "";

}


/* =====================================================
   RENDER MESSAGE
   ===================================================== */

function renderMessage(post) {

  if (!post?.id) {
    return;
  }


  const id =
    String(post.id);


  if (
    document.querySelector(
      `.message[data-post-id="${CSS.escape(id)}"]`
    )
  ) {

    return;

  }


  const wrapper =
    document.createElement(
      "article"
    );


  wrapper.className =
    "message";


  wrapper.dataset.postId =
    id;


  if (
    currentUser &&
    post.user_id === currentUser.id
  ) {

    wrapper.classList.add(
      "mine"
    );

  }


  const author =
    document.createElement(
      "div"
    );


  author.className =
    "message-author";


  author.textContent =
    "✦ " +
    (
      post.display_name ||
      "OPEN SPACE USER"
    );


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "message-bubble";


  bubble.textContent =
    post.message || "";


  const time =
    document.createElement(
      "div"
    );


  time.className =
    "message-time";


  time.textContent =
    formatTime(
      post.created_at
    );


  wrapper.appendChild(
    author
  );

  wrapper.appendChild(
    bubble
  );

  wrapper.appendChild(
    time
  );


  messageWindow.appendChild(
    wrapper
  );

}


/* =====================================================
   REALTIME
   ===================================================== */

function subscribeToRealtime() {

  if (realtimeChannel) {
    return;
  }


  realtimeChannel =
    supabaseClient
      .channel(
        "glctc1-open-space-posts"
      )
      .on(
        "postgres_changes",
        {
          event:
            "INSERT",

          schema:
            "public",

          table:
            OPEN_SPACE_TABLE
        },

        payload => {

          const post =
            payload?.new;


          if (!post?.id) {
            return;
          }


          /*
             Ignore posts older than six hours.
          */

          const createdAt =
            new Date(
              post.created_at
            ).getTime();


          const cutoff =
            Date.now() -
            OPEN_SPACE_WINDOW_HOURS *
            60 *
            60 *
            1000;


          if (
            !Number.isFinite(
              createdAt
            ) ||
            createdAt < cutoff
          ) {

            return;

          }


          const id =
            String(post.id);


          if (
            displayedPostIds.has(id)
          ) {

            return;

          }


          renderMessage(
            post
          );


          displayedPostIds.add(
            id
          );


          syncWelcome(
            false
          );


          scrollToBottom();

        }
      )
      .subscribe(
        status => {

          console.log(
            "GLCTC1 OPEN SPACE REALTIME:",
            status
          );

        }
      );

}


/* =====================================================
   TIME
   ===================================================== */

function formatTime(timestamp) {

  if (!timestamp) {
    return "";
  }


  const date =
    new Date(timestamp);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleString(
    [],
    {
      dateStyle:
        "short",

      timeStyle:
        "short"
    }
  );

}


/* =====================================================
   SCROLL
   ===================================================== */

function scrollToBottom() {

  requestAnimationFrame(
    () => {

      messageWindow.scrollTop =
        messageWindow.scrollHeight;

    }
  );

}

</script>
