<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Cosmic 1200 Decks</title>

<style>
@keyframes spinWheel {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes waveMove {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: radial-gradient(circle at top, #0f172a 0%, #020617 40%, #000 100%);
  color: #e5e7eb;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

h1 {
  text-align: center;
  color: #a78bfa;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-size: 0.9rem;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #64748b;
  font-size: 0.75rem;
  margin-bottom: 20px;
}

.glow-card {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  background: rgba(15,23,42,0.95);
  border-radius: 16px;
  border: 1px solid rgba(167,139,250,0.7);
  box-shadow: 0 0 40px rgba(88,28,135,0.6);
}

/* Twin decks layout */
.decks-container {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: 20px;
}

.deck {
  flex: 1 1 0;
  max-width: 480px;
  background: rgba(2,6,23,0.95);
  border-radius: 16px;
  padding: 16px;
  border: 1px solid rgba(30,64,175,0.6);
  box-shadow: 0 0 24px rgba(30,64,175,0.4);
}

.deck-title {
  text-align: center;
  text-transform: uppercase;
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  color: #a78bfa;
  margin-bottom: 10px;
}

/* Platter + pitch */
.deck-top-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin-bottom: 10px;
}

.deck-wheel {
  width: 220px;
  aspect-ratio: 1/1;
  border-radius: 50%;
  background: radial-gradient(circle at center,
    #3b0764 0%,
    #4c1d95 40%,
    #1e1b4b 70%,
    #000 100%
  );
  border: 6px solid #a78bfa;
  box-shadow: 0 0 30px rgba(167,139,250,0.9);
  position: relative;
  animation: spinWheel 2.5s linear infinite;
  animation-play-state: paused;
}

.deck-wheel-marker {
  position: absolute;
  top: 10px;
  left: 50%;
  width: 12px;
  height: 70px;
  background: #ff9800;
  border-radius: 999px;
  transform: translateX(-50%);
}

.deck-wheel-texture {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background-image: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.08) 0px,
    rgba(255,255,255,0.08) 6px,
    transparent 6px,
    transparent 12px
  );
}

/* pitch slider */
.pitch-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.pitch-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #94a3b8;
}

.pitch-slider {
  -webkit-appearance: slider-vertical;
  writing-mode: bt-lr;
  height: 170px;
  width: 18px;
}

/* audio + waveform */
.audio-bar { margin-top: 8px; }
audio { width: 100%; }

.wave-strip {
  height: 32px;
  background: rgba(15,23,42,0.9);
  margin-top: 8px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(148,163,184,0.4);
}

.wave-bar {
  width: 200%;
  height: 100%;
  background: linear-gradient(135deg,#a78bfa,#6366f1,#ec4899,#22c55e);
  opacity: 0.55;
  animation: waveMove 10s linear infinite;
}

/* transport */
.transport-row {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
}

button {
  padding: 6px 12px;
  border-radius: 999px;
  border: none;
  background: #1d4ed8;
  color: #e5e7eb;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  cursor: pointer;
}

button.secondary { background: #ec4899; }

button:hover {
  box-shadow: 0 0 12px rgba(59,130,246,0.8);
}

/* sliders row */
.slider-row {
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 8px;
}

.slider-row-2 {
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 8px;
}

.slider-block { text-align: center; }

.slider-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #94a3b8;
}

.slider-block input[type="range"] { width: 100%; }

/* NEON COSMIC CROSSFADER */
.crossfader-wrap {
  margin-top: 18px;
  text-align: center;
}

.crossfader-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #94a3b8;
  margin-bottom: 4px;
}

.crossfader {
  width: 60%;
  height: 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, #3b0764, #a78bfa, #ec4899, #a78bfa, #3b0764);
  box-shadow: 0 0 18px rgba(167,139,250,0.8);
  -webkit-appearance: none;
  appearance: none;
}

.crossfader::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ec4899;
  box-shadow: 0 0 14px rgba(236,72,153,0.9), 0 0 6px rgba(255,255,255,0.4);
  cursor: pointer;
}

.crossfader::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ec4899;
  box-shadow: 0 0 14px rgba(236,72,153,0.9), 0 0 6px rgba(255,255,255,0.4);
  cursor: pointer;
}

/* banks + library */
.section-title {
  margin-top: 18px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #a78bfa;
}

.banks-grid {
  margin-top: 6px;
  display: grid;
  grid-template-columns: repeat(13,1fr);
  gap: 4px;
}

.bank-btn {
  padding: 4px 0;
  border-radius: 999px;
  border: none;
  background: #0f172a;
  color: #e5e7eb;
  font-size: 0.6rem;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(30,64,175,0.7);
}

.bank-btn:hover { background: #1d4ed8; }

.bank-tracks { margin-top: 8px; font-size: 0.7rem; }

.bank-track-item,
.library-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  border-bottom: 1px solid rgba(30,64,175,0.4);
}

.library-item-title { font-size: 0.7rem; }

.library-controls select { font-size: 0.65rem; }

/* footer nav */
.footer-nav {
  margin-top: 18px;
  text-align: center;
  font-size: 0.7rem;
  color: #64748b;
}

.footer-nav span {
  margin: 0 8px;
  cursor: pointer;
  color: #a78bfa;
  text-decoration: underline;
}

.footer-nav span:hover {
  color: #ec4899;
}

/* responsive scaling */
@media (max-width: 900px) {
  .deck { max-width: 380px; }
  .deck-wheel { width: 190px; }
}

@media (max-width: 700px) {
  .glow-card { padding: 14px; }
  .decks-container { gap: 10px; }
  .deck { max-width: 320px; padding: 12px; }
  .deck-wheel { width: 170px; }
}

@media (max-width: 540px) {
  .decks-container { transform: scale(0.9); }
}
</style>
</head>
