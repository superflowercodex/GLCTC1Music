<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Decks</title>

<style>
@keyframes spinWheel {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes waveMove {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

body {
  margin: 0;
  padding: 20px;
  background: #020617;
  color: #e5e7eb;
  font-family: system-ui, sans-serif;
}
h1 {
  text-align: center;
  color: #a78bfa;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.glow-card {
  max-width: 1200px;
  margin: 20px auto;
  padding: 24px;
  background: rgba(15,23,42,0.9);
  border-radius: 14px;
  border: 1px solid #a78bfa;
}

/* Decks */
.deck-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 32px;
}
.deck {
  background: rgba(2,6,23,0.9);
  padding: 20px;
  border-radius: 16px;
}
.deck h2 {
  text-align: center;
  color: #a78bfa;
  text-transform: uppercase;
}

/* Platter */
.deck-wheel-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
}

.deck-wheel {
  width: 240px;
  aspect-ratio: 1/1;
  border-radius: 50%;
  background: radial-gradient(circle at center,
    #3b0764 0%,
    #4c1d95 40%,
    #1e1b4b 70%,
    #000 100%
  );
  border: 6px solid #a78bfa;
  box-shadow: 0 0 30px #a78bfa;
  position: relative;

  animation-name: spinWheel;
  animation-duration: 2.5s;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  animation-play-state: paused;
}

/* Rotation marker */
.deck-wheel-marker {
  position: absolute;
  top: 10px;
  left: 50%;
  width: 10px;
  height: 60px;
  background: #ff9800;
  border-radius: 999px;
  transform: translateX(-50%);
}

/* Groove texture */
.deck-wheel-texture {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background-image: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.08) 0px,
    rgba(255,255,255,0.08) 6px,
    transparent 6px,
    transparent 12px
  );
}

/* Pitch */
.pitch-slider {
  -webkit-appearance: slider-vertical;
  writing-mode: bt-lr;
  height: 180px;
}

/* Waveform */
.wave-strip {
  height: 40px;
  background: rgba(167,139,250,0.15);
  margin-top: 16px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}
.wave-bar {
  width: 200%;
  height: 100%;
  background: linear-gradient(135deg,#a78bfa,#6366f1,#ec4899,#22c55e);
  opacity: 0.5;
  animation: waveMove 10s linear infinite;
}

/* Transport */
.transport-row {
  margin-top: 12px;
  display: flex;
  justify-content: center;
  gap: 8px;
}
button {
  padding: 6px 12px;
  border-radius: 999px;
  border: none;
  background: #a78bfa;
  color: #020617;
  font-size: 0.75rem;
  cursor: pointer;
}
button.secondary {
  background: #ec4899;
  color: #fff;
}

/* Volume */
.slider-wrap {
  margin-top: 12px;
  text-align: center;
}

/* Crossfader */
.crossfader-wrap {
  margin-top: 24px;
  text-align: center;
}
.crossfader {
  width: 100%;
}

/* Library + banks */
.library-list {
  margin-top: 20px;
  background: rgba(2,6,23,0.8);
  padding: 12px;
  border-radius: 10px;
}
.library-item,
.bank-track-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid rgba(31,41,55,0.8);
}
.banks-grid {
  display: grid;
  grid-template-columns: repeat(13,1fr);
  gap: 4px;
}
.bank-btn {
  padding: 4px 0;
  border-radius: 999px;
  background: #a78bfa;
  color: #020617;
  font-size: 0.7rem;
  cursor: pointer;
}
</style>
</head>

<body>
<h1>GLCTC1 – Decks</h1>

<div class="glow-card">

  <div class="deck-grid">

    <!-- Deck A -->
    <div class="deck">
      <h2>Deck A</h2>

      <div class="deck-wheel-wrap">
        <div class="deck-wheel" id="wheelA">
          <div class="deck-wheel-marker"></div>
          <div class="deck-wheel-texture"></div>
        </div>

        <input type="range" min="0.5" max="1.5" step="0.01"
               class="pitch-slider" value="1"
               oninput="setPitch('A',this.value)">
      </div>

      <audio id="audioA" controls style="width:100%; margin-top:10px;"></audio>

      <div class="wave-strip"><div class="wave-bar"></div></div>

      <div class="transport-row">
        <button onclick="playDeck('A')">Play</button>
        <button onclick="stopDeck('A')">Stop</button>
        <button onclick="setCue('A')">Cue</button>
        <button onclick="loopDeck('A')">Loop</button>
        <button class="secondary" onclick="syncDeck('A','B')">Sync → B</button>
      </div>

      <div class="slider-wrap">
        <input type="range" min="0" max="1" step="0.01"
               value="1" oninput="setVolume('A',this.value)">
      </div>
    </div>

    <!-- Deck B -->
    <div class="deck">
      <h2>Deck B</h2>

      <div class="deck-wheel-wrap">
        <div class="deck-wheel" id="wheelB">
          <div class="deck-wheel-marker"></div>
          <div class="deck-wheel-texture"></div>
        </div>

        <input type="range" min="0.5" max="1.5" step="0.01"
               class="pitch-slider" value="1"
               oninput="setPitch('B',this.value)">
      </div>

      <audio id="audioB" controls style="width:100%; margin-top:10px;"></audio>

      <div class="wave-strip"><div class="wave-bar"></div></div>

      <div class="transport-row">
        <button onclick="playDeck('B')">Play</button>
        <button onclick="stopDeck('B')">Stop</button>
        <button onclick="setCue('B')">Cue</button>
        <button onclick="loopDeck('B')">Loop</button>
        <button class="secondary" onclick="syncDeck('B','A')">Sync → A</button>
      </div>

      <div class="slider-wrap">
        <input type="range" min="0" max="1" step="0.01"
               value="1" oninput="setVolume('B',this.value)">
      </div>
    </div>

  </div>

  <!-- Crossfader -->
  <div class="crossfader-wrap">
    <input type="range" min="0" max="1" step="0.01"
           class="crossfader" value="0.5"
           oninput="setCrossfader(this.value)">
  </div>

  <!-- Banks -->
  <div class="library-list">
    <h2>Banks</h2>
    <div class="banks-grid" id="banksGrid"></div>
    <div id="bankTracks"></div>
  </div>

  <!-- Master Library -->
  <div class="library-list">
    <h2>Master Library</h2>
    <div id="masterLibrary"></div>
  </div>

</div>

<script>
const MASTER_LIBRARY = [
  { id:'001', title:'Cosmic Dawn', artist:'Leyton', file:'tracks/cosmic-dawn.mp3' },
  { id:'002', title:'Neon Temple', artist:'Leyton', file:'tracks/neon-temple.mp3' }
];

const BANKS = {};
let cues = {A:0,B:0};
let loops = {A:false,B:false};

function audio(deck){ return document.getElementById(deck==='A'?'audioA':'audioB'); }
function wheel(deck){ return document.getElementById(deck==='A'?'wheelA':'wheelB'); }

function playDeck(deck){
  audio(deck).play();
  wheel(deck).style.animationPlayState='running';
}
function stopDeck(deck){
  audio(deck).pause();
  audio(deck).currentTime=0;
  wheel(deck).style.animationPlayState='paused';
}
function setCue(deck){ cues[deck]=audio(deck).currentTime; }
function loopDeck(deck){
  loops[deck]=!loops[deck];
  audio(deck).loop=loops[deck];
}
function setPitch(deck,val){
  audio(deck).playbackRate=parseFloat(val);
  wheel(deck).style.animationDuration=(2.5/parseFloat(val))+'s';
}
function setVolume(deck,val){
  audio(deck).volume=parseFloat(val);
}
function setCrossfader(v){
  audio('A').volume=1-v;
  audio('B').volume=v;
}

function renderMaster(){
  const box=document.getElementById('masterLibrary');
  box.innerHTML='';
  MASTER_LIBRARY.forEach(t=>{
    const div=document.createElement('div');
    div.className='library-item';
    div.innerHTML=`
      <div><strong>${t.title}</strong> – ${t.artist}</div>
      <div>
        <select onchange="addToBank('${t.id}',this.value)">
          <option value="">Bank…</option>
          ${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<option>${l}</option>`).join('')}
        </select>
        <button onclick="audio('A').src='${t.file}'">Load A</button>
        <button onclick="audio('B').src='${t.file}'">Load B</button>
      </div>`;
    box.appendChild(div);
  });
}

function renderBanks(){
  const grid=document.getElementById('banksGrid');
  grid.innerHTML='';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l=>{
    const b=document.createElement('button');
    b.className='bank-btn';
    b.textContent=l;
    b.onclick=()=>showBank(l);
    grid.appendChild(b);
  });
}

function addToBank(id,letter){
  if(!letter)return;
  const track=MASTER_LIBRARY.find(t=>t.id===id);
  if(!BANKS[letter])BANKS[letter]=[];
  BANKS[letter].push(track);
  showBank(letter);
}

function showBank(letter){
  const box=document.getElementById('bankTracks');
  box.innerHTML='';
  const list=BANKS[letter]||[];
  box.innerHTML=`<h3>Bank ${letter}</h3>`;
  list.forEach(t=>{
    const div=document.createElement('div');
    div.className='bank-track-item';
    div.innerHTML=`
      <div><strong>${t.title}</strong> – ${t.artist}</div>
      <div>
        <button onclick="audio('A').src='${t.file}'">Load A</button>
        <button onclick="audio('B').src='${t.file}'">Load B</button>
      </div>`;
    box.appendChild(div);
  });
}

renderMaster();
renderBanks();
</script>

</body>
</html>
