<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Upload Track</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
margin: 0;
padding: 20px;
background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
color: #e5e7eb;
font-family: system-ui, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
gap: 24px;
}

h1 {
font-size: 2rem;
letter-spacing: 0.15em;
text-transform: uppercase;
color: #38bdf8;
text-shadow: 0 0 16px #0ea5e9;
text-align: center;
}

.glow-card {
width: 100%;
max-width: 700px;
background: rgba(15, 23, 42, 0.9);
border-radius: 14px;
padding: 20px;
box-shadow:
0 0 25px rgba(56, 189, 248, 0.35),
0 0 60px rgba(129, 140, 248, 0.35);
border: 1px solid rgba(56, 189, 248, 0.5);
margin-top: 10px;
}

label {
font-size: 0.75rem;
text-transform: uppercase;
letter-spacing: 0.08em;
color: #9ca3af;
}

input, select {
width: 100%;
padding: 6px 8px;
margin-top: 4px;
border-radius: 6px;
border: 1px solid #1f2937;
background: #020617;
color: #e5e7eb;
font-size: 0.8rem;
}

.form-grid {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 14px 20px;
margin-top: 16px;
}

button {
padding: 10px 18px;
border-radius: 999px;
border: none;
font-size: 0.8rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.08em;
cursor: pointer;
background: linear-gradient(90deg, #22c55e, #06b6d4);
color: #020617;
box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
margin-top: 16px;
}

nav {
margin-top: 16px;
font-size: 0.8rem;
color: #9ca3af;
}

nav a {
color: #38bdf8;
text-decoration: none;
margin: 0 6px;
}

nav a:hover {
text-decoration: underline;
}

.status {
margin-top: 10px;
font-size: 0.8rem;
color: #a5b4fc;
}
</style>
</head>

<body>

<h1>GLCTC1 – Upload Track</h1>

<div class="glow-card">
<h2 style="color:#a5b4fc; text-transform:uppercase; letter-spacing:0.12em;">Track Metadata</h2>

<div class="form-grid">
<div>
<label>Title</label>
<input id="title" type="text">
</div>
<div>
<label>Artist</label>
<input id="artist" type="text">
</div>
<div>
<label>BPM</label>
<input id="bpm" type="number">
</div>
<div>
<label>Key</label>
<input id="key" type="text" placeholder="e.g. 8A">
</div>
<div>
<label>Bank</label>
<select id="bank">
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
<option value="E">E</option>
<option value="F">F</option>
<option value="G">G</option>
<option value="H">H</option>
<option value="I">I</option>
<option value="J">J</option>
<option value="K">K</option>
<option value="L">L</option>
<option value="M">M</option>
<option value="N">N</option>
<option value="O">O</option>
<option value="P">P</option>
<option value="Q">Q</option>
<option value="R">R</option>
<option value="S">S</option>
<option value="T">T</option>
<option value="U">U</option>
<option value="V">V</option>
<option value="W">W</option>
<option value="X">X</option>
<option value="Y">Y</option>
<option value="Z">Z</option>
</select>
</div>
<div>
<label>Genre</label>
<input id="genre" type="text">
</div>
</div>

<h2 style="color:#a5b4fc; margin-top:20px;">Audio File</h2>
<input id="audioFile" type="file" accept="audio/*">

<button id="uploadBtn">Upload Track</button>

<div class="status" id="uploadStatus"></div>
</div>

<nav>
<span>Navigation:</span>
<a href="index.html">Login</a> |
<a href="upload.html">Upload</a> |
<a href="decks.html">Decks</a>
</nav>

<script>
const SUPABASE_URL = "https://zdlaloiruxamxsduxqxw.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbGFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQ";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("uploadBtn").addEventListener("click", async () => {
const { data: { session } } = await supabase.auth.getSession();
if (!session) {
document.getElementById("uploadStatus").textContent = "You must be logged in.";
return;
}

const title = document.getElementById("title").value;
const artist = document.getElementById("artist").value;
const bpm = document.getElementById("bpm").value;
const key = document.getElementById("key").value;
const bank = document.getElementById("bank").value;
const genre = document.getElementById("genre").value;

const audioFile = document.getElementById("audioFile").files[0];
if (!audioFile) {
document.getElementById("uploadStatus").textContent = "Select an audio file.";
return;
}

const filePath = tracks/${Date.now()}_${audioFile.name};

const { data: uploadData, error: uploadError } = await supabase.storage
.from("glctc1-tracks")
.upload(filePath, audioFile);

if (uploadError) {
document.getElementById("uploadStatus").textContent = uploadError.message;
return;
}

const { data: insertData, error: insertError } = await supabase
.from("tracks")
.insert({
title,
artist,
bpm,
key,
bank,
genre,
file_path: filePath,
user_id: session.user.id
});

if (insertError) {
document.getElementById("uploadStatus").textContent = insertError.message;
} else {
document.getElementById("uploadStatus").textContent = "Track uploaded!";
}
});
</script>

</body>
</html>
