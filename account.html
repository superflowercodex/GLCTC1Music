<script>


// =====================================================
// SUPABASE CONNECTION
// =====================================================

const supabaseUrl =
  "https://zdlaloiruxamxsduxqxw.supabase.co";


// =====================================================
// IMPORTANT
// USE THE EXACT SAME WORKING ANON/PUBLISHABLE KEY
// FROM YOUR EXISTING PAGE 1 CODE.
// =====================================================

const supabaseKey =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbGFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQ";


const supabaseClient =
  supabase.createClient(
    supabaseUrl,
    supabaseKey
  );


// =====================================================
// YOUR ADMIN USER ID
// =====================================================

const ADMIN_USER_ID =
  "8c70a492-3cf1-4053-b0ee-b5b186529d54";


// =====================================================
// CURRENT USER
// =====================================================

let currentUser = null;


// =====================================================
// LOAD PROFILE
// =====================================================

async function loadProfile() {

  // ---------------------------------------------------
  // GET CURRENT SESSION
  // ---------------------------------------------------

  const {
    data: { session },
    error: sessionError
  } =
    await supabaseClient.auth.getSession();


  // ---------------------------------------------------
  // SESSION ERROR
  // ---------------------------------------------------

  if (sessionError) {

    document.getElementById("status").textContent =
      "Unable to check account.";

    console.error(sessionError);

    return;
  }


  // ---------------------------------------------------
  // NOT SIGNED IN
  // ---------------------------------------------------

  if (!session) {

    document.getElementById("status").textContent =
      "You are not signed in.";

    return;
  }


  // ---------------------------------------------------
  // STORE USER
  // ---------------------------------------------------

  currentUser = session.user;


  // ---------------------------------------------------
  // SHOW PROFILE
  // ---------------------------------------------------

  document
    .getElementById("profileCard")
    .classList
    .remove("hidden");


  document
    .getElementById("status")
    .textContent =
      "Welcome to your GLCTC1 Artist Profile.";


  // ---------------------------------------------------
  // EMAIL
  // ---------------------------------------------------

  document
    .getElementById("accountEmail")
    .textContent =
      currentUser.email || "";


  // ---------------------------------------------------
  // USER ID
  // ---------------------------------------------------

  document
    .getElementById("userId")
    .textContent =
      currentUser.id;


  // ---------------------------------------------------
  // ADMIN CHECK
  // ---------------------------------------------------

  const permission =
    document.getElementById("permission");


  if (currentUser.id === ADMIN_USER_ID) {

    permission.textContent =
      "Administrator";

  } else {

    permission.textContent =
      "Standard User";

  }


  // ---------------------------------------------------
  // FIND EXISTING PROFILE
  // ---------------------------------------------------

  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("artist_name")
      .eq("id", currentUser.id)
      .maybeSingle();


  // ---------------------------------------------------
  // PROFILE READ ERROR
  // ---------------------------------------------------

  if (profileError) {

    console.error(profileError);

    document.getElementById("saveStatus").textContent =
      "Unable to load artist profile.";

    return;
  }


  // ---------------------------------------------------
  // PROFILE EXISTS
  // ---------------------------------------------------

  if (profile) {

    document
      .getElementById("artistName")
      .value =
        profile.artist_name || "";

  }

}


// =====================================================
// SAVE ARTIST PROFILE
// =====================================================

async function saveArtistProfile() {


  if (!currentUser) {

    document.getElementById("saveStatus").textContent =
      "You are not signed in.";

    return;
  }


  const artistName =
    document
      .getElementById("artistName")
      .value
      .trim();


  const saveStatus =
    document.getElementById("saveStatus");


  // ---------------------------------------------------
  // REQUIRE ARTIST NAME
  // ---------------------------------------------------

  if (!artistName) {

    saveStatus.textContent =
      "Please enter your artist name.";

    return;
  }


  saveStatus.textContent =
    "Saving artist profile...";


  // ---------------------------------------------------
  // CHECK WHETHER PROFILE ALREADY EXISTS
  // ---------------------------------------------------

  const {
    data: existingProfile,
    error: checkError
  } =
    await supabaseClient
      .from("profiles")
      .select("id")
      .eq("id", currentUser.id)
      .maybeSingle();


  if (checkError) {

    console.error(checkError);

    saveStatus.textContent =
      "Unable to check your profile.";

    return;
  }


  // ===================================================
  // UPDATE EXISTING PROFILE
  // ===================================================

  if (existingProfile) {

    const {
      error: updateError
    } =
      await supabaseClient
        .from("profiles")
        .update({

          artist_name: artistName

        })
        .eq("id", currentUser.id);


    if (updateError) {

      console.error(updateError);

      saveStatus.textContent =
        updateError.message;

      return;
    }


    saveStatus.textContent =
      "✓ Artist profile updated.";

    return;
  }


  // ===================================================
  // CREATE NEW PROFILE
  // ===================================================

  const {
    error: insertError
  } =
    await supabaseClient
      .from("profiles")
      .insert({

        id: currentUser.id,

        artist_name: artistName

      });


  if (insertError) {

    console.error(insertError);

    saveStatus.textContent =
      insertError.message;

    return;
  }


  saveStatus.textContent =
    "✓ Artist profile saved.";

}


// =====================================================
// SAVE BUTTON
// =====================================================

document
  .getElementById("saveProfileBtn")
  .addEventListener(
    "click",
    saveArtistProfile
  );


// =====================================================
// LOGOUT
// =====================================================

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();

      window.location.href =
        "index.html";

    }
  );


// =====================================================
// START PAGE
// =====================================================

loadProfile();

</script>
