<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLCTC1 – Cosmic 1200 Decks</title>

  <style>
    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes waveMove {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: radial-gradient(circle at top, #0f172a 0%, #020617 40%, #000 100%);
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    h1 {
      text-align: center;
      color: #a78bfa;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.75rem;
      margin-bottom: 20px;
    }

    .glow-card {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: rgba(15,23,42,0.95);
      border-radius: 16px;
      border: 1px solid rgba(167,139,250,0.7);
      box-shadow: 0 0 40px rgba(88,28,135,0.6);
    }

    /* Twin decks layout */
    .decks-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .deck {
      flex: 1 1 0;
      max-width: 480px;
      background: rgba(2,6,23,0.95);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(30,64,175,0.6);
      box-shadow: 0 0 24px rgba(30,64,175,0.4);
    }

    .deck-title {
      text-align: center;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      color: #a78bfa;
      margin-bottom: 10px;
    }

    /* Platter + pitch */
    .deck-top-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-bottom: 10px;
    }

    .deck-wheel {
      width: 220px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle at center,
        #3b0764 0%,
        #4c1d95 40%,
        #1e1b4b 70%,
        #000 100%
      );
      border: 6px solid #a78bfa;
      box-shadow: 0 0 30px rgba(167,139,250,0.9);
      position: relative;
      animation: spinWheel 2.5s linear infinite;
      animation-play-state: paused;
    }

    .deck-wheel-marker {
      position: absolute;
      top: 10px;
      left: 50%;
      width: 12px;
      height: 70px;
      background: #ff9800;
      border-radius: 999px;
      transform: translateX(-50%);
    }

    .deck-wheel-texture {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-image: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.08) 0px,
        rgba(255,255,255,0.08) 6px,
        transparent 6px,
        transparent 12px
      );
    }

    .pitch-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .pitch-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    .pitch-slider {
      -webkit-appearance: slider-vertical;
      writing-mode: bt-lr;
      height: 170px;
      width: 18px;
    }

    .audio-bar {
      margin-top: 8px;
    }

    audio {
      width: 100%;
    }

    .wave-strip {
      height: 32px;
      background: rgba(15,23,42,0.9);
      margin-top: 8px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(148,163,184,0.4);
    }

    .wave-bar {
      width: 200%;
      height: 100%;
      background: linear-gradient(135deg,#a78bfa,#6366f1,#ec4899,#22c55e);
      opacity: 0.55;
      animation: waveMove 10s linear infinite;
    }

    .transport-row {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    button {
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      background: #1d4ed8;
      color: #e5e7eb;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    button.secondary {
      background: #ec4899;
    }

    button:hover {
      box-shadow: 0 0 12px rgba(59,130,246,0.8);
    }

    .slider-row {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 8px;
    }

    .slider-row-2 {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 8px;
    }

    .slider-block {
      text-align: center;
    }

    .slider-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    .slider-block input[type="range"] {
      width: 100%;
    }

    /* Crossfader */
    .crossfader-wrap {
      margin-top: 18px;
      text-align: center;
    }

    .crossfader-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .crossfader {
      width: 60%;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #3b0764, #a78bfa, #ec4899, #a78bfa, #3b0764);
      box-shadow: 0 0 18px rgba(167,139,250,0.8);
      -webkit-appearance: none;
      appearance: none;
    }

    .crossfader::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ec4899;
      box-shadow: 0 0 14px rgba(236,72,153,0.9), 0 0 6px rgba(255,255,255,0.4);
      cursor: pointer;
    }

    .crossfader::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ec4899;
      box-shadow: 0 0 14px rgba(236,72,153,0.9), 0 0 6px rgba(255,255,255,0.4);
      cursor: pointer;
    }

    .section-title {
      margin-top: 18px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #a78bfa;
    }

    /* Master Library */
    .library-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.75rem;
    }

    .library-table th,
    .library-table td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(30,64,175,0.4);
    }

    .library-table th {
      text-align: left;
      color: #cbd5f5;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.7rem;
    }

    .library-row {
      cursor: pointer;
    }

    .library-row:hover {
      background: rgba(30,64,175,0.25);
    }

    .details-panel {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.5);
      font-size: 0.75rem;
    }

    /* Banks */
    .banks-grid {
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(13,1fr);
      gap: 4px;
    }

    .bank-btn {
      padding: 4px 0;
      border-radius: 999px;
      border: none;
      background: #0f172a;
      color: #e5e7eb;
      font-size: 0.6rem;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(30,64,175,0.7);
    }

    .bank-btn:hover {
      background: #1d4ed8;
    }

    .bank-track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid rgba(30,64,175,0.4);
      font-size: 0.75rem;
    }

    /* Footer nav */
    .footer-nav {
      margin-top: 18px;
      text-align: center;
      font-size: 0.7rem;
      color: #64748b;
    }

    .footer-nav span {
      margin: 0 8px;
      cursor: pointer;
      color: #a78bfa;
      text-decoration: underline;
    }

    .footer-nav span:hover {
      color: #ec4899;
    }
  </style>
</head>

<body>
  <h1>GLCTC1 – COSMIC 1200 DECKS</h1>
  <div class="subtitle">Twin cosmic decks • Master Library • Banks A–Z</div>

  <div class="glow-card">

    <div class="decks-container">

      <!-- Deck A -->
      <div class="deck" id="deckA">
        <div class="deck-title">Deck A</div>

        <div class="deck-top-row">
          <div class="deck-wheel" id="wheelA">
            <div class="deck-wheel-marker"></div>
            <div class="deck-wheel-texture"></div>
          </div>

          <div class="pitch-wrap">
            <div class="pitch-label">Pitch</div>
            <input
              type="range"
              min="0.5"
              max="1.5"
              step="0.01"
              value="1"
              class="pitch-slider"
              oninput="setPitch('A', this.value)"
            >
          </div>
        </div>

        <div class="audio-bar">
          <audio id="audioA" controls></audio>
        </div>

        <div class="wave-strip">
          <div class="wave-bar"></div>
        </div>

        <div class="transport-row">
          <button onclick="playDeck('A')">Play</button>
          <button onclick="stopDeck('A')">Stop</button>
          <button onclick="setCue('A')">Cue</button>
          <button onclick="toggleLoop('A')">Loop</button>
          <button class="secondary" onclick="syncDeck('A','B')">Sync → B</button>
        </div>

        <div class="slider-row">
          <div class="slider-block">
            <div class="slider-label">Volume</div>
            <input type="range" min="0" max="1" step="0.01" value="1"
                   oninput="setVolume('A', this.value)">
          </div>
          <div class="slider-block">
            <div class="slider-label">High</div>
            <input type="range" min="-12" max="12" step="1" value="0">
          </div>
          <div class="slider-block">
            <div class="slider-label">Mid</div>
            <input type="range" min="-12" max="12" step="1" value="0">
          </div>
          <div class="slider-block">
            <div class="slider-label">Low</div>
            <input type="range" min="-12" max="12" step="1" value="0">
          </div>
        </div>

        <div class="slider-row-2">
          <div class="slider-block">
            <div class="slider-label">Filter</div>
            <input type="range" min="0" max="1" step="0.01" value="0"
                   oninput="setFilter('A', this.value)">
          </div>
          <div class="slider-block">
            <div class="slider-label">Delay</div>
            <input type="range" min="0" max="1" step="0.01" value="0"
                   oninput="setDelay('A', this.value)">
          </div>
        </div>
      </div>

      <!-- Deck B -->
      <div class="deck" id="deckB">
        <div class="deck-title">Deck B</div>

        <div class="deck-top-row">
          <div class="deck-wheel" id="wheelB">
            <div class="deck-wheel-marker"></div>
            <div class="deck-wheel-texture"></div>
          </div>

          <div class="pitch-wrap">
            <div class="pitch-label">Pitch</div>
            <input
              type="range"
              min="0.5"
              max="1.5"
              step="0.01"
              value="1"
              class="pitch-slider"
              oninput="setPitch('B', this.value)"
            >
          </div>
        </div>

        <div class="audio-bar">
          <audio id="audioB" controls></audio>
        </div>

        <div class="wave-strip">
          <div class="wave-bar"></div>
        </div>

        <div class="transport-row">
          <button onclick="playDeck('B')">Play</button>
          <button onclick="stopDeck('B')">Stop</button>
          <button onclick="setCue('B')">Cue</button>
          <button onclick="toggleLoop('B')">Loop</button>
          <button class="secondary" onclick="syncDeck('B','A')">Sync → A</button>
        </div>

        <div class="slider-row">
          <div class="slider-block">
            <div class="slider-label">Volume</div>
            <input type="range" min="0" max="1" step="0.01" value="1"
                   oninput="setVolume('B', this.value)">
          </div>
          <div class="slider-block">
            <div class="slider-label">High</div>
            <input type="range" min="-12" max="12" step="1" value="0">
          </div>
          <div class="slider-block">
            <div class="slider-label">Mid</div>
            <input type="range" min="-12" max="12" step="1" value="0">
          </div>
          <div class="slider-block">
            <div class="slider-label">Low</div>
            <input type="range" min="-12" max="12" step="1" value="0">
          </div>
        </div>

        <div class="slider-row-2">
          <div class="slider-block">
            <div class="slider-label">Filter</div>
            <input type="range" min="0" max="1" step="0.01" value="0"
                   oninput="setFilter('B', this.value)">
          </div>
          <div class="slider-block">
            <div class="slider-label">Delay</div>
            <input type="range" min="0" max="1" step="0.01" value="0"
                   oninput="setDelay('B', this.value)">
          </div>
        </div>
      </div>

    </div>

    <!-- Crossfader -->
    <div class="crossfader-wrap">
      <div class="crossfader-label">Crossfader</div>
      <input
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
        class="crossfader"
        oninput="setCrossfader(this.value)"
      >
    </div>

    <!-- Banks -->
    <div class="section-title">Banks A–Z</div>
    <div class="banks-grid" id="banksGrid"></div>
    <div class="bank-tracks" id="bankTracks"></div>

    <!-- Master Library -->
    <div class="section-title">Master Library</div>
    <table class="library-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Track</th>
          <th>Artist</th>
          <th>BPM</th>
          <th>Key</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="libraryBody"></tbody>
    </table>

    <div class="details-panel" id="detailsPanel">
      Click a track row to see full details here.
    </div>

    <!-- Footer nav -->
    <div class="footer-nav">
      <span onclick="goPage('index.html')">Login</span>•
      <span onclick="goPage('upload.html')">Upload</span>•
      <span onclick="goPage('decks.html')">Decks</span>
    </div>

  </div>

  <script>
    /* Core state */
    let MASTER_LIBRARY = [];   // Page 2 should populate this with uploaded tracks
    const BANKS = {};
    let cues = { A: 0, B: 0 };
    let loops = { A: false, B: false };
    let baseVolume = { A: 1, B: 1 };
    let crossfade = 0.5;

    function audio(deck) {
      return document.getElementById(deck === 'A' ? 'audioA' : 'audioB');
    }

    function wheel(deck) {
      return document.getElementById(deck === 'A' ? 'wheelA' : 'wheelB');
    }

    /* Deck controls */
    function playDeck(deck) {
      audio(deck).play();
      wheel(deck).style.animationPlayState = 'running';
    }

    function stopDeck(deck) {
      audio(deck).pause();
      audio(deck).currentTime = 0;
      wheel(deck).style.animationPlayState = 'paused';
    }

    function setCue(deck) {
      cues[deck] = audio(deck).currentTime;
    }

    function toggleLoop(deck) {
      loops[deck] = !loops[deck];
      audio(deck).loop = loops[deck];
    }

    /* Pitch – audio + platter */
    function setPitch(deck, val) {
      const rate = parseFloat(val);
      audio(deck).playbackRate = rate;
      wheel(deck).style.animationDuration = (2.5 / rate) + 's';
    }

    /* Volume + crossfader blend */
    function setVolume(deck, val) {
      baseVolume[deck] = parseFloat(val);
      applyVolumes();
    }

    function setCrossfader(val) {
      crossfade = parseFloat(val);
      applyVolumes();
    }

    function applyVolumes() {
      audio('A').volume = baseVolume.A * (1 - crossfade);
      audio('B').volume = baseVolume.B * crossfade;
    }

    function syncDeck(from, to) {
      audio(to).currentTime = audio(from).currentTime;
    }

    /* FX – UI only, ready for WebAudio later */
    function setFilter(deck, val) {
      // Stub: hook up WebAudio filter here if you want real FX
    }

    function setDelay(deck, val) {
      // Stub: hook up WebAudio delay here if you want real FX
    }

    /* Master Library – 1 empty slot always ready */
    function renderLibrary() {
      const body = document.getElementById('libraryBody');
      body.innerHTML = '';

      const slots = MASTER_LIBRARY.length + 1; // tracks + 1 empty

      for (let i = 0; i < slots; i++) {
        const tr = document.createElement('tr');
        tr.className = 'library-row';

        const tdIndex = document.createElement('td');
        tdIndex.textContent = i + 1;
        tr.appendChild(tdIndex);

        const tdTitle = document.createElement('td');
        const tdArtist = document.createElement('td');
        const tdBpm = document.createElement('td');
        const tdKey = document.createElement('td');
        const tdActions = document.createElement('td');

        const track = MASTER_LIBRARY[i];

        if (track) {
          tdTitle.textContent = track.title || '—';
          tdArtist.textContent = track.artist || '—';
          tdBpm.textContent = track.bpm || '—';
          tdKey.textContent = track.key || '—';

          const btnA = document.createElement('button');
          btnA.textContent = 'Load A';
          btnA.onclick = (e) => {
            e.stopPropagation();
            audio('A').src = track.file;
          };

          const btnB = document.createElement('button');
          btnB.textContent = 'Load B';
          btnB.onclick = (e) => {
            e.stopPropagation();
            audio('B').src = track.file;
          };

          const sel = document.createElement('select');
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'Bank…';
          sel.appendChild(opt);

          "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(letter => {
            const o = document.createElement('option');
            o.value = letter;
            o.textContent = letter;
            sel.appendChild(o);
          });

          sel.onchange = (e) => {
            e.stopPropagation();
            addToBank(track.id, e.target.value);
            e.target.value = '';
          };

          tdActions.appendChild(btnA);
          tdActions.appendChild(btnB);
          tdActions.appendChild(sel);

          tr.onclick = () => showDetails(track.id);
        } else {
          tdTitle.textContent = '— empty slot —';
          tdArtist.textContent = '';
          tdBpm.textContent = '';
          tdKey.textContent = '';
          tdActions.textContent = '';
          tr.style.opacity = 0.5;
        }

        tr.appendChild(tdTitle);
        tr.appendChild(tdArtist);
        tr.appendChild(tdBpm);
        tr.appendChild(tdKey);
        tr.appendChild(tdActions);

        body.appendChild(tr);
      }
    }

    /* Details panel */
    function showDetails(id) {
      const panel = document.getElementById('detailsPanel');
      const t = MASTER_LIBRARY.find(x => x.id === id);

      if (!t) {
        panel.textContent = 'Track not found.';
        return;
      }

      panel.innerHTML = `
        <strong>${t.title || 'Unknown Title'}</strong> – ${t.artist || 'Unknown Artist'}<br>
        BPM: ${t.bpm || '—'} • Key: ${t.key || '—'}<br>
        Duration: ${t.duration || '—'}s<br>
        Genre: ${t.genre || '—'}<br>
        Album: ${t.album || '—'} (${t.year || '—'})<br>
        Comments: ${t.comments || '—'}<br><br>
        <button onclick="audio('A').src='${t.file}'">Load A</button>
        <button onclick="audio('B').src='${t.file}'">Load B</button>
      `;
    }

    /* Banks A–Z */
    function renderBanks() {
      const grid = document.getElementById('banksGrid');
      grid.innerHTML = '';

      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'bank-btn';
        btn.textContent = letter;
        btn.onclick = () => showBank(letter);
        grid.appendChild(btn);
      });
    }

    function addToBank(id, letter) {
      if (!letter) return;

      if (!BANKS[letter]) {
        BANKS[letter] = [];
      }

      const track = MASTER_LIBRARY.find(x => x.id === id);
      if (track) {
        BANKS[letter].push(track);
      }

      showBank(letter);
    }

    function showBank(letter) {
      const box = document.getElementById('bankTracks');
      box.innerHTML = `<div>Bank ${letter}</div>`;

      (BANKS[letter] || []).forEach(track => {
        const row = document.createElement('div');
        row.className = 'bank-track-item';

        row.innerHTML = `
          <div><strong>${track.title}</strong> – ${track.artist}</div>
          <div>
            <button onclick="audio('A').src='${track.file}'">Load A</button>
            <button onclick="audio('B').src='${track.file}'">Load B</button>
          </div>
        `;

        box.appendChild(row);
      });
    }

    /* Navigation */
    function goPage(p) {
      window.location.href = p;
    }

    /* Init */
    renderLibrary();
    renderBanks();
    applyVolumes();
  </script>
</body>
</html>
