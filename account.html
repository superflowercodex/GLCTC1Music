<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>GLCTC1 — Artist Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;

  background:
    radial-gradient(
      circle at 50% 0%,
      #172554 0%,
      #020617 45%,
      #000 100%
    );

  color: #e5e7eb;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =====================================================
   GLCTC1 HEADER
===================================================== */

.header {
  width: 100%;
  max-width: 700px;
  margin: 0 auto 25px;
  text-align: center;
}

.header img {
  width: 100%;
  max-width: 600px;
  height: auto;
  display: block;
  margin: 0 auto 15px;
}

.header h1 {
  margin: 0;

  font-size: 2rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;

  color: #38bdf8;

  text-shadow:
    0 0 10px #0ea5e9,
    0 0 25px #0ea5e9;
}


/* =====================================================
   COSMIC CARD
===================================================== */

.cosmic-card {

  width: 100%;
  max-width: 700px;

  margin: 0 auto 20px;

  padding: 22px;

  background:
    rgba(15,23,42,0.88);

  border: 1px solid rgba(56,189,248,0.5);

  border-radius: 16px;

  box-shadow:
    0 0 20px rgba(56,189,248,0.25),
    0 0 50px rgba(129,140,248,0.18);

  backdrop-filter: blur(8px);
}


/* =====================================================
   PROFILE
===================================================== */

.profile {
  text-align: center;
}

.profile-image {

  width: 120px;
  height: 120px;

  margin: 0 auto 15px;

  border-radius: 50%;

  border: 2px solid #38bdf8;

  background:
    radial-gradient(
      circle,
      #1e3a8a,
      #020617
    );

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 3rem;

  box-shadow:
    0 0 20px rgba(56,189,248,0.5);
}

.artist-name {

  font-size: 1.5rem;

  color: #67e8f9;

  text-shadow:
    0 0 12px #06b6d4;
}


/* =====================================================
   ACCOUNT INFORMATION
===================================================== */

.info-row {

  margin-top: 12px;

  padding: 10px;

  background:
    rgba(2,6,23,0.8);

  border-radius: 8px;

  border: 1px solid rgba(56,189,248,0.15);
}

.info-label {

  font-size: 0.75rem;

  color: #94a3b8;

  text-transform: uppercase;

  letter-spacing: 0.08em;
}

.info-value {

  margin-top: 4px;

  color: #38bdf8;

  word-break: break-all;
}


/* =====================================================
   PERMISSIONS
===================================================== */

.permission {

  margin-top: 12px;

  padding: 10px;

  border-radius: 8px;

  text-align: center;

  background:
    rgba(2,6,23,0.8);

  border: 1px solid rgba(168,85,247,0.4);
}

.permission-value {

  margin-top: 4px;

  color: #c084fc;

  font-weight: 700;
}


/* =====================================================
   NAVIGATION
===================================================== */

.account-nav {

  text-align: center;

  margin-top: 20px;
}

.account-nav a {

  color: #38bdf8;

  text-decoration: none;

  margin: 0 12px;

  font-weight: 600;

  text-shadow:
    0 0 8px rgba(56,189,248,0.5);
}

.account-nav a:hover {

  color: #67e8f9;

  text-shadow:
    0 0 14px #06b6d4;
}


/* =====================================================
   BUTTON
===================================================== */

button {

  padding: 10px 22px;

  border: none;

  border-radius: 999px;

  margin-top: 18px;

  cursor: pointer;

  font-weight: 700;

  text-transform: uppercase;

  color: #020617;

  background:
    linear-gradient(
      90deg,
      #22c55e,
      #06b6d4
    );

  box-shadow:
    0 0 15px rgba(6,182,212,0.4);
}


/* =====================================================
   STATUS
===================================================== */

#status {

  text-align: center;

  color: #94a3b8;

  margin-bottom: 15px;
}

.hidden {
  display: none;
}

</style>

</head>


<body>


<!-- =====================================================
     GLCTC1 HEADER
===================================================== -->

<div class="header">

  <img
    src="https://raw.githubusercontent.com/superflowercodex/GLCTC1Music/main/Screenshot_20260813_132807_Gallery.jpg"
    alt="GLCTC1"
  >

  <h1>
    GLCTC1 ARTIST
  </h1>

</div>


<!-- =====================================================
     ACCOUNT STATUS
===================================================== -->

<div
  id="status"
  class="cosmic-card"
>
  Checking account...
</div>


<!-- =====================================================
     ARTIST PROFILE
===================================================== -->

<div
  id="profileCard"
  class="cosmic-card hidden"
>

  <div class="profile">

    <div class="profile-image">
      🎤
    </div>

    <div
      id="artistName"
      class="artist-name"
    >
      GLCTC1 ARTIST
    </div>

  </div>


  <!-- ===================================================
       ACCOUNT EMAIL
  ==================================================== -->

  <div class="info-row">

    <div class="info-label">
      Account Email
    </div>

    <div
      id="accountEmail"
      class="info-value"
    ></div>

  </div>


  <!-- ===================================================
       SUPABASE USER ID
  ==================================================== -->

  <div class="info-row">

    <div class="info-label">
      GLCTC1 User ID
    </div>

    <div
      id="userId"
      class="info-value"
    ></div>

  </div>


  <!-- ===================================================
       ACCOUNT PERMISSION
  ==================================================== -->

  <div class="permission">

    <div class="info-label">
      Account Permission
    </div>

    <div
      id="permission"
      class="permission-value"
    >
      Standard User
    </div>

  </div>


  <!-- ===================================================
       PAGE NAVIGATION
  ==================================================== -->

  <nav class="account-nav">

    <a href="index.html">
      🏠 HOME
    </a>

    |

    <a href="upload.html">
      🎵 GLCTC1 MUSIC
    </a>

  </nav>


  <!-- ===================================================
       LOG OUT
  ==================================================== -->

  <button id="logoutBtn">
    Log Out
  </button>

</div>


<script>

// =====================================================
// SUPABASE CONNECTION
// =====================================================

const supabaseUrl =
  "https://zdlaloiruxamxsduxqxw.supabase.co";

const supabaseKey =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbGFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQ";


const supabaseClient =
  supabase.createClient(
    supabaseUrl,
    supabaseKey
  );


// =====================================================
// CHECK CURRENT ACCOUNT
// =====================================================

(async () => {

  const {
    data: { session },
    error
  } =
    await supabaseClient.auth.getSession();


  // ===================================================
  // ERROR
  // ===================================================

  if (error) {

    document.getElementById("status").textContent =
      "Unable to check account.";

    console.error(error);

    return;
  }


  // ===================================================
  // NOT LOGGED IN
  // ===================================================

  if (!session) {

    document.getElementById("status").textContent =
      "You are not signed in.";

    return;
  }


  // ===================================================
  // LOGGED IN USER
  // ===================================================

  const user = session.user;


  document.getElementById("status").textContent =
    "Welcome to your GLCTC1 Artist Profile.";


  document
    .getElementById("profileCard")
    .classList.remove("hidden");


  // EMAIL

  document
    .getElementById("accountEmail")
    .textContent =
      user.email || "";


  // USER ID

  document
    .getElementById("userId")
    .textContent =
      user.id;

})();


// =====================================================
// LOG OUT
// =====================================================

document.getElementById("logoutBtn").onclick =
async () => {

  await supabaseClient.auth.signOut();

  window.location.reload();

};

</script>

</body>
</html>
