<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Cosmic 1200 Decks</title>
<style>
@keyframes spinWheel{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes waveMove{from{transform:translateX(0);}to{transform:translateX(-50%);}}
*{box-sizing:border-box;}
body{margin:0;padding:20px;background:radial-gradient(circle at top,#0f172a,#020617,#000);color:#e5e7eb;font-family:sans-serif;}
h1{text-align:center;color:#a78bfa;letter-spacing:.18em;text-transform:uppercase;font-size:.9rem;margin-bottom:10px;}
.subtitle{text-align:center;color:#64748b;font-size:.75rem;margin-bottom:20px;}
.glow-card{max-width:1200px;margin:auto;padding:20px;background:rgba(15,23,42,.95);border-radius:16px;border:1px solid rgba(167,139,250,.7);box-shadow:0 0 40px rgba(88,28,135,.6);}
.decks-container{display:flex;gap:20px;justify-content:center;}
.deck{flex:1;max-width:480px;background:rgba(2,6,23,.95);border-radius:16px;padding:16px;border:1px solid rgba(30,64,175,.6);box-shadow:0 0 24px rgba(30,64,175,.4);}
.deck-title{text-align:center;text-transform:uppercase;font-size:.8rem;letter-spacing:.12em;color:#a78bfa;margin-bottom:10px;}
.deck-top-row{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:10px;}
.deck-wheel{width:220px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#3b0764,#4c1d95,#1e1b4b,#000);border:6px solid #a78bfa;box-shadow:0 0 30px rgba(167,139,250,.9);position:relative;animation:spinWheel 2.5s linear infinite;animation-play-state:paused;}
.deck-wheel-marker{position:absolute;top:10px;left:50%;width:12px;height:70px;background:#ff9800;border-radius:999px;transform:translateX(-50%);}
.deck-wheel-texture{position:absolute;inset:0;border-radius:50%;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08)0,rgba(255,255,255,.08)6px,transparent 6px,transparent 12px);}
.pitch-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.pitch-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;}
.pitch-slider{-webkit-appearance:slider-vertical;writing-mode:bt-lr;height:170px;width:18px;}
audio{width:100%;}
.wave-strip{height:32px;background:rgba(15,23,42,.9);margin-top:8px;border-radius:10px;overflow:hidden;position:relative;border:1px solid rgba(148,163,184,.4);}
.wave-bar{width:200%;height:100%;background:linear-gradient(135deg,#a78bfa,#6366f1,#ec4899,#22c55e);opacity:.55;animation:waveMove 10s linear infinite;}
.transport-row{margin-top:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;}
button{padding:6px 12px;border-radius:999px;border:none;background:#1d4ed8;color:#e5e7eb;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;}
button.secondary{background:#ec4899;}
button:hover{box-shadow:0 0 12px rgba(59,130,246,.8);}
.slider-row{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.slider-row-2{margin-top:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.slider-block{text-align:center;}
.slider-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;}
.slider-block input{width:100%;}
.crossfader-wrap{text-align:center;margin-top:18px;}
.crossfader-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:4px;}
.crossfader{width:60%;height:10px;border-radius:999px;background:linear-gradient(90deg,#3b0764,#a78bfa,#ec4899,#a78bfa,#3b0764);box-shadow:0 0 18px rgba(167,139,250,.8);}
.crossfader::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#ec4899;box-shadow:0 0 14px rgba(236,72,153,.9),0 0 6px rgba(255,255,255,.4);}
.section-title{margin-top:18px;font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:#a78bfa;}
.library-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.75rem;}
.library-table th,.library-table td{padding:6px 8px;border-bottom:1px solid rgba(30,64,175,.4);}
.library-table th{text-align:left;color:#cbd5f5;text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;}
.library-row:hover{background:rgba(30,64,175,.25);}
.details-panel{margin-top:10px;padding:10px;border-radius:10px;background:rgba(15,23,42,.9);border:1px solid rgba(148,163,184,.5);font-size:.75rem;}
.banks-grid{margin-top:6px;display:grid;grid-template-columns:repeat(13,1fr);gap:4px;}
.bank-btn{padding:4px 0;border-radius:999px;border:none;background:#0f172a;color:#e5e7eb;font-size:.6rem;cursor:pointer;box-shadow:0 0 10px rgba(30,64,175,.7);}
.bank-btn:hover{background:#1d4ed8;}
.bank-track-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(30,64,175,.4);}
.footer-nav{text-align:center;margin-top:18px;font-size:.7rem;color:#64748b;}
.footer-nav span{margin:0 8px;cursor:pointer;color:#a78bfa;text-decoration:underline;}
.footer-nav span:hover{color:#ec4899;}
</style>
</head>

<body>
<h1>GLCTC1 – COSMIC 1200 DECKS</h1>
<div class="subtitle">Twin cosmic decks • Master Library • Banks A–Z</div>

<div class="glow-card">

<div class="decks-container">

<div class="deck" id="deckA">
<div class="deck-title">Deck A</div>
<div class="deck-top-row">
<div class="deck-wheel" id="wheelA"><div class="deck-wheel-marker"></div><div class="deck-wheel-texture"></div></div>
<div class="pitch-wrap"><div class="pitch-label">Pitch</div><input type="range" min="0.5" max="1.5" step="0.01" value="1" class="pitch-slider" oninput="setPitch('A',this.value)"></div>
</div>
<div class="audio-bar"><audio id="audioA" controls></audio></div>
<div class="wave-strip"><div class="wave-bar"></div></div>
<div class="transport-row">
<button onclick="playDeck('A')">Play</button>
<button onclick="stopDeck('A')">Stop</button>
<button onclick="setCue('A')">Cue</button>
<button onclick="toggleLoop('A')">Loop</button>
<button class="secondary" onclick="syncDeck('A','B')">Sync → B</button>
</div>
<div class="slider-row">
<div class="slider-block"><div class="slider-label">Volume</div><input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume('A',this.value)"></div>
<div class="slider-block"><div class="slider-label">High</div><input type="range" min="-12" max="12" step="1" value="0"></div>
<div class="slider-block"><div class="slider-label">Mid</div><input type="range" min="-12" max="12" step="1" value="0"></div>
<div class="slider-block"><div class="slider-label">Low</div><input type="range" min="-12" max="12" step="1" value="0"></div>
</div>
</div>

<div class="deck" id="deckB">
<div class="deck-title">Deck B</div>
<div class="deck-top-row">
<div class="deck-wheel" id="wheelB"><div class="deck-wheel-marker"></div><div class="deck-wheel-texture"></div></div>
<div class="pitch-wrap"><div class="pitch-label">Pitch</div><input type="range" min="0.5" max="1.5" step="0.01" value="1" class="pitch-slider" oninput="setPitch('B',this.value)"></div>
</div>
<div class="audio-bar"><audio id="audioB" controls></audio></div>
<div class="wave-strip"><div class="wave-bar"></div></div>
<div class="transport-row">
<button onclick="playDeck('B')">Play</button>
<button onclick="stopDeck('B')">Stop</button>
<button onclick="setCue('B')">Cue</button>
<button onclick="toggleLoop('B')">Loop</button>
<button class="secondary" onclick="syncDeck('B','A')">Sync → A</button>
</div>
<div class="slider-row">
<div class="slider-block"><div class="slider-label">Volume</div><input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume('B',this.value)"></div>
<div class="slider-block"><div class="slider-label">High</div><input type="range" min="-12" max="12" step="1" value="0"></div>
<div class="slider-block"><div class="slider-label">Mid</div><input type="range" min="-12" max="12" step="1" value="0"></div>
<div class="slider-block"><div class="slider-label">Low</div><input type="range" min="-12" max="12" step="1" value="0"></div>
</div>
</div>

</div>

<div class="crossfader-wrap">
<div class="crossfader-label">Crossfader</div>
<input type="range" min="0" max="1" step="0.01" value="0.5" class="crossfader" oninput="setCrossfader(this.value)">
</div>

<div class="section-title">Banks A–Z</div>
<div class="banks-grid" id="banksGrid"></div>
<div class="bank-tracks" id="bankTracks"></div>

<div class="section-title">Master Library</div>
<table class="library-table">
<thead><tr><th>#</th><th>Track</th><th>Artist</th><th>BPM</th><th>Key</th><th>Actions</th></tr></thead>
<tbody id="libraryBody"></tbody>
</table>

<div class="details-panel" id="detailsPanel">Click a track row to see full details here.</div>

<div class="footer-nav">
<span onclick="goPage('index.html')">Login</span>•
<span onclick="goPage('upload.html')">Upload</span>•
<span onclick="goPage('decks.html')">Decks</span>
</div>

</div>

<script>
let MASTER_LIBRARY=[];
const BANKS={};
let cues={A:0,B:0};
let loops={A:false,B:false};
let baseVolume={A:1,B:1};
let crossfade=0.5;

function audio(d){return document.getElementById(d==='A'?'audioA':'audioB');}
function wheel(d){return document.getElementById(d==='A'?'wheelA':'wheelB');}

function playDeck(d){audio(d).play();wheel(d).style.animationPlayState='running';}
function stopDeck(d){audio(d).pause();audio(d).currentTime=0;wheel(d).style.animationPlayState='paused';}
function setCue(d){cues[d]=audio(d).currentTime;}
function toggleLoop(d){loops[d]=!loops[d];audio(d).loop=loops[d];}

function setPitch(d,val){
const rate=parseFloat(val);
audio(d).playbackRate=rate;
wheel(d).style.animationDuration=(2.5/rate)+'s';
}

function setVolume(d,val){baseVolume[d]=parseFloat(val);applyVolumes();}
function setCrossfader(v){crossfade=parseFloat(v);applyVolumes();}
function applyVolumes(){
audio('A').volume=baseVolume.A*(1-crossfade);
audio('B').volume=baseVolume.B*crossfade;
}

function syncDeck(from,to){audio(to).currentTime=audio(from).currentTime;}

function renderLibrary(){
const body=document.getElementById('libraryBody');
body.innerHTML='';
const slots=MASTER_LIBRARY.length+1;
for(let i=0;i<slots;i++){
const tr=document.createElement('tr');tr.className='library-row';
const tdIndex=document.createElement('td');tdIndex.textContent=i+1;tr.appendChild(tdIndex);
const tdTitle=document.createElement('td');
const tdArtist=document.createElement('td');
const tdBpm=document.createElement('td');
const tdKey=document.createElement('td');
const tdActions=document.createElement('td');
const track=MASTER_LIBRARY[i];

if(track){
tdTitle.textContent=track.title;
tdArtist.textContent=track.artist;
tdBpm.textContent=track.bpm;
tdKey.textContent=track.key;

const btnA=document.createElement('button');btnA.textContent='Load A';btnA.onclick=e=>{e.stopPropagation();audio('A').src=track.file;};
const btnB=document.createElement('button');btnB.textContent='Load B';btnB.onclick=e=>{e.stopPropagation();audio('B').src=track.file;};

const sel=document.createElement('select');
const opt=document.createElement('option');opt.value='';opt.textContent='Bank…';sel.appendChild(opt);
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;sel.appendChild(o);});
sel.onchange=e=>{e.stopPropagation();addToBank(track.id,e.target.value);e.target.value='';};

tdActions.appendChild(btnA);tdActions.appendChild(btnB);tdActions.appendChild(sel);
tr.onclick=()=>showDetails(track.id);
}else{
tdTitle.textContent='— empty slot —';
tdArtist.textContent='';
tdBpm.textContent='';
tdKey.textContent='';
tdActions.textContent='';
tr.style.opacity=.5;
}

tr.appendChild(tdTitle);
tr.appendChild(tdArtist);
tr.appendChild(tdBpm);
tr.appendChild(tdKey);
tr.appendChild(tdActions);
body.appendChild(tr);
}
}

function showDetails(id){
const panel=document.getElementById('detailsPanel');
const t=MASTER_LIBRARY.find(x=>x.id===id);
if(!t){panel.textContent='Track not found.';return;}
panel.innerHTML=`
<strong>${t.title}</strong> – ${t.artist}<br>
BPM: ${t.bpm} • Key: ${t.key}<br>
Duration: ${t.duration||'—'}s<br>
Genre: ${t.genre||'—'}<br>
Album: ${t.album||'—'} (${t.year||'—'})<br>
Comments: ${t.comments||'—'}<br><br>
<button onclick="audio('A').src='${t.file}'">Load A</button>
<button onclick="audio('B').src='${t.file}'">Load B</button>
`;
}

function renderBanks(){
const grid=document.getElementById('banksGrid');
grid.innerHTML='';
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l=>{
const b=document.createElement('button');
b.className='bank-btn';
b.textContent=l;
b.onclick=()=>showBank(l);
grid.appendChild(b);
});
}

function addToBank(id,l){
if(!BANKS[l])BANKS[l]=[];
const t=MASTER_LIBRARY.find(x=>x.id===id);
if(t)BANKS[l].push(t);
showBank(l);
}

function showBank(l){
const box=document.getElementById('bankTracks');
box.innerHTML=`<div>Bank ${l}</div>`;
(BANKS[l]||[]).forEach(t=>{
const r=document.createElement('div');
r.className='bank-track-item';
r.innerHTML=`
<div><strong>${t.title}</strong> – ${t.artist}</div>
<div>
<button onclick="audio('A').src='${t.file}'">Load A</button>
<button onclick="audio('B').src='${t.file}'">Load B</button>
</div>`;
box.appendChild(r);
});
}

function goPage(p){window.location.href=p;}

renderLibrary();
renderBanks();
applyVolumes();
</script>

</body>
</html>
``
