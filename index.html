<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Access</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
margin:0;
padding:20px;
background:radial-gradient(circle at top,#0b1120 0%,#020617 40%,#000 100%);
color:#e5e7eb;
font-family:system-ui,sans-serif;
display:flex;
flex-direction:column;
align-items:center;
gap:24px;
}

h1 {
font-size:2rem;
letter-spacing:0.15em;
text-transform:uppercase;
color:#38bdf8;
text-shadow:0 0 16px #0ea5e9;
}

.glow-card {
width:100%;
max-width:600px;
background:rgba(15,23,42,0.9);
border-radius:14px;
padding:20px;

0 0 25px rgba(56,189,248,0.35),

}

button {
padding:10px 20px;
border-radius:999px;
border:none;
font-size:0.8rem;

text-transform:uppercase;
cursor:pointer;
background:linear-gradient(90deg,#22c55e,#06b6d4);
color:#020617;

}

input {

padding:6px 8px;
margin-top:4px;
border-radius:6px;
border:1px solid #1f2937;
background:#020617;
color:#e5e7eb;
}

.hidden {
display:none;
}

nav {
text-align:center;
}

nav a {
color:#38bdf8;
text-decoration:none;
}

/* Artist Profile starts locked */
#navProfile {
opacity:0.4;
pointer-events:none;
}

/* Artist Profile becomes available after login */
#navProfile.active {
opacity:1;
pointer-events:auto;
}

</style>
</head>

<body>


<!-- =====================================================

>

<h2>Create Account</h2>

<label>Email</label>

<input
  id="regEmail"
  type="email"
>

<input
  id="regPassword"
  type="password"
>

<button id="registerBtn">
  Create Account

<!-- =====================================================

===================================================== -->

<nav>

<a
  id="navUpload"

>
  GLCTC1 MUSIC
</a>

|

>
  👤 ARTIST PROFILE

<!-- =====================================================

>


<!-- =====================================================
     GLCTC1 CLOTHING
===================================================== -->

===================================================== -->

<section
  style="
    width:100vw;
    height:100vh;

    margin-left:calc(50% - 50vw);
    margin-top:30px;

    position:relative;

    background:#000;
  "
>

  <iframe
    src="https://glctc1.com/"

      width:100%;

      border:none;

  ></iframe>

<!-- =====================================================
     GLCTC1 CLOTHING LINK — BELOW WEBSITE
===================================================== -->

<div
  style="
    width:100vw;

    margin-left:calc(50% - 50vw);

    padding:35px 20px;

    text-align:center;

    background:
      radial-gradient(
        circle at center,
        #172554,
        #020617 55%,
        #000
      );

    border-top:
      1px solid rgba(56,189,248,0.4);

    border-bottom:
      1px solid rgba(56,189,248,0.4);

    box-shadow:
      0 0 30px rgba(56,189,248,0.25);
  "
>

  <a
    href="https://glctc1.com/"
    target="_blank"
    rel="noopener noreferrer"

    style="
      display:inline-block;

      padding:14px 30px;

      border-radius:999px;

      text-decoration:none;

      font-weight:800;

      letter-spacing:0.08em;

      text-transform:uppercase;

      color:#020617;

      background:
        linear-gradient(
          90deg,
          #22c55e,
          #06b6d4
        );

      box-shadow:
        0 0 15px rgba(6,182,212,0.5),
        0 0 35px rgba(56,189,248,0.3);
    "
  >
    🌌 ENTER GLCTC1 CLOTHING
  </a>

</div>


<script>

// =====================================================
// SUPABASE
// =====================================================
// =====================================================

const supabaseUrl =
"https://zdlaloiruxamxsduxqxw.supabase.co";


const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbGFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQ";


const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);


// =====================================================
// SHOW LOGIN
// =====================================================

showLogin.onclick = () => {

  loginForm.classList.remove("hidden");

  registerForm.classList.add("hidden");

};


// =====================================================
// SHOW REGISTER
// =====================================================

showRegister.onclick = () => {

  registerForm.classList.remove("hidden");

  loginForm.classList.add("hidden");

};


// =====================================================
// NAVIGATION
// =====================================================

function unlockNav() {

  navProfile.classList.add("active");

}


function lockNav() {

  navProfile.classList.remove("active");

}


// =====================================================
// LOGIN
// =====================================================

loginBtn.onclick = async () => {

  const email =
    loginEmail.value.trim();

  const password =
    loginPassword.value.trim();


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email,
      password

    });


  if (error) {

    loginStatus.textContent =
      error.message;

    return;

  }


  unlockNav();


  window.location.href =
    "upload.html";

};


// =====================================================
// REGISTER
// =====================================================

registerBtn.onclick = async () => {

  const email =
    regEmail.value.trim();

  const password =
    regPassword.value.trim();


  regStatus.textContent =
    "Creating account...";


  let { error } =
    await supabaseClient.auth.signUp({

      email,
      password,

      options: {
        emailRedirectTo: null
      }

    });


  if (error) {

    regStatus.textContent =
      "Account exists — logging in...";

  }


  const {
    error: loginError
  } =
    await supabaseClient.auth.signInWithPassword({

      email,
      password

    });


  if (loginError) {

    regStatus.textContent =
      loginError.message;

    return;

  }


  unlockNav();


  window.location.href =
    "upload.html";

};


// =====================================================
// LOGOUT
// =====================================================

logoutBtn.onclick = async () => {

  await supabaseClient.auth.signOut();


  lockNav();


  window.location.href =
    "index.html";

};


// =====================================================
// CHECK LOGIN
// =====================================================

(async () => {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if (session) {

    unlockNav();

  } else {

    lockNav();

  }

})();

</script>


</body>
</html>
