<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Cosmic 1200 Decks</title>

<style>
@keyframes spinWheel {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes waveMove {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
  color: #e5e7eb;
  font-family: system-ui, sans-serif;
}
h1 {
  text-align: center;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #38bdf8;
}
h2 {
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #a5b4fc;
}
.glow-card {
  max-width: 1200px;
  margin: 20px auto;
  padding: 24px;
  border-radius: 14px;
  background: rgba(15,23,42,0.9);
  border: 1px solid rgba(56,189,248,0.5);
}

/* Decks */
.deck-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 32px;
}
.deck {
  background: rgba(2,6,23,0.9);
  border-radius: 16px;
  padding: 20px;
}
.deck h3 {
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #38bdf8;
}

/* Wheels + pitch */
.deck-wheel-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
}
.deck-wheel {
  width: 220px;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  background: radial-gradient(circle at center, #0f172a 0%, #020617 40%, #000 100%);
  border: 6px solid #38bdf8;
  box-shadow: 0 0 30px rgba(56,189,248,0.8);
  position: relative;
  transform-origin: center center;
  animation-name: spinWheel;
  animation-duration: 2.5s;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  animation-play-state: paused;
}
.deck-wheel-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 70px;
  height: 70px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, #38bdf8, #0ea5e9);
}
.pitch-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 0.75rem;
  text-transform: uppercase;
  color: #38bdf8;
}
.pitch-slider {
  -webkit-appearance: slider-vertical;
  writing-mode: bt-lr;
  width: 20px;
  height: 180px;
}

/* Waveform */
.wave-strip {
  width: 100%;
  height: 40px;
  margin-top: 16px;
  border-radius: 10px;
  background: rgba(56,189,248,0.15);
  overflow: hidden;
  position: relative;
}
.wave-bar {
  position: absolute;
  width: 200%;
  height: 100%;
  background-image: linear-gradient(135deg,
    rgba(56,189,248,0.6),
    rgba(129,140,248,0.6),
    rgba(236,72,153,0.6),
    rgba(34,197,94,0.6));
  opacity: 0.5;
  animation: waveMove 10s linear infinite;
}

/* Transport + sliders */
.transport-row {
  margin-top: 12px;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
button {
  padding: 6px 12px;
  border-radius: 999px;
  border: none;
  font-size: 0.75rem;
  text-transform: uppercase;
  cursor: pointer;
  background: linear-gradient(90deg, #22c55e, #06b6d4);
  color: #020617;
}
button.secondary {
  background: linear-gradient(90deg, #6366f1, #ec4899);
  color: #fff;
}
.slider-wrap {
  margin-top: 12px;
  text-align: center;
  font-size: 0.75rem;
}
.slider-wrap input {
  width: 80%;
}

/* EQ + FX */
.eq-row, .fx-row {
  margin-top: 12px;
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}
.eq-knob {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 0.7rem;
  text-transform: uppercase;
  color: #9ca3af;
}
.eq-knob input {
  width: 140px;
}

/* Crossfader */
.crossfader-wrap {
  margin-top: 24px;
  text-align: center;
}
.crossfader-labels {
  display: flex;
  justify-content: space-between;
  max-width: 400px;
  margin: 0 auto 6px;
  font-size: 0.75rem;
}
.crossfader {
  width: 100%;
}

/* Library + banks */
.library-list {
  margin-top: 20px;
  background: rgba(2,6,23,0.8);
  padding: 12px;
  border-radius: 10px;
}
.library-item,
.bank-track-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid rgba(31,41,55,0.8);
  font-size: 0.8rem;
}
.library-item:last-child,
.bank-track-item:last-child {
  border-bottom: none;
}
.banks-grid {
  display: grid;
  grid-template-columns: repeat(13, minmax(0,1fr));
  gap: 4px;
  margin-top: 8px;
}
.bank-btn {
  padding: 4px 0;
  border-radius: 999px;
  border: 1px solid #38bdf8;
  background: radial-gradient(circle, #38bdf8 0%, #020617 80%);
  color: #020617;
  font-size: 0.7rem;
  cursor: pointer;
}

/* Nav */
nav {
  margin-top: 16px;
  text-align: center;
  font-size: 0.8rem;
}
nav a {
  color: #38bdf8;
  text-decoration: none;
  margin: 0 6px;
}
nav a:hover { text-decoration: underline; }
</style>
</head>

<body>
<h1>GLCTC1 – Cosmic 1200 Decks</h1>

<div class="glow-card">
  <h2>Cosmic 1200 Twin Decks</h2>

  <div class="deck-grid">

    <!-- Deck A -->
    <div class="deck" id="deckA">
      <h3>Deck A</h3>

      <div class="deck-wheel-wrap">
        <div class="deck-wheel" id="deckAWheel">
          <div class="deck-wheel-inner"></div>
        </div>
        <div class="pitch-wrap">
          <span>Pitch</span>
          <input type="range" min="0.5" max="1.5" step="0.01"
                 class="pitch-slider" value="1"
                 oninput="setPitch('A', this.value)">
        </div>
      </div>

      <audio id="deckAAudio" controls style="margin-top:10px; width:100%;"></audio>

      <div class="wave-strip"><div class="wave-bar"></div></div>

      <div class="transport-row">
        <button onclick="playDeck('A')">Play</button>
        <button onclick="stopDeck('A')">Stop</button>
        <button onclick="setCue('A')">Cue</button>
        <button onclick="loopDeck('A')">Loop</button>
        <button class="secondary" onclick="syncDeck('A','B')">Sync → B</button>
      </div>

      <div class="slider-wrap">
        <span>Volume</span><br>
        <input type="range" min="0" max="1" step="0.01"
               value="1" oninput="setVolume('A', this.value)">
      </div>

      <div class="eq-row">
        <div class="eq-knob">
          <span>High</span>
          <input type="range" min="0" max="2" step="0.01"
                 value="1" oninput="setEQ('A','high',this.value)">
        </div>
        <div class="eq-knob">
          <span>Low</span>
          <input type="range" min="0" max="2" step="0.01"
                 value="1" oninput="setEQ('A','low',this.value)">
        </div>
      </div>

      <div class="fx-row">
        <div class="eq-knob">
          <span>Filter</span>
          <input type="range" min="0" max="1" step="0.01"
                 value="0" oninput="setFilter('A',this.value)">
        </div>
        <div class="eq-knob">
          <span>Delay</span>
          <input type="range" min="0" max="1" step="0.01"
                 value="0" oninput="setDelay('A',this.value)">
        </div>
      </div>
    </div>

    <!-- Deck B -->
    <div class="deck" id="deckB">
      <h3>Deck B</h3>

      <div class="deck-wheel-wrap">
        <div class="deck-wheel" id="deckBWheel">
          <div class="deck-wheel-inner"></div>
        </div>
        <div class="pitch-wrap">
          <span>Pitch</span>
          <input type="range" min="0.5" max="1.5" step="0.01"
                 class="pitch-slider" value="1"
                 oninput="setPitch('B', this.value)">
        </div>
      </div>

      <audio id="deckBAudio" controls style="margin-top:10px; width:100%;"></audio>

      <div class="wave-strip"><div class="wave-bar"></div></div>

      <div class="transport-row">
        <button onclick="playDeck('B')">Play</button>
        <button onclick="stopDeck('B')">Stop</button>
        <button onclick="setCue('B')">Cue</button>
        <button onclick="loopDeck('B')">Loop</button>
        <button class="secondary" onclick="syncDeck('B','A')">Sync → A</button>
      </div>

      <div class="slider-wrap">
        <span>Volume</span><br>
        <input type="range" min="0" max="1" step="0.01"
               value="1" oninput="setVolume('B', this.value)">
      </div>

      <div class="eq-row">
        <div class="eq-knob">
          <span>High</span>
          <input type="range" min="0" max="2" step="0.01"
                 value="1" oninput="setEQ('B','high',this.value)">
        </div>
        <div class="eq-knob">
          <span>Low</span>
          <input type="range" min="0" max="2" step="0.01"
                 value="1" oninput="setEQ('B','low',this.value)">
        </div>
      </div>

      <div class="fx-row">
        <div class="eq-knob">
          <span>Filter</span>
          <input type="range" min="0" max="1" step="0.01"
                 value="0" oninput="setFilter('B',this.value)">
        </div>
        <div class="eq-knob">
          <span>Delay</span>
          <input type="range" min="0" max="1" step="0.01"
                 value="0" oninput="setDelay('B',this.value)">
        </div>
      </div>
    </div>

  </div>

  <!-- Crossfader -->
  <div class="crossfader-wrap">
    <div class="crossfader-labels">
      <span>Deck A</span><span>Crossfader</span><span>Deck B</span>
    </div>
    <input type="range" min="0" max="1" step="0.01"
           class="crossfader" value="0.5"
           oninput="setCrossfader(this.value)">
  </div>

  <!-- Banks -->
  <div class="library-list" id="banks">
    <h2>Banks A–Z</h2>
    <div class="banks-grid" id="banksGrid"></div>
    <div id="bankTracks"></div>
  </div>

  <!-- Master Library -->
  <div class="library-list">
    <h2>Master Library</h2>
    <div id="masterLibrary"></div>
  </div>

  <nav>
    <a href="index.html">Login</a> |
    <a href="upload.html">Upload</a> |
    <a href="decks.html">Decks</a>
  </nav>
</div>

<script>
// Master library
const MASTER_LIBRARY = [
  { id: 'GLCTC1-001', title: 'Cosmic Dawn', artist: 'Leyton', file: 'tracks/cosmic-dawn.mp3' },
  { id: 'GLCTC1-002', title: 'Neon Temple', artist: 'Leyton', file: 'tracks/neon-temple.mp3' }
];

const BANKS = {};
let cues = { A: 0, B: 0 };
let loops = { A: false, B: false };

// Audio + wheel helpers
function getAudio(deck) {
  return document.getElementById(deck === 'A' ? 'deckAAudio' : 'deckBAudio');
}
function getWheel(deck) {
  return document.getElementById(deck === 'A' ? 'deckAWheel' : 'deckBWheel');
}

// Spin linked to pitch
function updateWheelSpeed(deck, pitchValue) {
  const wheel = getWheel(deck);
  const p = parseFloat(pitchValue);
  const base = 2.5;
  wheel.style.animationDuration = (base / p) + 's';
}

// Deck control
function loadDeck(deck, file) {
  const audio = getAudio(deck);
  audio.src = file;
  audio.load();
}
function playDeck(deck) {
  const audio = getAudio(deck);
  const wheel = getWheel(deck);
  audio.play();
  wheel.style.animationPlayState = 'running';
}
function stopDeck(deck) {
  const audio = getAudio(deck);
  const wheel = getWheel(deck);
  audio.pause();
  audio.currentTime = 0;
  wheel.style.animationPlayState = 'paused';
}
function setCue(deck) {
  const audio = getAudio(deck);
  cues[deck] = audio.currentTime;
}
function loopDeck(deck) {
  const audio = getAudio(deck);
  loops[deck] = !loops[deck];
  audio.loop = loops[deck];
}
function syncDeck(from, to) {
  const aFrom = getAudio(from);
  const aTo = getAudio(to);
  aTo.currentTime = aFrom.currentTime;
  aTo.playbackRate = aFrom.playbackRate;
  updateWheelSpeed(to, aFrom.playbackRate);
}

// Pitch
function setPitch(deck, value) {
  const audio = getAudio(deck);
  const p = parseFloat(value);
  audio.playbackRate = p;
  updateWheelSpeed(deck, p);
}

// Volume
function setVolume(deck, value) {
  const audio = getAudio(deck);
  audio.volume = parseFloat(value);
}

// Crossfader
function setCrossfader(value) {
  const a = getAudio('A');
  const b = getAudio('B');
  const v = parseFloat(value);
  a.volume = 1 - v;
  b.volume = v;
}

// Simple EQ (gain)
const eqState = {
  A: { high: 1, low: 1 },
  B: { high: 1, low: 1 }
};
function setEQ(deck, band, value) {
  eqState[deck][band] = parseFloat(value);
  // Placeholder: real EQ would use Web Audio; here we just store values.
}

// Simple FX (filter + delay placeholders)
const fxState = {
  A: { filter: 0, delay: 0 },
  B: { filter: 0, delay: 0 }
};
function setFilter(deck, value) {
  fxState[deck].filter = parseFloat(value);
}
function setDelay(deck, value) {
  fxState[deck].delay = parseFloat(value);
}

// Master library render
function renderMasterLibrary() {
  const container = document.getElementById('masterLibrary');
  container.innerHTML = '';
  MASTER_LIBRARY.forEach(track => {
    const div = document.createElement('div');
    div.className = 'library-item';
    div.innerHTML = `
      <div><strong>${track.title}</strong> – ${track.artist}</div>
      <div>
        <select onchange="addToBank('${track.id}', this.value)">
          <option value="">Bank…</option>
          ${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => `<option value="${l}">${l}</option>`).join('')}
        </select>
        <button onclick="loadDeck('A','${track.file}')">Load A</button>
        <button onclick="loadDeck('B','${track.file}')">Load B</button>
      </div>
    `;
    container.appendChild(div);
  });
}

// Banks grid
function renderBanksGrid() {
  const grid = document.getElementById('banksGrid');
  grid.innerHTML = '';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'bank-btn';
    btn.textContent = letter;
    btn.onclick = () => selectBank(letter);
    grid.appendChild(btn);
  });
}

function addToBank(trackId, bankLetter) {
  if (!bankLetter) return;
  const track = MASTER_LIBRARY.find(t => t.id === trackId);
  if (!track) return;
  if (!BANKS[bankLetter]) BANKS[bankLetter] = [];
  BANKS[bankLetter].push({ ...track });
  renderBank(bankLetter);
}

function renderBank(bankLetter) {
  const container = document.getElementById('bankTracks');
  container.innerHTML = '';
  const tracks = BANKS[bankLetter] || [];
  const header = document.createElement('h2');
  header.textContent = `Bank ${bankLetter}`;
  container.appendChild(header);
  if (!tracks.length) {
    const empty = document.createElement('div');
    empty.textContent = 'No tracks in this bank yet.';
    empty.style.fontSize = '0.8rem';
    container.appendChild(empty);
    return;
  }
  tracks.forEach(track => {
    const div = document.createElement('div');
    div.className = 'bank-track-item';
    div.innerHTML = `
      <div><strong>${track.title}</strong> – ${track.artist}</div>
      <div>
        <button onclick="loadDeck('A','${track.file}')">Load A</button>
        <button onclick="loadDeck('B','${track.file}')">Load B</button>
      </div>
    `;
    container.appendChild(div);
  });
}

function selectBank(letter) {
  renderBank(letter);
}

// Init
renderMasterLibrary();
renderBanksGrid();
</script>
</body>
</html>
