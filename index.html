<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Access</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  padding:20px;
  background:radial-gradient(circle at top,#0b1120 0%,#020617 40%,#000 100%);
  color:#e5e7eb;
  font-family:system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
}
h1 {
  font-size:2rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:#38bdf8;
  text-shadow:0 0 16px #0ea5e9;
}
.glow-card {
  width:100%;
  max-width:600px;
  background:rgba(15,23,42,0.9);
  border-radius:14px;
  padding:20px;
  box-shadow:0 0 25px rgba(56,189,248,0.35),
              0 0 60px rgba(129,140,248,0.35);
  border:1px solid rgba(56,189,248,0.5);
}
button {
  padding:10px 20px;
  border-radius:999px;
  border:none;
  font-size:0.8rem;
  font-weight:600;
  text-transform:uppercase;
  cursor:pointer;
  background:linear-gradient(90deg,#22c55e,#06b6d4);
  color:#020617;
  margin-top:10px;
}
input {
  width:100%;
  padding:6px 8px;
  margin-top:4px;
  border-radius:6px;
  border:1px solid #1f2937;
  background:#020617;
  color:#e5e7eb;
}
nav a {
  color:#38bdf8;
  opacity:0.4;
  pointer-events:none;
}
nav a.active {
  opacity:1;
  pointer-events:auto;
}
</style>
</head>

<body>

<h1>GLCTC1 Cosmic 1200 Decks</h1>

<div class="glow-card">
  <h2>Access GLCTC1 Studio</h2>
  <p>Enter your email to receive a login link.</p>

  <label>Email</label>
  <input id="email" type="email">

  <button id="magicBtn">Send Login Link</button>

  <div id="status"></div>
</div>

<nav>
  <a id="navLogin" href="index.html">Access</a> |
  <a id="navUpload" href="upload.html">Upload</a> |
  <a id="navDecks" href="decks.html">Decks</a>
</nav>

<script>
// ⭐ REAL SUPABASE KEYS
const supabaseUrl = "https://zdlaloiruxamxsduxqxw.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbGFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQ"; // paste your anon key here
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

// ⭐ Unlock nav
function unlockNav() {
  navUpload.classList.add("active");
  navDecks.classList.add("active");
}
function lockNav() {
  navUpload.classList.remove("active");
  navDecks.classList.remove("active");
}

// ⭐ MAGIC LINK LOGIN
magicBtn.onclick = async () => {
  const emailValue = email.value.trim();

  status.textContent = "Sending login link...";

  const { error } = await supabaseClient.auth.signInWithOtp({
    email: emailValue,
    options: {
      emailRedirectTo: window.location.origin + "/upload.html"
    }
  });

  if (error) {
    status.textContent = error.message;
    return;
  }

  status.textContent = "Check your email for your login link.";
};

// ⭐ AUTO CHECK LOGIN
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) unlockNav();
  else lockNav();
})();
</script>

</body>
</html>
