<style>

  margin:0;
  padding:20px;
  background:radial-gradient(circle at top,#0b1120 0%,#020617 40%,#000 100%);
  color:#e5e7eb;
  font-family:system-ui,sans-serif;

  flex-direction:column;
  align-items:center;

}
h1 {
  font-size:2rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:#38bdf8;
  text-shadow:0 0 16px #0ea5e9;

  width:100%;
  max-width:700px;
  background:rgba(15,23,42,0.9);
  border-radius:14px;

  box-shadow:0 0 25px rgba(56,189,248,0.35),

  background:#020617;
  color:#e5e7eb;
}
button {
  padding:10px 20px;
  border-radius:999px;
  border:none;
  font-size:0.8rem;
  font-weight:600;
  text-transform:uppercase;
  cursor:pointer;
  background:linear-gradient(90deg,#22c55e,#06b6d4);
  color:#020617;

  color:#38bdf8;
  opacity:0.4;

  opacity:1;
  pointer-events:auto;
}

<body>

<h1>Upload Master Audio</h1>

<div class="glow-card">

  <p>
    Upload your master audio and metadata below.<br>
    <label>
      <input type="checkbox" id="rightsConfirm">
      I confirm I own the rights to upload this audio.
    </label>
  </p>

  <!-- MASTER AUDIO -->
  <label>Master Audio File</label>
  <input id="masterAudio" type="file" accept="audio/*">

  <!-- AUTO-FILLED METADATA -->
  <label>Track Title</label>
  <input id="trackTitle" type="text">

  <label>Artist</label>
  <input id="artist" type="text">

  <label>Album</label>
  <input id="album" type="text">

  <label>Genre</label>
  <input id="genre" type="text">

  <!-- CHAKRA DROPDOWN -->
  <label>Chakra</label>
  <select id="chakra">
    <option value="">Select Chakra</option>
    <option value="Root">Root</option>
    <option value="Sacral">Sacral</option>
    <option value="Solar Plexus">Solar Plexus</option>
    <option value="Heart">Heart</option>
    <option value="Throat">Throat</option>
    <option value="Third Eye">Third Eye</option>
    <option value="Crown">Crown</option>
  </select>

  <label>Frequency (Hz)</label>
  <input id="frequency" type="text">

  <label>BPM</label>
  <input id="bpm" type="text">

  <label>Musical Key</label>
  <input id="key" type="text">

  <label>Notes</label>
  <textarea id="notes" rows="4"></textarea>

  <button id="addTrackBtn">Add Track to Library</button>

</div>

<nav>
  <a id="navLogin" href="index.html">Access</a> |
  <a id="navUpload" href="upload.html">Upload</a> |
  <a id="navDecks" href="decks.html">Decks</a>
</nav>

<script>
// ⭐ SUPABASE

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

// ⭐ AUTO-SCAN METADATA WHEN MASTER AUDIO IS UPLOADED
document.querySelector("#masterAudio").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const metadata = await musicMetadata.parseBlob(file);

    document.querySelector("#trackTitle").value =
      metadata.common.title || file.name.replace(/\.[^/.]+$/, "");

    document.querySelector("#artist").value =
      metadata.common.artist || "";

    document.querySelector("#album").value =
      metadata.common.album || "";

    document.querySelector("#genre").value =
      metadata.common.genre ? metadata.common.genre[0] : "";

    document.querySelector("#frequency").value =
      metadata.format.sampleRate || "";

    document.querySelector("#bpm").value =
      metadata.common.bpm || "";

    document.querySelector("#key").value =
      metadata.common.key || "";

    document.querySelector("#notes").value =
      metadata.common.comment ? metadata.common.comment.join(", ") : "";

    console.log("Metadata scanned successfully.");

  } catch (err) {
    console.error("Metadata scan failed:", err.message);
  }
});

// ⭐ ADD TRACK TO LIBRARY
addTrackBtn.onclick = async () => {
  const rights = document.getElementById("rightsConfirm").checked;
  if (!rights) {
    alert("Please confirm you own the rights to upload this audio.");
    return;
  }

  const file = document.querySelector("#masterAudio").files[0];
  if (!file) {
    alert("Please select a master audio file.");
    return;
  }

  // Upload audio file
  const { data, error } = await supabaseClient.storage
    .from("tracks")
    .upload(`audio/${file.name}`, file, { upsert: true });

  if (error) {
    alert("Upload failed: " + error.message);
    return;
  }

  // Upload metadata
  const metadata = {
    track_title: trackTitle.value,
    artist: artist.value,
    album: album.value,
    genre: genre.value,
    chakra: chakra.value,
    frequency: frequency.value,
    bpm: bpm.value,
    key: key.value,
    notes: notes.value,
    file_path: data.path
  };

  const { error: insertError } = await supabaseClient
    .from("tracks")
    .insert([metadata]);

  if (insertError) {
    alert("Metadata save failed: " + insertError.message);
    return;
  }

  alert("Track added to library!");
};

// ⭐ NAV LOCK/UNLOCK
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    navUpload.classList.add("active");
    navDecks.classList.add("active");
  }
})();
</script>

</body>
