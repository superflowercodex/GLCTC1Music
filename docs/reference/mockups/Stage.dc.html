<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GLCTC1 Studio Stage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070b1c}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.hov{transition:background .2s,transform .2s}
.hov:hover{background:rgba(255,255,255,.1)!important}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3%,-2%) scale(1.06)}}
.neb{animation:drift 14s ease-in-out infinite}
</style>
</helmet>
<div style="position:relative;min-height:900px;display:flex;flex-wrap:wrap;background:radial-gradient(900px 520px at 50% -10%,rgba(142,124,255,.3),transparent 70%),radial-gradient(800px 500px at 100% 80%,rgba(255,99,216,.16),transparent 70%),#070b1c;color:#eef2ff;font-family:Manrope,system-ui,sans-serif;font-size:16px;overflow:hidden">

<nav aria-label="Rooms" style="flex:0 0 auto;width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0">
<div style="width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#79ebff,#8e7cff 55%,#ff63d8);display:flex;align-items:center;justify-content:center;font-family:'Tenor Sans',serif;font-size:22px;color:#0b1020;margin-bottom:14px">G</div>
<a href="Main.dc.html" class="hov" aria-label="Arrange" style="width:68px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h7"/></svg><span style="font-size:15px;font-weight:600">Arrange</span></a>
<a href="Hub.dc.html" class="hov" aria-label="Instruments" style="width:68px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span style="font-size:15px;font-weight:600">Play</span></a>
<a href="Mixer.dc.html" class="hov" aria-label="Mix" style="width:68px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M12 4v16M17 4v16"/><circle cx="7" cy="15" r="2" fill="#070b1c"/><circle cx="12" cy="8" r="2" fill="#070b1c"/><circle cx="17" cy="13" r="2" fill="#070b1c"/></svg><span style="font-size:15px;font-weight:600">Mix</span></a>
<a href="Song.dc.html" class="hov" aria-label="Song" style="width:68px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17V5l10-2v12"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="15" r="2"/></svg><span style="font-size:15px;font-weight:600">Song</span></a>
<a href="Stage.dc.html" class="hov" aria-label="Stage" style="width:68px;padding:10px 0;border-radius:18px;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:4px;color:#79ebff"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg><span style="font-size:15px;font-weight:600">Stage</span></a>
<a href="Library.dc.html" class="hov" aria-label="Library" style="width:68px;padding:10px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#b9c3e6"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span style="font-size:15px;font-weight:600">Library</span></a>
</nav>

<main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;padding:18px 32px 24px 6px;gap:20px">

<header style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px">
<div style="flex:1 1 280px">
<div style="font-size:15px;color:#a9b4d6;font-weight:600;letter-spacing:.04em">Cosmic Lift · visuals follow the playhead</div>
<div style="font-family:'Tenor Sans',serif;font-size:44px;line-height:1.1;margin-top:4px">Stage</div>
</div>
<div style="display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(20,28,64,.6);box-shadow:0 0 0 1px rgba(255,255,255,.1)">
<button onClick="{{setWide}}" style="{{wideBtn}}">Widescreen</button>
<button onClick="{{setPhone}}" style="{{phoneBtn}}">Phone</button>
</div>
<button class="hov" style="height:52px;padding:0 24px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#eef2ff;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fullscreen</button>
</header>

<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:stretch;flex:1">

<section aria-label="Preview" style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px">
<div style="position:relative;flex:1;min-height:420px;border-radius:30px;background:rgba(0,0,0,.35);box-shadow:0 0 0 1px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:26px">
<div class="neb" style="position:absolute;left:10%;top:6%;width:60%;height:70%;border-radius:50%;background:radial-gradient(circle,rgba(142,124,255,.35),transparent 70%);filter:blur(30px)"></div>
<div style="{{frame}}">
<div class="neb" style="position:absolute;left:-10%;top:-10%;width:90%;height:90%;border-radius:50%;background:radial-gradient(circle,rgba(255,99,216,.7),transparent 65%)"></div>
<div class="neb" style="position:absolute;right:-15%;bottom:-15%;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(121,235,255,.65),transparent 65%);animation-delay:-6s"></div>
<div style="position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:radial-gradient(circle,rgba(255,211,106,.6),transparent 65%)"></div>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px"><div style="font-family:'Tenor Sans',serif;font-size:{{titleSize}}px;letter-spacing:.12em;text-shadow:0 0 40px rgba(0,0,0,.4)">GLCTC1</div><div style="font-size:16px;letter-spacing:.3em;opacity:.85">COSMIC LIFT</div></div>
</div>
</div>

<div style="display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:999px;background:rgba(20,28,64,.62);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 0 0 1px rgba(255,255,255,.12)">
<button aria-label="Play preview" style="width:52px;height:52px;border:0;border-radius:50%;background:linear-gradient(135deg,#79ebff,#8e7cff 60%,#ff63d8);color:#0b1020;display:flex;align-items:center;justify-content:center;box-shadow:0 0 28px rgba(142,124,255,.5)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg></button>
<span style="font-family:'DM Mono',monospace;font-size:18px">00:14</span>
<div style="flex:1;position:relative;height:8px;border-radius:8px;background:rgba(255,255,255,.12)"><div style="width:34%;height:8px;border-radius:8px;background:linear-gradient(90deg,#79ebff,#ff63d8)"></div><div style="position:absolute;left:calc(34% - 11px);top:-7px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(121,235,255,.8)"></div></div>
<span style="font-family:'DM Mono',monospace;font-size:18px;color:#a9b4d6">00:42</span>
</div>

<div style="display:flex;gap:12px;overflow:auto;padding:2px">
<sc-for list="{{clips}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.onPick}}" style="{{c.box}}">
<span style="{{c.art}}"></span>
<span style="display:block;padding:10px 14px 12px;text-align:left"><span style="display:block;font-size:16px;font-weight:600">{{c.name}}</span><span style="display:block;font-family:'DM Mono',monospace;font-size:15px;color:#a9b4d6;margin-top:2px">{{c.meta}}</span></span>
</button>
</sc-for>
<button class="hov" style="flex:0 0 120px;border:0;border-radius:22px;background:rgba(255,255,255,.06);color:#c8d1ee;font-size:16px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><span style="font-size:26px;line-height:1">+</span>Add</button>
</div>
</section>

<aside aria-label="Clip" style="flex:0 0 320px;display:flex;flex-direction:column;gap:18px;padding:22px;border-radius:28px;background:rgba(20,28,64,.62);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 0 0 1px rgba(255,255,255,.12)">
<div>
<div style="font-size:15px;color:#a9b4d6;font-weight:600">Selected</div>
<div style="font-family:'Tenor Sans',serif;font-size:26px;margin-top:4px">{{cur.name}}</div>
<div style="font-family:'DM Mono',monospace;font-size:15px;color:#a9b4d6;margin-top:4px">{{cur.meta}}</div>
</div>
<div>
<div style="font-size:15px;color:#a9b4d6;font-weight:600;margin-bottom:8px">Fit</div>
<div style="display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.06)">
<button style="flex:1;height:42px;border:0;border-radius:999px;background:linear-gradient(135deg,#79ebff,#8e7cff 70%);color:#0b1020;font-size:16px;font-weight:700">Fill</button>
<button class="hov" style="flex:1;height:42px;border:0;border-radius:999px;background:transparent;color:#d8dff6;font-size:16px;font-weight:600">Fit</button>
<button class="hov" style="flex:1;height:42px;border:0;border-radius:999px;background:transparent;color:#d8dff6;font-size:16px;font-weight:600">Stretch</button>
</div>
</div>
<div><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:600"><span>Opacity</span><span style="font-family:'DM Mono',monospace;font-weight:400;color:#a9b4d6">100%</span></div><div style="position:relative;height:10px;border-radius:10px;background:rgba(255,255,255,.12);margin-top:12px"><div style="width:100%;height:10px;border-radius:10px;background:linear-gradient(90deg,#79ebff,#8e7cff)"></div><div style="position:absolute;right:-2px;top:-6px;width:22px;height:22px;border-radius:50%;background:#fff"></div></div></div>
<div><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:600"><span>Speed</span><span style="font-family:'DM Mono',monospace;font-weight:400;color:#a9b4d6">1.0×</span></div><div style="position:relative;height:10px;border-radius:10px;background:rgba(255,255,255,.12);margin-top:12px"><div style="width:50%;height:10px;border-radius:10px;background:linear-gradient(90deg,#79ebff,#8e7cff)"></div><div style="position:absolute;left:calc(50% - 11px);top:-6px;width:22px;height:22px;border-radius:50%;background:#fff"></div></div></div>
<div><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:600"><span>Show for</span><span style="font-family:'DM Mono',monospace;font-weight:400;color:#a9b4d6">8 bars</span></div><div style="position:relative;height:10px;border-radius:10px;background:rgba(255,255,255,.12);margin-top:12px"><div style="width:60%;height:10px;border-radius:10px;background:linear-gradient(90deg,#79ebff,#8e7cff)"></div><div style="position:absolute;left:calc(60% - 11px);top:-6px;width:22px;height:22px;border-radius:50%;background:#fff"></div></div></div>
<div style="margin-top:auto;font-size:15px;color:#a9b4d6;line-height:1.45">Pictures stay on screen for as long as their clip lasts on the timeline.</div>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { phone: false, sel: 0 };

  renderVals() {
    const S = this.state;
    const tab = (on) => 'height:44px;padding:0 24px;border:0;border-radius:999px;font-size:16px;font-weight:' + (on ? 700 : 600) + ';color:' + (on ? '#0b1020' : '#d8dff6') + ';background:' + (on ? 'linear-gradient(135deg,#79ebff,#8e7cff 70%)' : 'transparent');
    const base = 'position:relative;overflow:hidden;border-radius:22px;background:#0b1030;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 40px 120px rgba(142,124,255,.45);';
    const frame = S.phone ? base + 'height:100%;max-height:520px;aspect-ratio:9/16' : base + 'width:100%;max-width:860px;aspect-ratio:16/9';
    const defs = [
      ['Galactic loop', 'Video · bar 1–17', 'linear-gradient(135deg,#ffd36a,#ff63d8 40%,#8e7cff 75%,#79ebff)'],
      ['Logo reveal', 'Video · bar 5–9', 'linear-gradient(135deg,#8e7cff,#0b1030 70%)'],
      ['Album cover', 'Image · bar 9–13', 'linear-gradient(135deg,#79ebff,#7cf0c0)'],
      ['Lyrics card', 'Image · bar 13–17', 'linear-gradient(135deg,#ff63d8,#ffd36a)']
    ];
    const clips = defs.map((d, i) => ({
      name: d[0], meta: d[1],
      box: 'flex:0 0 200px;padding:0;border:0;border-radius:22px;overflow:hidden;color:#eef2ff;background:rgba(255,255,255,.06);box-shadow:' + (i === S.sel ? '0 0 0 2px #79ebff,0 0 30px rgba(121,235,255,.45)' : '0 0 0 1px rgba(255,255,255,.1)'),
      art: 'display:block;height:84px;background:' + d[2],
      onPick: () => this.setState({ sel: i })
    }));
    return {
      frame, clips, titleSize: S.phone ? 34 : 56,
      cur: { name: defs[S.sel][0], meta: defs[S.sel][1] },
      wideBtn: tab(!S.phone), phoneBtn: tab(S.phone),
      setWide: () => this.setState({ phone: false }), setPhone: () => this.setState({ phone: true })
    };
  }
}
</script>
</body>
</html>
