<script>
const supabaseUrl = "https://zdlaloiruxamxsduxqxw.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInJlZiI6InpkbGFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQ";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

const $ = (id) => document.getElementById(id);

$("showLogin").addEventListener("click", () => {
  $("loginForm").classList.remove("hidden");
  $("registerForm").classList.add("hidden");
});
$("showRegister").addEventListener("click", () => {
  $("registerForm").classList.remove("hidden");
  $("loginForm").classList.add("hidden");
});

const artistOnlyNavIds = ["navProfile", "navDaw", "navVideo", "navRecords"];
function unlockNav() {
  artistOnlyNavIds.forEach((id) => {
    const link = $(id);
    link.classList.add("active");
    link.removeAttribute("aria-disabled");
  });
}
function lockNav() {
  artistOnlyNavIds.forEach((id) => {
    const link = $(id);
    link.classList.remove("active");
    link.setAttribute("aria-disabled", "true");
  });
}
artistOnlyNavIds.forEach((id) => {
  $(id).addEventListener("click", (event) => {
    if (!$(id).classList.contains("active")) {
      event.preventDefault();
      $("loginForm").classList.remove("hidden");
      $("registerForm").classList.add("hidden");
      $("loginStatus").textContent = "Log in to access this artist page.";
    }
  });
});

$("loginBtn").addEventListener("click", async () => {
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;
  $("loginStatus").textContent = "Logging in...";
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    $("loginStatus").textContent = error.message;
    return;
  }
  unlockNav();
  window.location.href = "upload.html";
});

$("registerBtn").addEventListener("click", async () => {
  const email = $("regEmail").value.trim();
  const password = $("regPassword").value;
  $("regStatus").textContent = "Creating account...";
  const { error: signUpError } = await supabaseClient.auth.signUp({
    email, password,
    options: { emailRedirectTo: window.location.origin + "/upload.html" }
  });
  if (signUpError) {
    $("regStatus").textContent = signUpError.message;
    return;
  }
  const { error: loginError } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (loginError) {
    $("regStatus").textContent = "Account created. " + loginError.message;
    return;
  }
  unlockNav();
  window.location.href = "upload.html";
});

$("logoutBtn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  lockNav();
  window.location.href = "index.html";
});

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) unlockNav();
  else lockNav();
})();
</script>
