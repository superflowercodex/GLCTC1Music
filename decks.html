<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Cosmic 1200 Decks</title>

<style>
/* GLOBAL */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
  color: #e5e7eb;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}
h1 {
  font-size: 2rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #38bdf8;
  text-shadow: 0 0 16px #0ea5e9;
  text-align: center;
}
h2 {
  font-size: 1.1rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #a5b4fc;
  margin-bottom: 8px;
}

/* CARD */
.glow-card {
  width: 100%;
  max-width: 1300px;
  background: rgba(15, 23, 42, 0.9);
  border-radius: 14px;
  padding: 32px;
  box-shadow: 0 0 25px rgba(56,189,248,0.35), 0 0 60px rgba(129,140,248,0.35);
  border: 1px solid rgba(56,189,248,0.5);
  margin-top: 10px;
}

/* DECK GRID */
.deck-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 60px;
  margin-top: 20px;
  align-items: start;
}
.deck {
  background: rgba(2,6,23,0.9);
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.6);
  position: relative;
  overflow: visible;
}
.deck h3 {
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #38bdf8;
  margin-bottom: 20px;
  text-align: center;
}

/* WHEEL */
.deck-wheel-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  flex-shrink: 0;
}

.deck-wheel {
  width: 300px;
  aspect-ratio: 1 / 1; /* ⭐ PERFECT ROUND PLATTER */
  border-radius: 50%;
  background: radial-gradient(circle at center, #0f172a 0%, #020617 40%, #000 100%);
  border: 8px solid #38bdf8;
  box-shadow:
    0 0 40px rgba(56,189,248,1),
    0 0 80px rgba(56,189,248,0.8),
    inset 0 0 40px rgba(56,189,248,0.5);
  position: relative;
  transform-origin: center center;
  animation-name: spinWheel;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  animation-play-state: paused;
  animation-duration: 2.5s;
}

@keyframes spinWheel {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* INNER HUB */
.deck-wheel-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 90px;
  height: 90px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, #38bdf8, #0ea5e9);
  box-shadow: 0 0 30px rgba(56,189,248,1);
}

/* PITCH */
.pitch-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.pitch-wrap label {
  font-size: 0.75rem;
  color: #38bdf8;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.pitch-slider {
  -webkit-appearance: slider-vertical;
  writing-mode: bt-lr;
  width: 20px;
  height: 230px;
  background: #0b1120;
  border-radius: 10px;
  box-shadow: inset 0 0 14px rgba(56,189,248,0.6);
}
.pitch-slider::-webkit-slider-thumb {
  width: 28px;
  height: 28px;
  background: #38bdf8;
  border-radius: 50%;
  box-shadow: 0 0 16px #38bdf8;
  cursor: pointer;
}

/* WAVEFORM */
.wave-strip {
  width: 100%;
  height: 70px;
  margin-top: 26px;
  border-radius: 12px;
  background: linear-gradient(90deg, rgba(56,189,248,0.12), rgba(129,140,248,0.32));
  box-shadow: inset 0 0 20px rgba(56,189,248,0.25);
  overflow: hidden;
  position: relative;
}
.wave-bar {
  position: absolute;
  width: 200%;
  height: 100%;
  background-image: linear-gradient(135deg,
    rgba(56,189,248,0.6) 0%,
    rgba(129,140,248,0.6) 25%,
    rgba(236,72,153,0.6) 50%,
    rgba(34,197,94,0.6) 75%,
    rgba(56,189,248,0.6) 100%);
  opacity: 0.5;
  animation: waveMove 10s linear infinite;
}
@keyframes waveMove {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* BUTTONS */
button {
  padding: 9px 18px;
  border-radius: 999px;
  border: none;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  cursor: pointer;
  background: linear-gradient(90deg, #22c55e, #06b6d4);
  color: #020617;
  box-shadow: 0 0 12px rgba(34,197,94,0.5);
}
button.secondary {
  background: linear-gradient(90deg, #6366f1, #ec4899);
  color: #fff;
  box-shadow: 0 0 12px rgba(99,102,241,0.5);
}
.transport-row {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* SLIDERS */
.slider-wrap {
  margin-top: 32px;
  text-align: center;
}
.slider-wrap label {
  font-size: 0.75rem;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.slider {
  width: 80%;
  margin-top: 10px;
}

/* EQ + FX */
.eq-row, .fx-row {
  margin-top: 24px;
  display: flex;
  justify-content: center;
  gap: 26px;
  flex-wrap: wrap;
}
.eq-knob {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 0.7rem;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.eq-knob span { margin-bottom: 6px; }
.eq-knob input { width: 160px; }

/* CROSS FADER */
.crossfader-wrap {
  margin-top: 46px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.crossfader-labels {
  display: flex;
  justify-content: space-between;
  width: 90%;
  font-size: 0.75rem;
  text-transform: uppercase;
  color: #9ca3af;
  margin-bottom: 10px;
}
.crossfader {
  -webkit-appearance: none;
  appearance: none;
  width: 90%;
  height: 20px;
  background: #050708;
  border-radius: 8px;
  box-shadow:
    inset 0 0 10px #000,
    0 0 10px rgba(56,189,248,0.35);
}
.crossfader::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 40px;
  height: 14px;
  background: #38bdf8;
  border-radius: 4px;
  box-shadow: 0 0 16px #38bdf8;
  cursor: pointer;
}

/* LIBRARY */
.library-list {
  margin-top: 20px;
  background: rgba(2,6,23,0.8);
  padding: 16px;
  border-radius: 12px;
  box-shadow: inset 0 0 20px rgba(56,189,248,0.25);
}
.library-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(31,41,55,0.8);
  font-size: 0.85rem;
  gap: 12px;
  flex-wrap: wrap;
}
.library-item:last-child {
  border-bottom: none;
}

/* BANKS */
#banks { margin-top: 24px; }
.banks-grid {
  display: grid;
  grid-template-columns: repeat(13, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.bank-btn {
  background: radial-gradient(circle, #38bdf8 0%, #020617 80%);
  border: 2px solid #38bdf8;
  color: #020617;
  font-weight: 700;
  border-radius: 999px;
  padding: 6px 0;
  cursor: pointer;
  font-size: 0.8rem;
  text-transform: uppercase;
  box-shadow: 0 0 12px rgba(56,189,248,0.6);
}
.bank-btn:hover {
  background: #f9fafb;
  color: #020617;
  box-shadow: 0 0 16px rgba(56,189,248,0.9);
}
#bankTracks { margin-top: 16px; }
.bank-track-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(31,41,55,0.8);
  font-size: 0.85rem;
  gap: 12px;
  flex-wrap: wrap;
}
.bank-track-item:last-child {
  border-bottom: none;
}

/* NAV */
nav {
  margin-top: 16px;
  font-size: 0.8rem;
  color: #9ca3af;
}
nav a {
  color: #38bdf8;
  text-decoration: none;
  margin: 0 6px;
}
nav a:hover { text-decoration: underline; }
</style>
</head>

<body>
<h1>GLCTC1 – Cosmic 1200 Decks</h1>

<div class="glow-card">
<h2>Cosmic 1200 Twin Decks</h2>

<div class="deck-grid">

<!-- DECK A -->
<div class="deck" id="deckA">
  <h3>Deck A</h3>

  <div class="deck-wheel-wrap">
    <div class="deck-wheel" id="deckAWheel">
      <div class="deck-wheel-inner"></div>
    </div>

    <div class="pitch-wrap">
      <label>Pitch</label>
      <input type="range" min="0.5" max="1.5" step="0.01"
             class="pitch-slider"
             value="1"
             oninput="setPitch('A', this.value)">
    </div>
  </div>

  <audio id="deckAAudio" controls style="margin-top:26px; width:100%;"></audio>

  <div class="wave-strip"><div class="wave-bar"></div></div>

  <div class="transport-row">
    <button onclick="playDeck('A')">Play</button>
    <button onclick="stopDeck('A')">Stop</button>
    <button class="secondary" onclick="syncDeck('A','B')">Sync → B</button>
    <button onclick="setCue('A')">Cue</button>
    <button onclick="loopDeck('A')">Loop</button>
  </div>

  <div class="slider-wrap">
    <label>Volume</label>
    <input type="range" min="0" max="1" step="0.01"
           class="slider" value="1"
           oninput="setVolume('A', this.value)">
  </div>

  <div class="eq-row">
    <div class="eq-knob">
      <span>High</span>
      <input type="range" min="0" max="2" step="0.01"
             value="1"
             oninput="setEQ('A','high',this.value)">
    </div>
    <div class="eq-knob">
      <span>Low</span>
      <input type="range" min="0" max="2" step="0.01"
             value="1"
             oninput="setEQ('A','low',this.value)">
    </div>
  </div>

  <div class="fx-row">
    <div class="eq-knob">
      <span>Filter</span>
      <input type="range" min="0" max="1" step="0.01"
             value="0"
             oninput="setFilter('A',this.value)">
    </div>
    <div class="eq-knob">
      <span>Delay (ms)</span>
      <input type="range" min="0" max="2000" step="10"
             value="0"
             oninput="setDelay('A',this.value)">
    </div>
  </div>
</div>

<!-- DECK B -->
<div class="deck" id="deckB">
  <h3>Deck B</h3>

  <div class="deck-wheel-wrap">
    <div class="deck-wheel" id="deckBWheel">
      <div class="deck-wheel-inner"></div>
    </div>

    <div class="pitch-wrap">
      <label>Pitch</label>
      <input type="range" min="0.5" max="1.5" step="0.01"
             class="pitch-slider"
             value="1"
             oninput="setPitch('B', this.value)">
    </div>
  </div>

  <audio id="deckBAudio" controls style="margin-top:26px; width:100%;"></audio>

  <div class="wave-strip"><div class="wave-bar"></div></div>

  <div class="transport-row">
    <button onclick="playDeck('B')">Play</button>
    <button onclick="stopDeck('B')">Stop</button>
    <button class="secondary" onclick="syncDeck('B','A')">Sync → A</button>
    <button onclick="setCue('B')">Cue</button>
    <button onclick="loopDeck('B')">Loop</button>
  </div>

  <div class="slider-wrap">
    <label>Volume</label>
    <input type="range" min="0" max="1" step="0.01"
           class="slider" value="1"
           oninput="setVolume('B', this.value)">
  </div>

  <div class="eq-row">
    <div class="eq-knob">
      <span>High</span>
      <input type="range" min="0" max="2" step="0.01"
             value="1"
             oninput="setEQ('B','high',this.value)">
    </div>
    <div class="eq-knob">
      <span>Low</span>
      <input type="range" min="0" max="2" step="0.01"
             value="1"
             oninput="setEQ('B','low',this.value)">
    </div>
  </div>

  <div class="fx-row">
    <div class="eq-knob">
      <span>Filter</span>
      <input type="range" min="0" max="1" step="0.01"
             value="0"
             oninput="setFilter('B',this.value)">
    </div>
    <div class="eq-knob">
      <span>Delay (ms)</span>
      <input type="range" min="0" max="2000" step="10"
             value="0"
             oninput="setDelay('B',this.value)">
    </div>
  </div>
</div>

</div>

<!-- CROSS FADER -->
<div class="crossfader-wrap">
  <div class="crossfader-labels
