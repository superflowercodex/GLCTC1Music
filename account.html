<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 Artist Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #020617;
  color: #e5e7eb;
  font-family: system-ui, sans-serif;
  text-align: center;
}

.card {
  max-width: 600px;
  margin: 40px auto;
  padding: 25px;
  background: #0f172a;
  border-radius: 14px;
  border: 1px solid #38bdf8;
}

.email {
  color: #38bdf8;
  font-weight: bold;
}

.id {
  margin-top: 15px;
  padding: 10px;
  background: #020617;
  border-radius: 8px;
  word-break: break-all;
  font-size: 0.8rem;
}
</style>
</head>

<body>

<div class="card">

  <h1>🎤 GLCTC1 Artist Account</h1>

  <div id="status">
    Checking account...
  </div>

  <div id="accountInfo"></div>

</div>


<script>

// =====================================================
// SUPABASE
// =====================================================

const supabaseUrl =
  "https://zdlaloiruxamxsduxqxw.supabase.co";

const supabaseKey =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbGFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQ";

const supabaseClient =
  supabase.createClient(
    supabaseUrl,
    supabaseKey
  );


// =====================================================
// CHECK CURRENT LOGIN
// =====================================================

(async () => {

  const {
    data: { session },
    error
  } = await supabaseClient.auth.getSession();


  if (error) {

    document.getElementById("status").textContent =
      "Unable to check account.";

    console.error(error);

    return;
  }


  if (!session) {

    document.getElementById("status").textContent =
      "You are not signed in.";

    return;
  }


  // ===================================================
  // USER FOUND
  // ===================================================

  const user = session.user;

  document.getElementById("status").innerHTML =
    "Welcome to your GLCTC1 Artist Account.";

  document.getElementById("accountInfo").innerHTML =

    "<p>Email:</p>" +

    "<div class='email'>" +
    (user.email || "") +
    "</div>" +

    "<p>Your Supabase User ID:</p>" +

    "<div class='id'>" +
    user.id +
    "</div>";

})();

</script>

</body>
</html>
