// --- SIMPLE AUTOCORRELATION BPM + KEY + FREQUENCY ANALYSIS ---
async function analyseAudio(file) {
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const arrayBuffer = await file.arrayBuffer();
  const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

  // Limit to 5 minutes
  if (audioBuffer.duration > 300) {
    alert("Track is longer than 5 minutes. Please use a shorter master.");
    return;
  }

  const sampleRate = audioBuffer.sampleRate;
  const channelData = audioBuffer.getChannelData(0);

  // Window for analysis (first 60 seconds or full length)
  const maxSamples = Math.min(sampleRate * 60, channelData.length);
  const buffer = channelData.slice(0, maxSamples);

  // Autocorrelation for BPM
  function autoCorrelate(buf, sampleRate) {
    const size = buf.length;
    const rms = Math.sqrt(buf.reduce((sum, v) => sum + v * v, 0) / size);
    if (rms < 0.01) return null;

    let bestOffset = -1;
    let bestCorrelation = 0;
    const correlations = [];

    for (let offset = 30; offset < size / 2; offset++) {
      let correlation = 0;
      for (let i = 0; i < size - offset; i++) {
        correlation += buf[i] * buf[i + offset];
      }
      correlation = correlation / (size - offset);
      correlations[offset] = correlation;
      if (correlation > bestCorrelation) {
        bestCorrelation = correlation;
        bestOffset = offset;
      }
    }

    if (bestOffset === -1) return null;
    const bpm = Math.round(sampleRate / bestOffset * 60);
    return bpm;
  }

  const bpm = autoCorrelate(buffer, sampleRate) || 120;

  // FFT for dominant frequency
  function dominantFrequency(buf, sampleRate) {
    const fftSize = 2048;
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = fftSize;

    const tempBuffer = audioContext.createBuffer(1, buf.length, sampleRate);
    tempBuffer.copyToChannel(buf, 0);

    const source = audioContext.createBufferSource();
    source.buffer = tempBuffer;
    source.connect(analyser);
    analyser.connect(audioContext.destination);
    source.start();

    const freqData = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(freqData);

    let maxVal = -Infinity;
    let maxIndex = 0;
    for (let i = 0; i < freqData.length; i++) {
      if (freqData[i] > maxVal) {
        maxVal = freqData[i];
        maxIndex = i;
      }
    }
    const freq = Math.round(maxIndex * sampleRate / (2 * freqData.length));
    return freq;
  }

  const freq = dominantFrequency(buffer, sampleRate) || 0;

  // Rough key guess from dominant frequency
  function guessKey(f) {
    if (!f || f <= 0) return "";
    const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const A4 = 440;
    const n = Math.round(12 * Math.log2(f / A4));
    const noteIndex = (n + 9 + 12 * 10) % 12; // shift so A=9
    const note = notes[noteIndex];
    return note;
  }

  const key = guessKey(freq);

  document.getElementById("bpm").value = bpm;
  document.getElementById("frequency").value = freq;
  document.getElementById("key").value = key;
}

// --- TAG SCAN + AUDIO ANALYSIS ON MASTER AUDIO SELECT ---

  if (!file) return;

    document.getElementById("artist").value =

    document.getElementById("album").value =
      metadata.common.album || "";

    document.getElementById("genre").value =
      metadata.common.genre ? metadata.common.genre[0] : "";

    document.getElementById("notes").value =
      metadata.common.comment ? metadata.common.comment.join(", ") : "";

  } catch (err) {
    console.error("Tag scan failed:", err);
  }

  // Sound analysis (BPM, key, frequency)
  try {
    await analyseAudio(file);
  } catch (err) {
    console.error("Audio analysis failed:", err);
  }
});

// --- SUPABASE UPLOAD ENGINE ---
document.getElementById('uploadBtn').addEventListener('click', async () => {

  if (!document.getElementById('copyrightConfirm').checked) {
    alert("You must confirm copyright ownership.");
    return;
  }

  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    alert("You are not logged in.");
    return;
  }

  const user_id = user.id;

  const metadata = {
    cat_no: document.getElementById('catNo').value.trim(),
    artist: document.getElementById('artist').value.trim(),
    album: document.getElementById('album').value.trim(),
    title: document.getElementById('title').value.trim(),
    genre: document.getElementById('genre').value.trim(),
    frequency: document.getElementById('frequency').value.trim(),
    bpm: document.getElementById('bpm').value.trim(),
    key: document.getElementById('key').value.trim(),
    chakra: document.getElementById('chakra').value.trim(),
    planet: document.getElementById('planet').value.trim(),
    spatial: document.getElementById('spatial').value.trim(),
    notes: document.getElementById('notes').value.trim(),
    is_cover: document.getElementById('isCover').value,
    copyright_confirmed: true,
    user_id: user_id
  };

  const coverArt = document.getElementById('coverArt').files[0];
  const masterAudio = document.getElementById('masterAudio').files[0];
  const stems = [
    document.getElementById('stem1').files[0],
    document.getElementById('stem2').files[0],
    document.getElementById('stem3').files[0],
    document.getElementById('stem4').files[0],
    document.getElementById('stem5').files[0]
  ];

  if (!masterAudio) {
    alert("Please select a master audio file.");
    return;
  }

  async function uploadFile(file, path) {
    if (!file) return null;
    const { data, error } = await supabase.storage
      .from("tracks")
      .upload(path, file, { upsert: true });
    if (error) {
      console.error(error);
      return null;
    }
    return data.path;
  }

  const coverExt = coverArt ? coverArt.name.split('.').pop() : "png";
  const masterExt = masterAudio.name.split('.').pop() || "wav";

  const cover_path = await uploadFile(coverArt, `user_${user_id}/cover_${Date.now()}.${coverExt}`);
  const master_path = await uploadFile(masterAudio, `user_${user_id}/master_${Date.now()}.${masterExt}`);

  const stem_paths = [];
  for (let i = 0; i < stems.length; i++) {
    if (stems[i]) {
      const ext = stems[i].name.split('.').pop() || "wav";
      const p = await uploadFile(stems[i], `user_${user_id}/stem${i+1}_${Date.now()}.${ext}`);
      stem_paths.push(p);
    } else {
      stem_paths.push(null);
    }
  }

  const { error: insertError } = await supabase
    .from("tracks")
    .insert({
      ...metadata,
      cover_art_path: cover_path,
      master_audio_path: master_path,
      stem1_path: stem_paths[0],
      stem2_path: stem_paths[1],
      stem3_path: stem_paths[2],
      stem4_path: stem_paths[3],
      stem5_path: stem_paths[4]
    });

  if (insertError) {
    console.error(insertError);
    alert("Database insert error.");
    return;
  }

  alert("Track uploaded successfully to GLCTC1!");

  const trackForDecks = {
    id: crypto.randomUUID(),
    title: metadata.title,
    artist: metadata.artist,
    bpm: metadata.bpm,
    key: metadata.key,
    masterFile: masterAudio || null,
    stems: stems.filter(f => f !== undefined && f !== null)
  };

  sessionStorage.setItem("pendingUpload", JSON.stringify(trackForDecks));

  window.location.href = "decks.html";
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.querySelectorAll('input, textarea').forEach(el => {
    if (el.type !== 'checkbox' && el.id !== 'masterAudio' && el.id !== 'coverArt' &&
        !el.id.startsWith('stem')) {
      el.value = '';
    }
  });
  document.getElementById('isCover').value = 'no';
  document.getElementById('chakra').value = '';
  document.getElementById('copyrightConfirm').checked = false;
});
</script>
