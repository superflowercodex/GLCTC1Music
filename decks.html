<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLCTC1 – Cosmic 1200 Decks</title>

  <!-- Cosmic styling -->
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 16px #0ea5e9;
      text-align: center;
    }

    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #a5b4fc;
      margin-bottom: 8px;
    }

    .glow-card {
      width: 100%;
      max-width: 1200px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 14px;
      padding: 20px;
      box-shadow:
        0 0 25px rgba(56, 189, 248, 0.35),
        0 0 60px rgba(129, 140, 248, 0.35);
      border: 1px solid rgba(56, 189, 248, 0.5);
      margin-top: 10px;
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .deck {
      background: rgba(2, 6, 23, 0.8);
      border-radius: 12px;
      padding: 16px;
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .deck h3 {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #38bdf8;
      margin-bottom: 12px;
      text-align: center;
    }

    .control-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      justify-content: center;
    }

    button {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      background: linear-gradient(90deg, #22c55e, #06b6d4);
      color: #020617;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }

    button.secondary {
      background: linear-gradient(90deg, #6366f1, #ec4899);
      color: #f9fafb;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    .pitch-slider {
      width: 100%;
      margin-top: 10px;
    }

    .crossfader {
      width: 100%;
      margin-top: 20px;
    }

    .visualizer {
      width: 100%;
      height: 200px;
      background: #020617;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: inset 0 0 20px rgba(129, 140, 248, 0.25);
    }

    .library-list {
      margin-top: 20px;
      background: rgba(2, 6, 23, 0.8);
      padding: 16px;
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .library-item {
      padding: 10px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    nav a {
      color: #38bdf8;
      text-decoration: none;
      margin: 0 6px;
    }

    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <h1>GLCTC1 – Cosmic 1200 Decks</h1>

  <!-- DECKS -->
  <div class="glow-card">
    <h2>DJ Decks</h2>

    <div class="deck-grid">

      <!-- DECK A -->
      <div class="deck">
        <h3>Deck A</h3>

        <audio id="deckA" controls style="width:100%;"></audio>

        <input id="pitchA" class="pitch-slider" type="range" min="-50" max="50" value="0">

        <div class="control-row">
          <button id="playA">Play</button>
          <button id="stopA">Stop</button>
          <button class="secondary" id="syncToB">Sync → B</button>
        </div>
      </div>

      <!-- DECK B -->
      <div class="deck">
        <h3>Deck B</h3>

        <audio id="deckB" controls style="width:100%;"></audio>

        <input id="pitchB" class="pitch-slider" type="range" min="-50" max="50" value="0">

        <div class="control-row">
          <button id="playB">Play</button>
          <button id="stopB">Stop</button>
          <button class="secondary" id="syncToA">Sync → A</button>
        </div>
      </div>

    </div>

    <!-- CROSSFADER -->
    <h2 style="margin-top:20px;">Crossfader</h2>
    <input id="crossfader" class="crossfader" type="range" min="0" max="100" value="50">

    <!-- VISUALIZER -->
    <h2>Cosmic Visualizer</h2>
    <div class="visualizer" id="visualizer"></div>
  </div>

  <!-- MASTER LIBRARY -->
  <div class="glow-card">
    <h2>GLCTC1 Master Library</h2>

    <div id="libraryList" class="library-list">
      <!-- Tracks will be loaded here from Supabase -->
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav>
    <span>Navigation:</span>
    <a href="index.html">Login</a> |
    <a href="upload.html">Upload</a> |
    <a href="decks.html">Decks</a>
  </nav>

  <!-- JS placeholder -->
  <script>
    // Playback controls
    const deckA = document.getElementById('deckA');
    const deckB = document.getElementById('deckB');

    document.getElementById('playA').onclick = () => deckA.play();
    document.getElementById('stopA').onclick = () => deckA.pause();

    document.getElementById('playB').onclick = () => deckB.play();
    document.getElementById('stopB').onclick = () => deckB.pause();

    // Sync buttons (placeholder)
    document.getElementById('syncToB').onclick = () => {
      deckB.currentTime = deckA.currentTime;
    };

    document.getElementById('syncToA').onclick = () => {
      deckA.currentTime = deckB.currentTime;
    };

    // Crossfader (placeholder)
    const crossfader = document.getElementById('crossfader');
    crossfader.oninput = () => {
      const value = crossfader.value / 100;
      deckA.volume = 1 - value;
      deckB.volume = value;
    };

    // Next step: Supabase track loading goes here.
  </script>

</body>
</html>
