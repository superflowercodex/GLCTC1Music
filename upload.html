<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GLCTC1 – Upload Track</title>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    const supabase = supabase.createClient(
      "https://YOUR_PROJECT.supabase.co",
      "YOUR_ANON_KEY"
    );
  </script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 16px #0ea5e9;
      text-align: center;
    }

    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #a5b4fc;
      margin-bottom: 8px;
    }

    .glow-card {
      width: 100%;
      max-width: 900px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 14px;
      padding: 20px;
      box-shadow:
        0 0 25px rgba(56, 189, 248, 0.35),
        0 0 60px rgba(129, 140, 248, 0.35);
      border: 1px solid rgba(56, 189, 248, 0.5);
      margin-top: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px 20px;
      margin-top: 16px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
    }

    input, select, textarea {
      width: 100%;
      padding: 6px 8px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.8rem;
    }

    textarea {
      height: 80px;
      resize: none;
    }

    .button-row {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      background: linear-gradient(90deg, #22c55e, #06b6d4);
      color: #020617;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }

    button.secondary {
      background: linear-gradient(90deg, #6366f1, #ec4899);
      color: #f9fafb;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    nav {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    nav a {
      color: #38bdf8;
      text-decoration: none;
      margin: 0 6px;
    }

    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <h1>GLCTC1 – Upload Track</h1>

  <div class="glow-card">
    <h2>Add Track to GLCTC1 Master Library</h2>
    <p style="font-size:0.8rem; color:#9ca3af;">
      Upload your audio, cover art, stems, and metadata. This page is upload-only.
    </p>

    <div class="form-grid">

      <div><label>ID Cat No</label><input id="catNo" type="text"></div>
      <div><label>Artist</label><input id="artist" type="text"></div>
      <div><label>Album</label><input id="album" type="text"></div>

      <div><label>Track Title</label><input id="title" type="text"></div>
      <div><label>Genre</label><input id="genre" type="text"></div>
      <div><label>Frequency (Hz)</label><input id="frequency" type="number"></div>

      <div><label>BPM</label><input id="bpm" type="number"></div>
      <div><label>Key</label><input id="key" type="text"></div>
      <div><label>Chakra</label><input id="chakra" type="text"></div>

      <div><label>Planet</label><input id="planet" type="text"></div>
      <div><label>Spatial</label><input id="spatial" type="text"></div>
      <div><label>Notes</label><textarea id="notes"></textarea></div>

      <div><label>Cover Art</label><input id="coverArt" type="file" accept="image/*"></div>
      <div><label>Master Audio</label><input id="masterAudio" type="file" accept="audio/*"></div>
      <div><label>Stem 1</label><input id="stem1" type="file" accept="audio/*"></div>

      <div><label>Stem 2</label><input id="stem2" type="file" accept="audio/*"></div>
      <div><label>Stem 3</label><input id="stem3" type="file" accept="audio/*"></div>
      <div><label>Stem 4</label><input id="stem4" type="file" accept="audio/*"></div>

      <div><label>Stem 5</label><input id="stem5" type="file" accept="audio/*"></div>

      <div>
        <label>Is this a cover version?</label>
        <select id="isCover">
          <option value="no">No</option>
          <option value="yes">Yes – I have permission</option>
        </select>
      </div>

      <div style="grid-column: span 3; margin-top:10px;">
        <label>
          <input type="checkbox" id="copyrightConfirm">
          I confirm I own the rights to upload this audio.
        </label>
      </div>

    </div>

    <div class="button-row">
      <button id="uploadBtn">Add Track to Library</button>
      <button class="secondary" id="clearBtn">Clear Form</button>
    </div>
  </div>

  <nav>
    <span>Navigation:</span>
    <a href="index.html">Login</a> |
    <a href="upload.html">Upload</a> |
    <a href="decks.html">Decks</a>
  </nav>

  <!-- FULL SUPABASE UPLOAD ENGINE -->
  <script>
    document.getElementById('uploadBtn').addEventListener('click', async () => {

      if (!document.getElementById('copyrightConfirm').checked) {
        alert("You must confirm copyright ownership.");
        return;
      }

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert("You are not logged in.");
        return;
      }

      const user_id = user.id;

      const metadata = {
        cat_no: document.getElementById('catNo').value.trim(),
        artist: document.getElementById('artist').value.trim(),
        album: document.getElementById('album').value.trim(),
        title: document.getElementById('title').value.trim(),
        genre: document.getElementById('genre').value.trim(),
        frequency: document.getElementById('frequency').value.trim(),
        bpm: document.getElementById('bpm').value.trim(),
        key: document.getElementById('key').value.trim(),
        chakra: document.getElementById('chakra').value.trim(),
        planet: document.getElementById('planet').value.trim(),
        spatial: document.getElementById('spatial').value.trim(),
        notes: document.getElementById('notes').value.trim(),
        is_cover: document.getElementById('isCover').value,
        copyright_confirmed: true,
        user_id: user_id
      };

      const coverArt = document.getElementById('coverArt').files[0];
      const masterAudio = document.getElementById('masterAudio').files[0];
      const stems = [
        document.getElementById('stem1').files[0],
        document.getElementById('stem2').files[0],
        document.getElementById('stem3').files[0],
        document.getElementById('stem4').files[0],
        document.getElementById('stem5').files[0]
      ];

      async function uploadFile(file, path) {
        if (!file) return null;
        const { data, error } = await supabase.storage
          .from("tracks")
          .upload(path, file);
        if (error) {
          console.error(error);
          return null;
        }
        return data.path;
      }

      const cover_path = await uploadFile(coverArt, `user_${user_id}/cover_${Date.now()}.png`);
      const master_path = await uploadFile(masterAudio, `user_${user_id}/master_${Date.now()}.wav`);

      const stem_paths = [];
      for (let i = 0; i < stems.length; i++) {
        if (stems[i]) {
          const p = await uploadFile(stems[i], `user_${user_id}/stem${i+1}_${Date.now()}.wav`);
          stem_paths.push(p);
        } else {
          stem_paths.push(null);
        }
      }

      const { error: insertError } = await supabase
        .from("tracks")
        .insert({
          ...metadata,
          cover_art_path: cover_path,
          master_audio_path: master_path,
          stem1_path: stem_paths[0],
          stem2_path: stem_paths[1],
          stem3_path: stem_paths[2],
          stem4_path: stem_paths[3],
          stem5_path: stem_paths[4]
        });

      if (insertError) {
        console.error(insertError);
        alert("Database insert error.");
        return;
      }

      alert("Track uploaded successfully to GLCTC1!");
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      document.querySelectorAll('input, textarea').forEach(el => el.value = '');
      document.getElementById('isCover').value = 'no';
      document.getElementById('copyrightConfirm').checked = false;
    });
  </script>

</body>
</html>
