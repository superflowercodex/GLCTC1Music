<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLCTC1 – Upload Track</title>

<!-- Supabase Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const supabase = supabase.createClient(
  "https://zdlaloiruxamxsduxqxw.supabase.co",
  "YOUR_ANON_KEY_HERE"
);
</script>

<style>
body {
  margin: 0;
  padding: 20px;
  background: radial-gradient(circle at top, #0b1120 0%, #020617 40%, #000 100%);
  color: #e5e7eb;
  font-family: system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}
h1 {
  font-size: 2rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #38bdf8;
  text-shadow: 0 0 16px #0ea5e9;
}
.glow-card {
  width: 100%;
  max-width: 900px;
  background: rgba(15, 23, 42, 0.9);
  border-radius: 14px;
  padding: 20px;
  box-shadow:
    0 0 25px rgba(56, 189, 248, 0.35),
    0 0 60px rgba(129, 140, 248, 0.35);
  border: 1px solid rgba(56, 189, 248, 0.5);
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px 20px;
  margin-top: 16px;
}
label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #9ca3af;
}
input, select, textarea {
  width: 100%;
  padding: 6px 8px;
  margin-top: 4px;
  border-radius: 6px;
  border: 1px solid #1f2937;
  background: #020617;
  color: #e5e7eb;
  font-size: 0.8rem;
}
textarea {
  height: 80px;
  resize: none;
}
.button-row {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
button {
  padding: 10px 20px;
  border-radius: 999px;
  border: none;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  cursor: pointer;
  background: linear-gradient(90deg, #22c55e, #06b6d4);
  color: #020617;
}
button.secondary {
  background: linear-gradient(90deg, #6366f1, #ec4899);
  color: #f9fafb;
}
nav {
  margin-top: 16px;
  font-size: 0.8rem;
  color: #9ca3af;
}
nav a {
  color: #38bdf8;
  text-decoration: none;
  margin: 0 6px;
}
nav a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<h1>GLCTC1 – Upload Track</h1>

<div class="glow-card">
  <h2>Add Track to GLCTC1 Master Library</h2>

  <p style="font-size:0.8rem; color:#9ca3af;">
    Upload your audio, cover art, stems, and metadata. Manual entry only.
  </p>

  <!-- GRID OF FIELDS -->
  <div class="form-grid">

    <div><label>ID Cat No</label><input id="catNo" type="text"></div>
    <div><label>Artist</label><input id="artist" type="text"></div>
    <div><label>Album</label><input id="album" type="text"></div>

    <div><label>Track Title</label><input id="title" type="text"></div>
    <div><label>Genre</label><input id="genre" type="text"></div>
    <div><label>Frequency (Hz)</label><input id="frequency" type="number"></div>

    <div><label>BPM</label><input id="bpm" type="number"></div>
    <div><label>Key</label><input id="key" type="text"></div>

    <div>
      <label>Chakra</label>
      <select id="chakra">
        <option value="">Select Chakra</option>
        <option value="Root">Root</option>
        <option value="Sacral">Sacral</option>
        <option value="Solar Plexus">Solar Plexus</option>
        <option value="Heart">Heart</option>
        <option value="Throat">Throat</option>
        <option value="Third Eye">Third Eye</option>
        <option value="Crown">Crown</option>
      </select>
    </div>

    <div><label>Planet</label><input id="planet" type="text"></div>
    <div><label>Spatial</label><input id="spatial" type="text"></div>
    <div><label>Notes</label><textarea id="notes"></textarea></div>

    <div><label>Cover Art</label><input id="coverArt" type="file" accept="image/*"></div>

    <div><label>Master Audio</label><input id="masterAudio" type="file" accept="audio/*"></div>

    <div><label>Stem 1</label><input id="stem1" type="file" accept="audio/*"></div>
    <div><label>Stem 2</label><input id="stem2" type="file" accept="audio/*"></div>
    <div><label>Stem 3</label><input id="stem3" type="file" accept="audio/*"></div>
    <div><label>Stem 4</label><input id="stem4" type="file" accept="audio/*"></div>
    <div><label>Stem 5</label><input id="stem5" type="file" accept="audio/*"></div>

    <div>
      <label>Is this a cover version?</label>
      <select id="isCover">
        <option value="no">No</option>
        <option value="yes">Yes – I have permission</option>
      </select>
    </div>

  </div> <!-- END OF GRID -->

  <!-- CHECKBOX + TEXT FIXED TO LEFT -->
  <div style="display:flex;align-items:center;gap:10px;margin-top:20px;justify-content:flex-start;">
    <input type="checkbox" id="copyrightConfirm">
    <span style="font-size:0.8rem;color:#9ca3af;white-space:nowrap;">
      I confirm I own the rights to upload this audio.
    </span>
  </div>

  <div class="button-row">
    <button id="uploadBtn">Add Track to Library</button>
    <button class="secondary" id="clearBtn">Clear Form</button>
  </div>
</div>

<nav>
  <span>Navigation:</span>
  <a href="index.html">Login</a> |
  <a href="upload.html">Upload</a> |
  <a href="decks.html">Decks</a>
</nav>

<script>
document.getElementById('uploadBtn').addEventListener('click', async () => {

  if (!copyrightConfirm.checked) {
    alert("Please confirm copyright ownership.");
    return;
  }

  const masterAudio = document.getElementById('masterAudio').files[0];
  if (!masterAudio) {
    alert("Please select a master audio file.");
    return;
  }

  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    alert("You are not logged in.");
    return;
  }

  const user_id = user.id;

  // Upload master audio
  const ext = masterAudio.name.split('.').pop();
  const { data: uploadData, error: uploadError } = await supabase.storage
    .from("tracks")
    .upload(`user_${user_id}/master_${Date.now()}.${ext}`, masterAudio, { upsert: true });

  if (uploadError) {
    alert("Upload failed: " + uploadError.message);
    return;
  }

  // Build metadata object
  const metadata = {
    cat_no: catNo.value,
    artist: artist.value,
    album: album.value,
    title: title.value,
    genre: genre.value,
    frequency: frequency.value,
    bpm: bpm.value,
    key: key.value,
    chakra: chakra.value,
    planet: planet.value,
    spatial: spatial.value,
    notes: notes.value,
    is_cover: isCover.value,
    master_audio_path: uploadData.path,
    user_id: user_id
  };

  // Insert into database
  const { error: insertError } = await supabase
    .from("tracks")
    .insert(metadata);

  if (insertError) {
    alert("Database insert error: " + insertError.message);
    return;
  }

  // Send to Page 3
  const trackForDecks = {
    id: crypto.randomUUID(),
    title: metadata.title,
    artist: metadata.artist,
    bpm: metadata.bpm,
    key: metadata.key,
    masterFile: masterAudio
  };

  sessionStorage.setItem("pendingUpload", JSON.stringify(trackForDecks));

  window.location.href = "decks.html";
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.querySelectorAll('input, textarea').forEach(el => {
    if (el.type !== 'checkbox' && el.type !== 'file') el.value = '';
  });
  chakra.value = '';
  isCover.value = 'no';
  copyrightConfirm.checked = false;
});
</script>

</body>
</html>
