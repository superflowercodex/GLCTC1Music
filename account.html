<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>GLCTC1 — Artist Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  padding: 20px;

  background:
    radial-gradient(
      circle at 50% 0%,
      #172554 0%,
      #020617 45%,
      #000 100%
    );

  color: #e5e7eb;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

.header {

  width: 100%;

  max-width: 700px;

  margin: 0 auto 20px;

  text-align: center;
}

.header img {

  width: 100%;

  max-width: 600px;

  height: auto;

  display: block;

  margin: 0 auto 15px;
}

.header h1 {

  margin: 0;

  font-size: 2rem;

  letter-spacing: 0.15em;

  text-transform: uppercase;

  color: #38bdf8;

  text-shadow:
    0 0 10px #0ea5e9,
    0 0 25px #0ea5e9;
}


/* =====================================================
   NAVIGATION
===================================================== */

.account-nav {

  width: 100%;

  max-width: 700px;

  margin: 0 auto 20px;

  padding: 14px;

  text-align: center;

  background:
    rgba(15,23,42,0.8);

  border:
    1px solid rgba(56,189,248,0.35);

  border-radius: 14px;

  box-shadow:
    0 0 18px rgba(56,189,248,0.18);
}

.account-nav a {

  color: #38bdf8;

  text-decoration: none;

  margin: 0 10px;

  font-weight: 700;
}

.account-nav a:hover {

  color: #67e8f9;

  text-shadow:
    0 0 12px #06b6d4;
}


/* =====================================================
   COSMIC CARD
===================================================== */

.cosmic-card {

  width: 100%;

  max-width: 700px;

  margin: 0 auto 20px;

  padding: 22px;

  background:
    rgba(15,23,42,0.88);

  border:
    1px solid rgba(56,189,248,0.5);

  border-radius: 16px;

  box-shadow:
    0 0 20px rgba(56,189,248,0.25),
    0 0 50px rgba(129,140,248,0.18);

  backdrop-filter: blur(8px);
}


/* =====================================================
   PROFILE
===================================================== */

.profile {

  text-align: center;

  margin-bottom: 20px;
}

.profile-image {

  width: 120px;

  height: 120px;

  margin: 0 auto 15px;

  border-radius: 50%;

  border: 2px solid #38bdf8;

  background:
    radial-gradient(
      circle,
      #1e3a8a,
      #020617
    );

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 3rem;

  box-shadow:
    0 0 20px rgba(56,189,248,0.5);
}


/* =====================================================
   FORM
===================================================== */

.field {

  margin-top: 15px;
}

.field label {

  display: block;

  margin-bottom: 6px;

  font-size: 0.75rem;

  color: #94a3b8;

  text-transform: uppercase;

  letter-spacing: 0.08em;
}

.field input {

  width: 100%;

  padding: 11px;

  border-radius: 8px;

  border:
    1px solid rgba(56,189,248,0.4);

  background:
    #020617;

  color: #67e8f9;

  font-size: 1rem;

  outline: none;
}

.field input:focus {

  border-color: #38bdf8;

  box-shadow:
    0 0 12px rgba(56,189,248,0.3);
}


/* =====================================================
   ACCOUNT INFORMATION
===================================================== */

.info-row {

  margin-top: 12px;

  padding: 10px;

  background:
    rgba(2,6,23,0.8);

  border-radius: 8px;

  border:
    1px solid rgba(56,189,248,0.15);
}

.info-label {

  font-size: 0.75rem;

  color: #94a3b8;

  text-transform: uppercase;

  letter-spacing: 0.08em;
}

.info-value {

  margin-top: 4px;

  color: #38bdf8;

  word-break: break-all;
}


/* =====================================================
   PERMISSION
===================================================== */

.permission {

  margin-top: 12px;

  padding: 12px;

  text-align: center;

  border-radius: 8px;

  background:
    rgba(2,6,23,0.8);

  border:
    1px solid rgba(168,85,247,0.4);
}

.permission-value {

  margin-top: 5px;

  color: #c084fc;

  font-weight: 700;
}


/* =====================================================
   BUTTON
===================================================== */

button {

  display: block;

  width: 100%;

  padding: 11px 20px;

  border: none;

  border-radius: 999px;

  margin-top: 20px;

  cursor: pointer;

  font-weight: 700;

  text-transform: uppercase;

  color: #020617;

  background:
    linear-gradient(
      90deg,
      #22c55e,
      #06b6d4
    );

  box-shadow:
    0 0 15px rgba(6,182,212,0.4);
}

button:hover {

  box-shadow:
    0 0 25px rgba(6,182,212,0.7);
}


/* =====================================================
   STATUS
===================================================== */

#status {

  text-align: center;

  color: #94a3b8;

  margin-bottom: 15px;
}

#saveStatus {

  margin-top: 12px;

  text-align: center;

  color: #67e8f9;

  min-height: 20px;
}

.hidden {

  display: none;
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

  <img
    src="https://raw.githubusercontent.com/superflowercodex/GLCTC1Music/main/Screenshot_20260813_132807_Gallery.jpg"
    alt="GLCTC1"
  >

  <h1>
    GLCTC1 ARTIST
  </h1>

</div>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="account-nav">

  <a href="index.html">
    🏠 HOME
  </a>

  |

  <a href="upload.html">
    🎵 GLCTC1 MUSIC
  </a>

</nav>


<!-- =====================================================
     STATUS
===================================================== -->

<div
  id="status"
  class="cosmic-card"
>
  Checking account...
</div>


<!-- =====================================================
     PROFILE
===================================================== -->

<div
  id="profileCard"
  class="cosmic-card hidden"
>


  <div class="profile">

    <div class="profile-image">
      🎤
    </div>

  </div>


  <!-- ===================================================
       ARTIST NAME
  ==================================================== -->

  <div class="field">

    <label for="artistName">
      Artist Name
    </label>

    <input
      id="artistName"
      type="text"
      maxlength="100"
      placeholder="Enter your artist name"
      autocomplete="off"
    >

  </div>


  <!-- ===================================================
       EMAIL
  ==================================================== -->

  <div class="info-row">

    <div class="info-label">
      Account Email
    </div>

    <div
      id="accountEmail"
      class="info-value"
    ></div>

  </div>


  <!-- ===================================================
       USER ID
  ==================================================== -->

  <div class="info-row">

    <div class="info-label">
      GLCTC1 User ID
    </div>

    <div
      id="userId"
      class="info-value"
    ></div>

  </div>


  <!-- ===================================================
       PERMISSION
  ==================================================== -->

  <div class="permission">

    <div class="info-label">
      Account Permission
    </div>

    <div
      id="permission"
      class="permission-value"
    >
      Standard User
    </div>

  </div>


  <!-- ===================================================
       SAVE PROFILE
  ==================================================== -->

  <button id="saveProfileBtn">

    💾 SAVE ARTIST PROFILE

  </button>


  <div id="saveStatus"></div>


  <!-- ===================================================
       LOG OUT
  =================================================== -->

  <button id="logoutBtn">

    🚪 LOG OUT

  </button>

</div>


<script>


// =====================================================
// SUPABASE
// =====================================================

const supabaseUrl =
  "https://zdlaloiruxamxsduxqxw.supabase.co";


const supabaseKey =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbGFsb2lydXhhbXhzZHV4cXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTc3MTEsImV4cCI6MjEwMDg5MzcxMX0.m1MdepLYwqZuu3fGVzDfaFUkdW4rSsKt1Z85UDbpRBQRE";


const supabaseClient =
  supabase.createClient(
    supabaseUrl,
    supabaseKey
  );


// =====================================================
// ADMIN USER
// =====================================================

const ADMIN_USER_ID =
  "8c70a492-3cf1-4053-b0ee-b5b186529d54";


// =====================================================
// LOAD ACCOUNT
// =====================================================

(async () => {

  const {
    data: { session },
    error
  } =
    await supabaseClient.auth.getSession();


  // ---------------------------------------------------
  // ERROR
  // ---------------------------------------------------

  if (error) {

    document.getElementById("status").textContent =
      "Unable to check account.";

    console.error(error);

    return;
  }


  // ---------------------------------------------------
  // NOT LOGGED IN
  // ---------------------------------------------------

  if (!session) {

    document.getElementById("status").textContent =
      "You are not signed in.";

    return;
  }


  // ---------------------------------------------------
  // USER
  // ---------------------------------------------------

  const user = session.user;


  // ---------------------------------------------------
  // SHOW PROFILE
  // ---------------------------------------------------

  document
    .getElementById("profileCard")
    .classList.remove("hidden");


  document
    .getElementById("status")
    .textContent =
      "Welcome to your GLCTC1 Artist Profile.";


  // ---------------------------------------------------
  // EMAIL
  // ---------------------------------------------------

  document
    .getElementById("accountEmail")
    .textContent =
      user.email || "";


  // ---------------------------------------------------
  // USER ID
  // ---------------------------------------------------

  document
    .getElementById("userId")
    .textContent =
      user.id;


  // ---------------------------------------------------
  // ADMIN / STANDARD USER
  // ---------------------------------------------------

  const permission =
    document.getElementById("permission");


  if (user.id === ADMIN_USER_ID) {

    permission.textContent =
      "Administrator";

  } else {

    permission.textContent =
      "Standard User";

  }


  // ---------------------------------------------------
  // LOAD ARTIST NAME
  // ---------------------------------------------------

  const savedArtistName =
    user.user_metadata?.artist_name || "";


  document
    .getElementById("artistName")
    .value =
      savedArtistName;

})();


// =====================================================
// SAVE ARTIST PROFILE
// =====================================================

document
  .getElementById("saveProfileBtn")
  .onclick = async () => {


  const artistName =
    document
      .getElementById("artistName")
      .value
      .trim();


  const saveStatus =
    document.getElementById("saveStatus");


  if (!artistName) {

    saveStatus.textContent =
      "Please enter your artist name.";

    return;
  }


  saveStatus.textContent =
    "Saving artist profile...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.updateUser({

      data: {
        artist_name: artistName
      }

    });


  if (error) {

    saveStatus.textContent =
      error.message;

    console.error(error);

    return;
  }


  saveStatus.textContent =
    "✓ Artist profile saved.";


  console.log(
    "Updated user:",
    data.user
  );

};


// =====================================================
// LOG OUT
// =====================================================

document
  .getElementById("logoutBtn")
  .onclick = async () => {


  await supabaseClient.auth.signOut();


  window.location.href =
    "index.html";

};

</script>

</body>

</html>
